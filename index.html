r reflection will develop the most important fact of all and that is, if someone had not discovered the law by which this tremendous mass of steel and iron could be made to float upon the water, instead of immediately going to the bottom, the battleship could not have come into existence at all.", "32. This law is that, “the specific gravity of any substance is the weight of any volume of it, compared with an equal volume of water.” The discovery of this law revolutionized every kind of ocean travel, commerce and warfare, and made the existence of the battleship, aircraft carriers, and cruise ships possible.", "33. You will find exercises of this kind invaluable. When the thought has been trained to look below the surface everything takes on a different appearance, the insignificant becomes significant, the uninteresting interesting; the things which we supposed to be of no importance are seen to be the only really vital things in existence.", "Look To This Day For it is Life, the very Life of Life. In Its brief course lie all the Verities and Realities of your existence; The Bliss of Growth; The Glory of Action; The Splendor of Beauty; For Yesterday is but a Dream, And tomorrow is only a Vision: But Today well lived makes every Yesterday a Dream of Happiness, and Every Tomorrow a Vision of Hope. Look well, therefore, to This Day!", "From the Sanskrit"], "qa": [{"q": "What is the imagination?", "a": "A form of constructive thought. The light by which we penetrate new worlds of thought and experience. The mighty instrument by which every inventor or discoverer opened the way from precedent to experience."}, {"q": "What is the result of imagination?", "a": "The cultivation of the imagination leads to the development of the ideal out of which your future will emerge."}, {"q": "How may it be cultivated?", "a": "By exercise; it must be supplied with nourishment or it cannot live."}, {"q": "How does imagination differ from daydreaming?", "a": "Day dreaming is a form of mental dissipation, while imagination is a form of constructive thought which must precede every constructive action."}, {"q": "What are mistakes?", "a": "The result of ignorance."}, {"q": "What is knowledge?", "a": "The result of man’s ability to think."}, {"q": "What is the power with which successful men build?", "a": "Mind is the very moving force with which they secure the persons and circumstances necessary to complete their plans."}, {"q": "What pre-determines the result?", "a": "The ideal held steadily in mind attracts the necessary conditions for its fulfillment."}, {"q": "What is the result of a keen analytical observation?", "a": "The development of imagination, insight, perception and sagacity."}, {"q": "To what do these lead?", "a": "Opulence and harmony."}]}, {"id": "mkp-9", "title": "Part Nine", "n": 9, "letter": ["In this Part you may learn to fashion the tools by which you may build for yourself any condition you desire. If you wish to change conditions you must change yourself. Your whims, your wishes, your fancies, your ambitions may be thwarted at every step, but your inmost thoughts will find expression just as certainly as the plant springs from the seed.", "Suppose, then, we desire to change conditions, how are we to bring this about? The reply is simple: By the law of growth. Cause and effect are as absolute and undeviating in the hidden realm of thought as in the world of material things.", "Hold in mind the condition desired; affirm it as an already existing fact. This indicates the value of a powerful affirmation. By constant repetition it becomes a part of ourselves. We are actually changing ourselves; are making ourselves what we want to be.", "Character is not a thing of chance, but it is the result of continued effort. If you are timid, vacillating, self-conscious, or if you are over-anxious or harassed by thoughts of fear or impending danger, remember that is axiomatic that “two things cannot exist in the same place at the same time.”", "Exactly the same thing is true in the mental and spiritual world; so that your remedy is plainly to substitute thoughts of courage, power, self-reliance and confidence, for those of fear, lack and limitation.", "The easiest and most natural way to do this is to select an affirmation which seems to fit your particular case.", "The positive thought will destroy the negative as certainly as light destroys darkness, and the results will be just as effectual.", "Act is the blossom of thought, and conditions are the result of action, so that you constantly have in your possession the tools by which you will certainly and inevitably make or unmake yourself, and joy or suffering will be the reward."], "body": ["1. There are only three things which can possibly be desired in the “world without” and each of them can be found in the “world within.” The secret of finding them is simply to apply the proper “mechanism” of attachment to the omnipotent power to which each individual has access.", "2. The three things which all mankind desires and which are necessary for his highest expression and complete development are Health, Wealth and Love. All will admit that Health is absolutely essential; no one can be happy if the physical body is in pain. All will not so readily admit that Wealth is necessary, but all must admit that a sufficient supply at least is necessary, and what would be considered sufficient for one, would be considered absolute and painful lack for another; and as Nature provides not only enough but abundantly, wastefully, lavishly, we realize that any lack or limitation is only the limitation which has been made by an artificial method of distribution.", "3. All will probably admit that Love is the third, or maybe some will say the first essential necessary to the happiness of mankind; at any rate, those who possess all three, Health, Wealth, and Love, find nothing else which can be added to their cup of happiness.", "4. We have found that the Universal substance is “All Health,” “All Substance” and “All Love” and that the mechanism of attachment whereby we can consciously connect with this Infinite supply is in our method of thinking. To think correctly is therefore to enter into the “Secret Place of the Most High.”", "5. What shall we think? If we know this we shall have found the proper mechanism of attachment which will relate us to “Whatsoever things we desire.” This mechanism may seem very simple when I give it to you, but read on; you will find that it is in reality the “Master Key,” the “Aladdin’s lamp,” if you please; you will find that it is the foundation, the imperative condition, the absolute law of well-doing, which means, well-being.", "6. To think correctly, accurately, we must know the “Truth.” The truth then is the underlying principle in every business or social relation. It is a condition precedent to every right action. To know the truth, to be sure, to be confident, affords a satisfaction beside which no other is at all comparable; it is the only solid ground in a world of doubt, conflict and danger.", "7. To know the Truth is to be in harmony with the Infinite and Omnipotent power. To know the truth is, therefore, to connect yourself with a power which is irresistible and which will sweep away every kind of discord, inharmony, doubt or error of any kind, because the “Truth is mighty and will prevail.”", "8. The humblest intellect can readily foretell the result of any action when he knows that it is based on truth, but the mightiest intellect, the most profound and penetrating mind loses its way hopelessly and can form no conception of the results which may ensue when his hopes are based on a premise which he knows to be false.", "9. Every action which is not in harmony with Truth, whether through ignorance or design, will result in discord, and eventual loss in proportion to its extent and character.", "10. How then are we to know the truth in order to attach this mechanism which will relate us to the Infinite?", "11. We can make no mistake about this if we realize that truth is the vital principle of the Universal Mind and is Omnipresent. For instance, if you require health, a realization of the fact that the “I” in you is spiritual and that all spirit is one; that wherever a part is the whole must be, will bring about a condition of health, because every cell in the body must manifest the truth as you see it. If you see sickness; they will manifest sickness; if you see perfection they must manifest perfection. The affirmation, “I am whole, perfect, strong, powerful, loving, harmonious and happy”, will bring about harmonious conditions. The reason for this is because the affirmation is in strict accordance with the Truth, and when truth appears every form of error or discord must necessarily disappear.", "12. You have found that the “I” is spiritual, it must necessarily then always be no less than perfect, the affirmation. “I am whole, perfect, strong, powerful, loving, harmonious and happy” is therefore an exact scientific statement.", "13. Thought is a spiritual activity and spirit is creative, therefore the result of holding this thought in mind, must necessarily bring about conditions in harmony with the thought.", "14. If you require Wealth a realization of the fact that the “I” in you is one with the Universal mind which is all substance, and is Omnipotent, will assist you in bringing into operation the law of attraction which will bring you into vibration with those forces which make for success and bring about conditions of power and affluence in direct proportion with the character and purpose of your affirmation.", "15. Visualization is the mechanism of the attachment which you require. Visualization is a very different process from seeing; seeing is physical, and is therefore related to the objective world, the “world without,” but Visualization is a product of the imagination, and is therefore a product of the subjective mind, the “world within.” It therefore possesses vitality; it will grow. The thing visualized will manifest itself in form. The mechanism is perfect; it was created by the Master Architect who “doeth all things well,” but unfortunately sometimes the operator is inexperienced or inefficient, but practice and determination will overcome this defect.", "16. If you require Love try to realize that the only way to get love is by giving it, that the more you give the more you will get, and the only way in which you can give it, is to fill yourself with it, until you become a magnet. The method was explained in another lesson.", "17. He who has learned to bring the greatest spiritual truths into touch with the so-called lesser things of life has discovered the secret of the solution of his problem. One is always quickened, made more thoughtful, by his nearness of approach to great ideas, great events, great natural objects, and great men. Lincoln is said to have begotten in all who came near him the feeling awakened when one approaches a mountain, and this sense asserts itself most keenly when one comes to realize that he has laid hold upon things that are eternal, the power of Truth.", "18. It is sometimes an inspiration to hear from someone who has actually put these principles to the test, someone who has demonstrated them in their own life. A letter from Frederick Andrews offers the following insight:", "19. I was about thirteen years old when Dr. T. W. Marsee, since passed over, said to my mother: “There is no possible chance, Mrs. Andrews. I lost my little boy the same way, after doing everything for him that it was possible to do. I have made a special study of these cases, and I know there is no possible chance for him to get well.”", "20. She turned to him and said: “Doctor, what would you do if he were your boy?” and he answered, “I would fight, fight, as long as there is a breath of life to fight for.”", "21. That was the beginning of a long drawn-out battle, with many ups and downs, the doctors all agreeing that there was no chance for a cure, though they encouraged and cheered us the best they could.", "22. But at last the victory came, and I have grown from a little, crooked, twisted, cripple, going about on my hands and knees, to a strong, straight, well formed man.", "23. Now, I know you want the formula, and I will give it to you as briefly and quickly as I can.", "24. I built up an affirmation for myself, taking the qualities I most needed, and affirming for myself over and over again, “I am whole, perfect, strong, powerful, loving, harmonious and happy.” I kept up this affirmation, always the same, never varying, till I could wake up in the night and find myself repeating, “I am whole, perfect, strong, powerful, loving, harmonious and happy.” It was the last thing on my lips at night and the first thing in the morning.", "25. Not only did I affirm it for myself, but for others that I knew needed it. I want to emphasize this point. Whatever you desire for yourself, affirm it for others, and it will help you both. We reap what we sow. If we send out thoughts of love and health, they return to us like bread cast upon the waters; but if we send out thoughts of fear, worry, jealousy, anger, hate, etc., we will reap the results in our own lives.", "26. It used to be said that man is completely built over every seven years, but some scientists now declare that we build ourselves over entirely every eleven months; so we are really only eleven months old. If we build the defects back into our bodies year after year, we have no one to blame but ourselves.", "27. Man is the sum total of his own thoughts; so the question is, how are we going to entertain only the good thoughts and reject the evil ones? At first we can’t keep the evil thoughts from coming, but we can keep from entertaining them. The only way to do this is to forget them—which means, get something for them. This is where the ready-made affirmation comes into play.", "28. When a thought of anger, jealousy, fear or worry creeps in, just start your affirmation going. The way to fight darkness is with light—the way to fight cold is with heat—the way to overcome evils is with good. For myself, I never could find any help in denials. Affirm the good, and the bad will vanish. - Frederick Elias Andrews", "29. If there is anything you require, it will be well for you to make use of this affirmation; it cannot be improved upon. Use it just as it is; take it into the silence with you, until it sinks into your subconsciousness, so that you can use it anywhere, in your car, in the office, at home; this is the advantage of spiritual methods; they are always available. Spirit is omnipresent, every ready; all that is required is a proper recognition of its omnipotence, and a willingness or desire to become the recipient of its beneficent effects.", "30. If our predominant mental attitude is one of power, courage, kindliness and sympathy, we shall find that our environment will reject conditions in correspondence with these thoughts; if it is weak, critical, envious and destructive, we shall find our environment reflecting conditions corresponding to these thoughts.", "31. Thoughts are causes and conditions are effects. Herein is the explanation of the origin of both good and evil. Thought is creative and will automatically correlate with its object. This is a Cosmological law (a universal law), the law of Attraction, the law of Cause and Effect; the recognition and application of this law will determine both beginning and end; it is the law by which in all ages and in all times the people were led to believe in the power of prayer. “As thy faith is, so be it unto thee,” is simply another, shorter and a better way of stating it.", "32. This week visualize a plant; take a flower, the one you most admire, bring it from the unseen into the seen, plant the tiny seed, water it, care for it, place it where it will get the direct rays of the morning sun, see the seed burst; it is now a living thing, something which is alive and beginning to search for the means of subsistence. See the roots penetrating the earth, watch them shoot out in all directions and remember that they are living cells dividing and subdividing, and that they will soon number millions, that each cell is intelligent, that it knows what is wants and knows how to get it. See the stem shoot forward and upward, watch it burst through the surface of the earth, see it divide and form branches, see how perfect and symmetrical each branch is formed, see the leaves begin to form, and then the tiny stems, each one holding aloft a bud, and as you watch you see the bud begin to unfold and your favorite flower comes to view; and now if you will concentrate intently you will become conscious of a fragrance; it is the fragrance of the flower as the breeze gently sways the beautiful creation which you have visualized.", "33. When you are enabled to make your vision clear and complete you will be enabled to enter into the spirit of a thing; it will become very real to you; you will be learning to concentrate and the process is the same, whether you are concentrating on health, a favorite flower, an ideal, a complicated business proposition or any other problem of life.", "34. Every success has been accomplished by persistent concentration upon the object in view."], "qa": [{"q": "What is the imperative condition of all well-being?", "a": "Well doing."}, {"q": "What is the condition precedent to every right action?", "a": "Right thinking."}, {"q": "What is the underlying condition necessary in every business transaction or social relation?", "a": "To know the Truth."}, {"q": "What is the result of a knowledge of the Truth?", "a": "We can readily predict the result of any action that is based upon a true premise."}, {"q": "What is the result of any action based upon a false premise?", "a": "We can form no conception of the results which may ensue."}, {"q": "How may we know the Truth?", "a": "By a realization of the fact that Truth is the vital principle of the Universe and is therefore omnipresent."}, {"q": "What is the nature of Truth?", "a": "It is spiritual."}, {"q": "What is the secret of the solution to every problem?", "a": "To apply spiritual Truth."}, {"q": "What is the advantage of spiritual methods?", "a": "They are always available."}, {"q": "What are the necessary requirements?", "a": "A recognition of the omnipotence of spiritual power and a desire to become the recipient of its beneficent effects."}]}, {"id": "mkp-10", "title": "Part Ten", "n": 10, "letter": ["Thought means life, since those who do not think do not live in any high or real sense. Thinking makes the man.", "A. B. Alcott", "If you get a thorough understanding of the thought contained in Part Ten, you will have learned that nothing happens without a definite cause. You will be enabled to formulate your plans in accordance with exact knowledge. You will know how to control any situation by bringing adequate causes into play. When you win, as you will, you will know exactly why.", "The ordinary man, who has no definite knowledge of cause and effect, is governed by his feelings or emotions.", "He thinks chiefly to justify his action. If he fails as a businessman, he says that luck is against him. If he dislikes music, he says that music is an expensive luxury. If he is a poor office man, he says that he could succeed better at some outdoor work. If he lacks friends, he says his individuality is too fine to be appreciated.", "He never thinks his problem through to the end. In short, he does not know that every effect is the result of a certain definite cause, but he seeks to console himself with explanations and excuses. He thinks only in self-defence.", "On the contrary, the man who understands that there is no effect without an adequate cause thinks impersonally. He gets down to bedrock facts regardless of consequences. He is free to follow the trail of truth wherever it may lead. He sees the issue clear to the end, and he meets the requirements fully and fairly, and the result is that the world gives him all that it has to give, in friendship, honor, love and approval."], "body": ["1. Abundance is a natural law of the Universe. The evidence of this law is conclusive; we see it on every hand. Everywhere Nature is lavish, wasteful, extravagant. Nowhere is economy observed in any created thing. Profusion is manifested in everything. The millions and millions of trees and flowers and plants and animals and the vast scheme of reproduction where the process of creating and recreating is forever going on, all indicates the lavishness with which Nature has made provision for man. That there is an abundance for everyone is evident, but that many fail to participate in this abundance is also evident; they have not yet come into a realization of the Universality of all substance, and that mind is the active principle whereby we are related to the things we desire.", "2. All wealth is the offspring of power; possessions are of value only as they confer power. Events are significant only as they affect power; all things represent certain forms and degrees of power.", "3. Knowledge of cause and effect as shown by the laws governing electricity, chemical affinity and gravitation, enables man to plan courageously and execute fearlessly. These laws are called Natural Laws, because they govern in the physical world, but all power is not physical power; there is also mental power, and there is moral and spiritual power.", "4. Spiritual power is superior because it exists on a higher plane. It has enabled man to discover the law by which these wonderful forces of Nature could be harnessed and made to do the work of hundreds and thousands of men. It has enabled man to discover laws whereby time and space have been annihilated and the law of gravitation to be overcome. The operation of this law is dependent upon spiritual contact, as Henry Drummond well says:", "5. “In the physical world as we know it, there exists the organic and the inorganic. The inorganic of the mineral world is absolutely cut off from the plant or animal world; the passage is hermetically sealed. These barriers have never yet been crossed. No change of substance, no modification of environment, no chemistry, no electricity, no form of energy, no evolution of any kind can ever endow a single atom of the mineral world with the attribute of Life.”", "6. “Only by the bending down into this dead world of some living form can those dead atoms be gifted with the properties of vitality; without this contact with life they remain fixed in the inorganic sphere forever. Huxley says that the doctrine of Biogenesis (or life only from life) is victorious all along the line, and Tyndall is compelled to say: ‘I affirm that no shred of trustworthy evidence exists to prove that life in our day has ever appeared independent of antecedent life.’", "7. “Physical laws may explain the inorganic, Biology explains and accounts for the development of the organic, but of the point of contact Science is silent. A similar passage exists between the Natural world and the Spiritual world; this passage is hermetically sealed on the natural side. The door is closed; no man can open it, no organic change, no mental energy, no moral effort, no progress of any kind can enable any human being to enter the spiritual world.”", "8. But as the plant reaches down into the mineral world and touches it with the mystery of Life, so the Universal Mind reaches down into the human mind and endows it with new, strange, wonderful and even marvelous qualities. All men or women who have every accomplished anything in the world of industry, commerce or art have accomplished because of this process.", "9. Thought is the connecting link between the Infinite and the finite, between the Universal and the individual. We have seen that there is an impassable barrier between the organic and the inorganic, and that the only way that matter can unfold is to be impregnated with life; as a seed reaches down into the mineral world and begins to unfold and reach out, the dead matter begins to live, a thousand invisible fingers begin to weave a suitable environment for the new arrival, and as the law of growth begins to take effect, we see the process continue until the Lily finally appears, and even “Solomon in all his glory was not arrayed like one of these”.", "10. Even so, a thought is dropped into the invisible substance of the Universal Mind, that substance from which all things are created, and as it takes root, the law of growth begins to take effect and we find that conditions and environment are but the objective form of our thought.", "11. The law is that Thought is an active vital form of dynamic energy which has the power to correlate with its object and bring it out of the invisible substance from which all things are created into the visible or objective world. This is the law by which, and through which all things come into manifestation; it is the Master Key by which you are admitted into the Secret Place of the Most High and are “given dominion over all things.” With an understanding of this law you may “decree a thing and it shall be established unto thee.”", "12. It could not be otherwise; if the soul of the Universe as we know it is the Universal Spirit, then the Universe is simply the condition which the Universal Spirit has made for itself. We are simply individualized spirit and are creating the conditions for our growth in exactly the same way.", "13. This creative power depends upon our recognition of the potential power of spirit or mind and must not be confused with Evolution. Creation is the calling into existence of that which does not exist in the objective world. Evolution is simply the unfolding of potentialities involved in things which already exist.", "14. In taking advantage of the wonderful possibilities opened up to us through the operation of this law, we must remember that we ourselves contribute nothing to its efficacy as the Great Teacher said: “It is not I that doeth the works, but the Father that dwelleth in me, He doeth the work”. We must take exactly the same position; we can do nothing to assist in the manifestation, we simply comply with the law, and the All-originating Mind will bring about the result.", "15. The great error of the present day is the idea that Man has to originate the intelligence whereby the Infinite can proceed to bring about a specific purpose or result. Nothing of this kind is necessary; the Universal Mind can be depended upon to find the ways and means for bringing about any necessary manifestation. We must, however, create the ideal, and this ideal should be perfect.", "16. We know that the laws governing Electricity have been formulated in such a way that this invisible power can be controlled and used for our benefit and comfort in thousands of ways. We know that messages are carried around the world, that ponderous machinery does its bidding, that it now illuminates practically the whole world, but we know too that if we consciously or ignorantly violate its law by touching a live wire, when it is not properly insulated, the result will be unpleasant and possibly disastrous. A lack of understanding of the laws governing in the invisible world has the same result, and many are suffering the consequences all the time.", "17. It has been explained that the law of causation depends upon polarity, a circuit must be formed; this circuit cannot be formed unless we operate in harmony with the law. How shall we operate in harmony with the law unless we know what the law is? How shall we know what the Law is? By study, by observation.", "18. We see the law in operation everywhere; all nature testifies to the operation of the law by silently, constantly expressing itself in the law of growth. Where there is growth, there must be life; where there is life there must be harmony, so that everything that has life is constantly attracting to itself the conditions and the supply which is necessary for its most complete expression.", "19. If your thought is in harmony with the creative Principle of Nature, it is in tune with the Infinite Mind, and it will form the circuit, it will not return to you void; but it is possible for you to think thoughts that are not in tune with the Infinite, and when there is no polarity, the circuit is not formed. What, then, is the result? What is the result when a dynamo is generating electricity, the circuit is cut off and there is no outlet? The dynamo stops.", "20. It will be exactly the same with you, if you entertain thoughts which are not in accordance with the Infinite and cannot therefore be polarized; there is no circuit, you are isolated, the thoughts cling to you, harass you, worry you, and finally bring about disease and possibly death; the physician may not diagnose the case exactly in this way, he may give it some fancy name which has been manufactured for the various ills which are the result of wrong thinking, but the cause is the same nevertheless.", "21. Constructive thought must necessarily be creative, but creative thought must be harmonious, and this eliminates all destructive or competitive thought.", "22. Wisdom, strength, courage and all harmonious conditions are the result of power and we have seen that all power is from within; likewise, every lack, limitation or adverse circumstance is the result of weakness, and weakness is simply absence of power; it comes from nowhere, it is nothing—the remedy then is simply to develop power, and this is accomplished in exactly the same manner that all power is developed, by exercise.", "23. This exercise consists in making an application of your knowledge. Knowledge will not apply itself. You must make the application. Abundance will not come to you out of the sky, neither will it drop into your lap, but a conscious realization of the law of attraction and the intention to bring it into operation for a certain, definite and specific purpose, and the will to carry out this purpose will bring about the materialization of your desire by a natural law of transference. If you are in business, it will increase and develop along regular channels, possibly new or unusual channels of distribution will be opened and when the law becomes fully operative, you will find that the things you seek are seeking you.", "24. This week select a blank space on the wall, or any other convenient spot, from where you usually sit, mentally draw a black horizontal line about six inches long, try to see the line as plainly as though it were painted on the wall; now mentally draw two vertical lines connecting with this horizontal line at either end; now draw another horizontal line connecting with the two vertical lines; now you have a square. Try to see the square perfectly; when you can do so draw a circle within the square; now place a point in the center of the circle; now draw the point toward you about 10 inches; now you have a cone on a square base; you will remember that your work was all in black; change it to white, to red, to yellow.", "25. If you can do this, you are making excellent progress and will soon be enabled to concentrate on any problem you may have in mind.", "When any object or purpose is clearly held in thought, its precipitation, in tangible and visible form, is merely a question of time. The vision always precedes and itself determines the realization.", "Lillian Whiting"], "qa": [{"q": "What is Wealth?", "a": "Wealth is the offspring of power."}, {"q": "Of what value are possessions?", "a": "Possessions are of value only as they confer power."}, {"q": "Of what value is a knowledge of cause and effect?", "a": "It enables men to plan courageously and execute fearlessly."}, {"q": "How does life originate in the inorganic world?", "a": "Only by the introduction of some living form. There is no other way."}, {"q": "What is the connecting link between the finite and the Infinite?", "a": "Thought is the connecting link."}, {"q": "Why is that so?", "a": "Because the Universal can manifest only through the individual."}, {"q": "Upon what does causation depend?", "a": "Upon polarity; a circuit must be formed; the Universal is the positive side of the battery of life, the individual is the negative, and thought forms the circuit."}, {"q": "Why do many fail to secure harmonious conditions?", "a": "They do not understand the law; there is no polarity; they have not formed the circuit."}, {"q": "What is the remedy?", "a": "A conscious recognition of the law of attraction with the intention of bring it into existence for a definite purpose."}, {"q": "What will be the result?", "a": "Thought will correlate with its object and bring it into manifestation, because thought is a product of the spiritual man, and spirit is the creative Principle of the Universe."}]}, {"id": "mkp-11", "title": "Part Eleven", "n": 11, "letter": ["A vivid thought brings the power to paint it; and in proportion to the depth of its source is the force of its projection.", "Emerson", "Your life is governed by law - by actual, immutable principles that never vary. Law is in operation at all times; in all places. Fixed laws underlie all human actions. For this reason, men who control giant industries are enabled to determine with absolute precision just what percentage of every hundred thousand people will respond to any given set of conditions.", "It is well, however, to remember that while every effect is the result of a cause, the effect in turn becomes a cause, which creates other effects, which in turn create still other causes; so that when you put the law of attraction into operation you must remember that you are starting a train of causation for good or otherwise which may have endless possibilities.", "We frequently hear it said, “A very distressing situation came into my life, which could not have been the result of my thought, as I certainly never entertained any thought which could have such a result.” We fail to remember that like attracts like in the mental world, and that the thought which we entertain brings to us certain friendships, companionships of a particular kind, and these in turn bring about conditions and environment, which in turn are responsible for the conditions of which we complain."], "body": ["1. Inductive reasoning is the process of the objective mind by which we compare a number of separate instances with one another until we see the common factor that gives rise to them all.", "2. Induction proceeds by comparison of facts; it is this method of studying nature which has resulted in the discovery of a reign of law which has marked an epoch in human progress.", "3. It is the dividing line between superstition and intelligence; it has eliminated the elements of uncertainty and caprice from men’s lives and substituted law, reason, and certitude.", "4. It is the “Watchman at the Gate” mentioned in a former lesson.", "5. When, by virtue of this principle, the world to which the senses were accustomed had been revolutionized; when the sun had been arrested in his course, the apparently flat earth had been shaped into a ball and set whirling around him; when the inert matter had been resolved into active elements, and the universe presented itself wherever we directed the telescope and microscope, full of force, motion and life; we are constrained to ask by what possible means the delicate forms of organization in the midst of it are kept in order and repair.", "6. Like poles and like forces repel themselves or remain impenetrable to each other, and this cause seems in general sufficient to assign a proper place and distance to stars, men and forces. As men of different virtues enter into partnership, so do opposite poles attract each other, elements that have no property in common like acids and gases cling to each other in preference and a general exchange is kept up between the surplus and the demand.", "7. As the eye seeks and receives satisfaction from colors complementary to those which are given, so does need, want and desire, in the largest sense, induce, guide and determine action.", "8. It is our privilege to become conscious of the principle and act in accordance with it. Cuvier sees a tooth belonging to an extinct race of animals. This tooth wants a body for the performance of its function, and it defines the peculiar body it stands in need of with such precision that Cuvier is able to reconstruct the frame of this animal.", "9. Perturbations are observed in the motion of Uranus. Leverrier needs another star at a certain place to keep the solar system in order, and Neptune appears in the place and hour appointed.", "10. The instinctive wants of the animal and the intellectual wants of Cuvier, the wants of nature and of the mind of Leverrier were alike, and thus the results; here the thoughts of an existence, there an existence. A well-defined lawful want, therefore, furnishes the reason for the more complex operations of nature.", "11. Having recorded correctly the answers furnished by nature and stretched our senses with the growing science over her surface; having joined hands with the levers that move the earth; we become conscious of such a close, varied and deep contact with the world without, that our wants and purposes become no less identified with the harmonious operations of this vast organization, than the life, liberty, and happiness of the citizen is identified with the existence of his government.", "12. As the interests of the individual are protected by the arms of the country, added to his own; and his needs may depend upon certain supply in the degree that they are felt more universally and steadily; in the same manner does conscious citizenship in the Republic of nature secure us from the annoyances of subordinate agents by alliance with superior powers; and by appeal to the fundamental laws of resistance or inducement offered to mechanical or chemical agents, distribute the labor to be performed between them and man to the best advantage of the inventor.", "13. If Plato could have witnessed the pictures executed by the sun with the assistance of the photographer, or a hundred similar illustrations of what man does by induction, he would perhaps have been reminded of the intellectual midwifery of his master and, in his own mind might have arisen the vision of a land where all manual, mechanical labor and repetition is assigned to the power of nature, where our wants are satisfied by purely mental operations set in motion by the will, and where the supply is created by the demand.", "14. However distant that land may appear, induction has taught men to make strides toward it and has surrounded him with benefits which are, at the same time, rewards for past fidelity and incentives for more assiduous devotion.", "15. It is also an aid in concentrating and strengthening our faculties for the remaining part, giving unerring solution for individual as well as universal problems, by the mere operations of mind in the purest form.", "16. Here we find a method, the spirit of which is, to believe that what is sought has been accomplished, in order to accomplish it: a method, bequeathed upon us by the same Plato who, outside of this sphere, could never find how the ideas became realities.", "17. This conception is also elaborated by Swedenborg in his doctrine of correspondences; and a still greater teacher has said, “What things soever ye desire, when ye pray, believe that ye receive them, and ye shall have them.” (Mark 11:24) The difference of the tenses in this passage is remarkable.", "18. We are first to believe that our desire has already been fulfilled, its accomplishment will then follow. This is a concise direction for making use of the creative power of thought by impressing on the Universal subjective mind, the particular thing which we desire as an already existing fact.", "19. We are thus thinking on the plane of the absolute and eliminating all consideration of conditions or limitation and are planting a seed which, if left undisturbed, will finally germinate into external fruition.", "20. To review: Inductive reasoning is the process of the objective mind, by which we compare a number of separate instances with one another until we see the common factor that gives rise to them all. We see people in every civilized country on the globe, securing results by some process which they do not seem to understand themselves, and to which they usually attach more or less mystery. Our reason is given to us for the purpose of ascertaining the law by which these results are accomplished.", "21. The operation of this thought process is seen in those fortunate natures that possess everything that others must acquire by toil, who never have a struggle with conscience because they always act correctly, and can never conduct themselves otherwise than with tact, learn everything easily, complete everything they begin with a happy knack, live in eternal harmony with themselves, without ever reflecting much what they do, or ever experiencing difficulty or toil.", "22. The fruit of this thought is, as it were, a gift of the gods, but a gift which few as yet realize, appreciate, or understand. The recognition of the marvelous power which is possessed by the mind under proper conditions and the fact that this power can be utilized, directed, and made available for the solution of every human problem is of transcendental importance.", "23. All truth is the same, whether stated in modern scientific terms or in the language of apostolic times. There are timid souls who fail to realize that the very completeness of truth requires various statements—that no one human formula will show every side of it.", "24. Changing, emphasis, new language, novel interpretations, unfamiliar perspectives, are not, as some suppose, signs of departure from truth but on the contrary, they are evidence that the truth is being apprehended in new relations to human needs, and is becoming more generally understood.", "25. The truth must be told to each generation and to every people in new and different terms, so that when the Great Teacher said—“Believe that ye receive and ye shall receive” or, when Paul said—“Faith is the substance of things hoped for, the evidence of things not seen” or, when modern science says—“The law of attraction is the law by which thought correlates with its object”, each statement when subjected to analysis, is found to contain exactly the same truth. The only difference being in the form of presentation.", "26. We are standing on the threshold of a new era. The time has arrived when man has learned the secrets of mastery and the way is being prepared for a new social order, more wonderful than anything every heretofore dreamed of. The conflict of modern science with theology, the study of comparative religions, the tremendous power of new social movements, all of these are but clearing the way for the new order. They may have destroyed traditional forms which have become antiquated and impotent, but nothing of value has been lost.", "27. A new faith has been born, a faith which demands a new form of expression, and this faith is taking form in a deep consciousness of power which is being manifested, in the present spiritual activity found on every hand.", "28. The spirit which sleeps in the mineral, breathes in the vegetable, moves in the animal and reaches its highest development in man is the Universal Mind, and it behooves us to span the gulf between being and doing, theory and practice, by demonstrating our understanding of the dominion which we have been given.", "29. By far the greatest discovery of all the centuries is the power of thought. The importance of this discovery has been a little slow in reaching the general consciousness, but it has arrived, and already in every field of research the importance of this greatest of all great discoveries is being demonstrated.", "30. You ask in what does the creative power of thought consist? It consists in creating ideas, and these in turn objectify themselves by appropriating, inventing, observing, discerning, discovering, analyzing, ruling, governing, combining, and applying matter and force. It can do this because it is an intelligent creative power.", "31. Thought reaches its loftiest activity when plunged into its own mysterious depth; when it breaks through the narrow compass of self and passes from truth to truth to the region of eternal light, where all which is, was or ever will be, melt into one grand harmony.", "32. From this process of self contemplation comes inspiration which is creative intelligence, and which is undeniably superior to every element, force or law of nature, because it can understand, modify, govern and apply them to its own ends and purposes and therefore possess them.", "33. Wisdom begins with the dawn of reason, and reason is but an understanding of the knowledge and principles whereby we may know the true meaning of things. Wisdom, then, is illuminated reason, and this wisdom leads to humility, for humility is a large part of Wisdom.", "34. We all know many who have achieved the seemingly impossible, who have realized life-long dreams, who have changed everything including themselves. We have sometimes marveled at the demonstration of an apparently irresistible power, which seemed to be ever available just when it was most needed, but it is all clear now. All that is required is an understanding of certain definite fundamental principles and their proper application.", "35. For your exercise this week, concentrate on the quotation taken from the Bible, “Whatsoever things ye desire, when ye pray, believe that ye receive them and ye shall have them”; notice that there is no limitation, “Whatsoever things” is very definite and implies that the only limitation which is placed upon us in our ability to think, to be equal to the occasion, to rise to the emergency, to remember that Faith is not a shadow, but a substance, “the substance of things hoped for, the evidence of things not seen.”", "Death is but the natural process whereby all material forms are thrown into the crucible for reproduction in fresh diversity."], "qa": [{"q": "What is inductive reasoning?", "a": "The process of the objective mind by which we compare a number of separate instances with each other until we see the common factor which gives rise to them all."}, {"q": "What has this method of studying accomplished?", "a": "It has resulted in the discovery of a reign of law which has marked an epoch in human progress."}, {"q": "What is it that guides and determines action?", "a": "It is need, want and desire which in the largest sense induce, guide and determine action."}, {"q": "What is the formula for the unerring solution of every individual problem?", "a": "We are to believe that our desire has already been fulfilled; its accomplishment will then follow."}, {"q": "What great Teachers advocated it?", "a": "Jesus, Plato, Swedenborg."}, {"q": "What is the result of this thought process?", "a": "We are thinking on the plane of the absolute and planting a seed, which if left undisturbed will germinate into fruition."}, {"q": "Why is it scientifically exact?", "a": "Because it is Natural Law."}, {"q": "What is Faith?", "a": "“Faith is the substance of things hoped for, the evidence of things unseen.”"}, {"q": "What is the Law of Attraction?", "a": "The Law by which Faith is brought into manifestation."}, {"q": "What importance do you attach to an understanding of this law?", "a": "It has eliminated the elements of uncertainty and caprice from men’s lives and substituted law, reason, and certitude."}]}, {"id": "mkp-12", "title": "Part Twelve", "n": 12, "letter": ["Part Twelve is enclosed herewith. In the fourth paragraph you will find the following statement: “You must first have the knowledge of your power; second, the courage to dare; third, the faith to do.” If you concentrate upon the thoughts given, if you give them your entire attention, you will find a world of meaning in each sentence, and will attract to yourself other thoughts in harmony with them, and you will soon grasp the full significance of the vital knowledge upon which you are concentrating.", "Knowledge does not apply itself; we as individuals must make the application, and the application consists in fertilizing the thought with a living purpose.", "The time and thought which most persons waste in aimless effort would accomplish wonders if properly directed with some special object in view. In order to do this, it is necessary to center your mental force upon a specific thought and hold it there, to the exclusion of all other thoughts. If you have ever looked through the viewfinder of a camera, you found that when the object was not in focus, the impression was indistinct and possibly blurred, but when the proper focus was obtained the picture was clear and distinct. This illustrates the power of concentration. Unless you can concentrate upon the object which you have in view, you will have but a hazy, indifferent, vague, indistinct and blurred outline of your ideal and the results will be in accordance with your mental picture."], "body": ["1. There is no purpose in life that cannot be best accomplished through a scientific understanding of the creative power of thought.", "2. This power to think is common to all. Man is, because he thinks. Man’s power to think is infinite, consequently his creative power is unlimited.", "3. We know that thought is building for us the thing we think of and actually bringing it nearer, yet we find it difficult to banish fear, anxiety or discouragement, all of which are powerful thought forces, and which continually send the things we desire further away, so that it is often one step forward and two steps backward.", "4. The only way to keep from going backward is to keep going forward. Eternal vigilance is the price of success. There are three steps, and each one is absolutely essential. You must first have the knowledge of your power; second, the courage to dare; third, the faith to do.", "5. With this as a basis you can construct an ideal business, an ideal home, ideal friends, and an ideal environment. You are not restricted as to material or cost. Thought is omnipotent and has the power to draw on the Infinite bank of primary substance for all that it requires. Infinite resources are therefore at your command.", "6. But your ideal must be sharp, clear-cut, definite; to have one ideal today, another tomorrow, and a third next week, means to scatter your forces and accomplish nothing; your result will be a meaningless and chaotic combination of wasted material.", "7. Unfortunately this is the result which many are securing, and the cause is self evident. If a sculptor started out with a piece of marble and a chisel and changed his ideal every fifteen minutes, what result could he expect? And why should you expect any different result in molding the greatest and most plastic of all substances, the only real substance?", "8. The result of this indecision and negative thought is often found in the loss of material wealth. Supposed independence which required many years of toil and effort suddenly disappears. It is often found then that money and property are not independence at all. On the contrary, the only independence is found to be a practical working knowledge of the creative power of thought.", "9. This practical working method cannot come to you until you learn that the only real power which you can have is the power to adjust yourself to Divine and unchangeable principles. You cannot change the Infinite, but you can come into an understanding of Natural laws. The reward of this understanding is a conscious realization of your ability to adjust your thought faculties with the Universal Thought which is Omnipresent. Your ability to cooperate with this Omnipotence will indicate the degree of success with which you meet.", "10. The power of thought has many counterfeits which are more or less fascinating, but the results are harmful instead of helpful.", "11. Of course, worry, fear, and all negative thoughts produce a crop after their kind; those who harbor thoughts of this kind must inevitably reap what they have sown.", "12. Again, there are the Phenomena seekers who gormandize on the so-called proofs and demonstration obtained at materializing séances. They throw open their mental doors and soak themselves in the most poisonous currents which can be found in the psychic world. They do not seem to understand that it is the ability to become negative, receptive and passive, and thus drain themselves of all their vital force, which enables them to bring about these vibratory thought forms.", "13. There are also the Hindu worshippers, who see in the materializing phenomena which are performed by the so-called adepts, a source of power, forgetting, or never seeming to realize that as soon as the will is withdrawn the forms wither, and the vibratory forces of which they are composed vanish.", "14. Telepathy, or thought transference, has received considerable attention, but as it requires a negative mental state on the part of the receiver, the practice is harmful. A thought may be sent with the intention of hearing or seeing, but it will bring the penalty attached to the inversion of the principle involved.", "15. In many instances, hypnotism is positively dangerous to the subject as well as the operator. No one familiar with the laws governing in the mental world would think of attempting to dominate the will of another, for by so doing, he will gradually (but surely) divest himself of his own power.", "16. All of these perversions have their temporary satisfaction and for some a keen fascination, but there is an infinitely greater fascination in a true understanding of the world of power within, a power which increases with use; is permanent instead of fleeing; which not only is potent as a remedial agency to bring about the remedy for past error or results of wrong thinking, but is a prophylactic agency protecting us from all manner and form of danger, and finally is an actual creative force with which we can build new conditions and new environment.", "17. The law is that thought will correlate with its object and bring forth in the material world the correspondence of the thing thought or produced in the mental world. We then discern the absolute necessity of seeing that every thought has the inherent germ of truth in order that the law of growth will bring into manifestation good, for good alone can confer any permanent power.", "18. The principle which gives the thought the dynamic power to correlate with its object, and therefore to master every adverse human experience, is the law of attraction, which is another name for love. This is an eternal and fundamental principle, inherent in all things, in every system of Philosophy, in every Religion, and in every Science. There is no getting away from the law of love. It is feeling that imparts vitality to thought. Feeling is desire, and desire is love. Thought impregnated with love becomes invincible.", "19. We find this truth emphasized wherever the power of thought is understood, The Universal Mind is not only Intelligence, but it is substance, and this substance is the attractive force which brings electrons together by the law of attraction so that they form atoms; the atoms in turn are brought together by the same law and form molecules; molecules take objective forms; and so we find that the law of love is the creative force behind every manifestation, not only of atoms, but of worlds, of the Universe, of everything of which the imagination can form any conception.", "20. It is the operation of this marvelous law of attraction which has caused men in all ages and all times to believe that there must be some personal being who responded to their petitions and desires, and manipulated events in order to comply with their requirements.", "21. It is the combination of Thought and Love which forms the irresistible force, called the law of attraction. All natural laws are irresistible, the law of Gravitation, or Electricity, or any other law operates with mathematical exactitude. There is no variation; it is only the channel of distribution which may be imperfect. If a bridge falls, we do not attribute the collapse to any variation of the law of gravitation. If a light fails us, we do not conclude that the laws governing electricity cannot be depended upon, and if the law of attraction seems to be imperfectly demonstrated by an inexperienced or uninformed person, we are not to conclude that the greatest and most infallible law upon which the entire system of creation depends has been suspended. We should rather conclude that a little more understanding of the law is required, for the same reason that a correct solution of a difficult problem in Mathematics is not always readily and easily obtained.", "22. Things are created in the mental or spiritual world be fore they appear in the outward act or event, by the simple process of governing our thought forces today, we help create the events which will come into our lives in the future, perhaps even tomorrow. Educated desire is the most potent means of bringing into action the law of attraction.", "23. Man is so constituted that he must first create the tools, or implements by which he gains the power to think. The mind cannot comprehend an entirely new idea until a corresponding vibratory brain cell has been prepared to receive it. This explains why it is so difficult for us to receive or appreciate an entirely new idea; we have no brain cell capable of receiving it; we are therefore incredulous; we do not believe it.", "24. If, therefore, you have not been familiar with the Omnipotence of the law of attraction, and the scientific method by which it can be put into operation, or if you have not been familiar with the unlimited possibilities which it opens to those who are enabled to take advantage of the resources it offers, begin now and create the necessary brain cells which will enable you to comprehend the unlimited powers which may be yours by cooperating with Natural Law. This is done by concentration or attention.", "25. The intention governs the attention. Power comes through repose. It is by concentration that deep thoughts, wise speech, and all forces of high potentiality are accomplished.", "26. It is in the Silence that you get into touch with the Omnipotent power of the subconscious mind from which all power is evolved.", "27. He who desires wisdom, power, or permanent success of any kind will find it only within; it is an unfoldment. The unthinking may conclude that the silence is very simple and easily attained, but it should be remembered that only in absolute silence may one come into contact with Divinity itself; may learn of the unchangeable law and open for himself the channels by which persistent practice and concentration lead to perfection.", "28. This week go to the same room, take the same chair, the same position as previously; be sure to relax, let go, both mentally and physically; always do this; never try to do any mental work under pressure; see that there are no tense muscles or nerves, that you are entirely comfortable. Now realize your unity with omnipotence; get into touch with this power, come into a deep and vital understanding, appreciation, and realization of the fact that your ability to think is your ability to act upon the Universal Mind, and bring it into manifestation, realize that it will meet any and every requirement; that you have exactly the same potential ability which any individual ever did have or ever will have, because each is but an expression or manifestation of the One, all are parts of the whole, there is no difference in kind or quality, the only difference being one of degree.", "Thought cannot conceive of anything that may not be brought to expression. He who first uttered it may be only the suggester, but the doer will appear.", "Wilson"], "qa": [{"q": "How may any purpose in life be best accomplished?", "a": "Through a scientific understanding of the spiritual nature of thought."}, {"q": "What three steps are absolutely essential?", "a": "The knowledge of our power, the courage to dare, the faith to do."}, {"q": "How is the practical working knowledge secured?", "a": "By an understanding of Natural laws."}, {"q": "What is the reward of an understanding of these laws?", "a": "A conscious realization of our ability to adjust ourselves to Divine and unchanging principle."}, {"q": "What will indicate the degree of success with which we meet?", "a": "The degree in which we realize that we cannot change the Infinite but must cooperate with it."}, {"q": "What is the principle which gives thought its dynamic power?", "a": "The Law of Attraction which rests on vibration, which in turn rests upon the law of love. Thought impregnated with love becomes invincible."}, {"q": "Why is this law irresistible?", "a": "Because it is a Natural law. All Natural laws are irresistible and unchangeable and act with mathematical exactitude. There is no deviation or variation."}, {"q": "Why then does it sometimes seem to be difficult to find the solution to our problems in life?", "a": "For the same reason that it is sometimes difficult to find the correct solution to a difficult mathematical problem. The operator is uninformed or inexperienced."}, {"q": "Why is it impossible for the mind to grasp an entirely new idea?", "a": "We have no corresponding vibratory brain cell capable of receiving the idea."}, {"q": "How is wisdom secured?", "a": "By concentration; it is an unfoldment; it comes from within."}]}, {"id": "mkp-13", "title": "Part Thirteen", "n": 13, "letter": ["Physical science is responsible for the marvelous age of invention in which we are now living, but spiritual science is now setting out on a career whose possibilities no one can foretell.", "Spiritual science has previously been the football of the uneducated, the superstitious, the mystical, but men are now interested in definite methods and demonstrated facts only.", "We have come to know that thinking is a spiritual process, that vision and imagination preceded action and event, that the day of the dreamer has come.", "The following lines by Mr. Herbert Kaufman are interesting in this connection.", "“They are the architects of greatness, their vision lies within their souls, they peer beyond the veils and mists of doubt and pierce the walls of unborn Time. The belted wheel, the trail of steel, the churning screw, are shuttles in the loom on which they weave their magic tapestries. Makers of Empire, they have fought for bigger things than crowns and higher seats than thrones. Your homes are set upon the land a dreamer found. The pictures on its walls are visions from a dreamer’s soul. They are the chose few—the blazers of the way. Walls crumble and Empires fall, the tidal wave sweeps from the sea and tears a fortress from its rocks. The rotting nations drop off from Time’s bough, and only things the dreamer’s make live on.”", "Part Thirteen which follows tells why the dreams of the dreamer come true. It explains the law of causation by which dreamers, inventors, authors, financiers, bring about the realization of their desires. It explains the law by which the thing pictured upon our mind eventually becomes our own."], "body": ["1. It has been the tendency, and, as might be proved, a necessity for science to seek the explanation of everyday facts by a generalization of those others which are less frequent and form the exception. Thus does the eruption of the volcano manifest the heat which is continually at work in the interior of the earth and to which the latter owes much of her configuration.", "2. Thus does the lightning reveal a subtle power constantly busy to produce changes in the inorganic world, and, as dead languages now seldom heard were once ruling among the nations, so does a giant tooth in Siberia, or a fossil in the depth of the earth, not only bear record of the evolution of past ages, but thereby explains to us the origin of the hills and valleys which we inhabit today.", "3. In this way a generalization of facts which are rare, strange, or form the exception, has been the magnetic needle guiding to all the discoveries of inductive science.", "4. This method is founded upon reason and experience and thereby destroyed superstition, precedent and conventionality.", "5. It is almost three-hundred years since Lord Bacon recommended this method of study, to which the civilized nations owe the greater part of their prosperity and the more valuable part of their knowledge; purging the mind from narrow prejudices, denominated theories, more effectually than by the keenest irony; calling the attention of men from heaven to earth more successfully by surprising experiments than by the most forcible demonstration of their ignorance; educating the inventive faculties more powerfully by the near prospect of useful discoveries thrown open to all, than by talk of bringing to light the innate laws of our mind.", "6. The method of Bacon has seized the spirit and aim of the great philosophers of Greece and carried them into effect by the new means of observation which another age offered; thus gradually revealing a wondrous field of knowledge in the infinite space of astronomy, in the microscopic egg of embryology, and the dim age of geology; disclosing an order of the pulse which the logic of Aristotle could never have unveiled, and analyzing into formerly unknown elements the material combinations which no dialectic of the scholastics could force apart.", "7. It has lengthened life; it has mitigated pain; it has extinguished diseases; it has increased the fertility of the soil; it has given new securities to the mariner; it has spanned great rivers with bridges of form unknown to our fathers; it has guided the thunderbolt from heaven to earth; it has lighted up night with the splendor of day; it has extended the range of human vision; it has multiplied the power of the human muscles; it has accelerated motion; it has annihilated distance; it has facilitated intercourse, correspondence, all friendly offices, all dispatch of business; it has enabled men to descend into the depths of the sea, to soar into the air, to penetrate securely into the noxious recesses of the earth.", "8. This then is the true nature and scope of induction. But the greater the success which men have achieved in the inductive science, the more does the whole tenor of their teachings and example impress us with the necessity of observing carefully, patiently, accurately, with all the instruments and resources at our command the individual facts before venturing upon a statement of general laws.", "9. To ascertain the bearing of the spark drawn from the electric machine under every variety of circumstances, that we thus may be emboldened with Franklin to address, in the form of a kite, the question to the cloud about the nature of the lightning. To assure ourselves of the manner in which bodies fall with the exactness of a Galileo, that with Newton we may dare to ask the moon about the force that fastens it to the earth.", "10. In short, by the value we set upon truth, by our hope in a steady and universal progress, not to permit a tyrannical prejudice to neglect or mutilate unwelcome facts, but to rear the superstructure of science upon the broad and unchangeable basis, of full attention paid to the most isolated as well as the most frequent phenomena.", "11. An ever-increasing material may be collected by observation, but the accumulated facts are of very different value for the explanation of nature, and as we esteem most highly those useful qualities of men which are of the rarest occurrence, so does natural philosophy sift the facts and attach a pre-eminent importance to that striking class which cannot be accounted for by the usual and daily observation of life.", "12. If then, we find that certain persons seem to possess unusual power, what are we to conclude? First, we may say, it is not so, which is simply an acknowledgment of our lack of information because every honest investigator admits that there are many strange and previously unaccountable phenomena constantly taking place. Those, however, who become acquainted with the creative power of thought, will no longer consider them unaccountable.", "13. Second, we may say that they are the result of supernatural interference, but a scientific understanding of Natural Laws will convince us that there is nothing supernatural. Every phenomenon is the result of an accurate definite cause, and the cause is an immutable law or principle, which operates with invariable precision, whether the law is put into operation consciously or unconsciously.", "14. Third, we may say that we are on “forbidden ground,” that there are some things which we should not know. This objection was used against every advance in human knowledge. Every individual who ever advanced a new idea, whether a Columbus, a Darwin, a Galileo, a Fulton or an Emerson, was subjected to ridicule or persecution; so that this objection should receive no serious consideration; but, on the contrary, we should carefully consider every fact which is brought to our attention; by doing this we will more readily ascertain the law upon which it is based.", "15. It will be found that the creative power of thought will explain every possible condition or experience, whether physical, mental or spiritual.", "16. Thought will bring about conditions in correspondence with the predominant mental attitude. Therefore, if we fear disaster, as fear is a powerful form of thought, disaster will be the certain result of our thinking. It is this form of thought which frequently sweeps away the result of many years of toil and effort.", "17. If we think of some form of material wealth we may secure it. By concentrated thought the required conditions will be brought about, and the proper effort put forth, which will result in bringing about the circumstances necessary to realize our desires; but we often find that when we secure the things we thought we wanted, they do not have the effect we expected. That is, the satisfaction is only temporary, or possibly is the reverse of what we expected.", "18. What, then, is the proper method of procedure? What are we to think in order to secure what we really desire? What you and I desire, what we all desire, what every one is seeking, is Happiness and Harmony. If we can be truly happy we shall have everything the world can give. If we are happy ourselves we can make others happy.", "19. But we cannot be happy unless we have, health, strength, congenial friends, pleasant environment, sufficient supply, not only to take care of our necessities but to provide for those comforts and luxuries to which we are entitled.", "20. The old orthodox way of thinking was to be “a worm,” to be satisfied with our portion whatever it is; but the modern idea is to know that we are entitled to the best of everything, that the “Father and I are one” and that the “Father” is the Universal Mind, the Creator, the Original Substance from which all things proceed.", "21. Now admitting that this is all true in theory, and it has been taught for two thousand years, and is the essence of every system of Philosophy or Religion, how are we to make it practical in our lives? How are we to get the actual, tangible results here and now?", "22. In the first place, we must put our knowledge into practice. Nothing can be accomplished in any other way. The athlete may read books and lessons on physical training all his life, but unless he begins to give out strength by actual work he will never receive any strength; he will eventually get exactly what he gives; but he will have to give it first. It is exactly the same with us; we will get exactly what we give, but we shall have to give it first. It will then return to us many fold, and the giving is simply a mental process, because thoughts are causes and conditions are effects; therefore in giving thoughts of courage, inspiration, health or help of any kind we are setting causes in motion which will bring about their effect.", "23. Thought is a spiritual activity and is therefore creative, but make no mistake, thought will create nothing unless it is consciously, systematically, and constructively directed; and herein is the difference between idle thinking, which is simply a dissipation of effort, and constructive thinking, which means practically unlimited achievement.", "24. We have found that everything we get comes to us by the Law of Attraction. A happy thought cannot exist in an unhappy consciousness; therefore the consciousness must change, and, as the consciousness changes, all conditions necessary to meet the changed consciousness must gradually change, in order to meet the requirements of the new situation.", "25. In creating a Mental Image or an Ideal, we are projecting a thought into the Universal Substance from which all things are created. This Universal Substance is Omnipresent, Omnipotent and Omniscient. Are we to inform the Omniscient as to the proper channel to be used to materialize our demand? Can the finite advise the Infinite? This is the cause of failure; of every failure. We recognize the Omnipresence of the Universal Substance, but we fail to appreciate the fact that this substance is not only Omnipresent, but is Omnipotent and Omniscient, and consequently will set causes in motion concerning which we may be entirely ignorant.", "26. We can best conserve our interests by recognizing the Infinite Power and Infinite Wisdom of the Universal Mind, and in this way become a channel whereby the Infinite can bring about the realization of our desire. This means that recognition brings about realization, therefore for your exercise this week make use of the principle, recognize the fact that you are a part of the whole, and that a part must be the same in kind and quality as the whole; the only difference there can possibly by, is in degree.", "27. When this tremendous fact begins to permeate your consciousness, when you really come into a realization of the fact that you (not your body, but the Ego), the “I,” the spirit which thinks is an integral part of the great whole, that it is the same in substance, in quality, in kind, that the Creator could create nothing different from Himself, you will also be able to say, “The Father and I are one” and you will come into an understanding of the beauty, the grandeur, the transcendental opportunities which have been placed at your disposal.", "Increase in me that wisdom Which discovers my truest interest, Strengthen my resolution To perform that which wisdom dictates.", "Franklin"], "qa": [{"q": "What is the method by which natural philosophers obtain and apply their knowledge?", "a": "To observe individual facts carefully, patiently, accurately, with all the instruments and resources at their command, before venturing upon a statement of general laws."}, {"q": "How may we be certain that this method is correct?", "a": "By not permitting a tyrannical prejudice to neglect or mutilate unwelcome facts."}, {"q": "What classes of facts are esteemed most highly?", "a": "Those which cannot be accounted for by the usual daily observation of life."}, {"q": "Upon what is this principle founded?", "a": "Upon reason and experience."}, {"q": "What does it destroy?", "a": "Superstition, precedent and conventionality."}, {"q": "How have these laws been discovered?", "a": "By a generalization of facts which are uncommon, rare, strange and form the exception."}, {"q": "How may we account for much of the strange and heretofore unexplainable phenomena which is constantly taking place?", "a": "By the creative power of thought."}, {"q": "Why is this so?", "a": "Because when we learn of a fact we can be sure that it is the result of a certain definite cause and that this cause will operate with invariable precision."}, {"q": "What is the result of this knowledge?", "a": "It will explain the cause of every possible condition, whether physical, mental or spiritual."}, {"q": "How will our best interest be conserved?", "a": "By a recognition of the fact that a knowledge of the creative nature of thought puts us in touch with Infinite power."}]}, {"id": "mkp-14", "title": "Part Fourteen", "n": 14, "letter": ["You have found from your study thus far that thought is a spiritual activity and is therefore endowed with creative power. This does not mean that some thought is creative, but that all thought is creative. This same principle can be brought into operation in a negative way, through the process of denial.", "The conscious and subconscious are but two phases of action in connection with one mind. The relation of the subconscious to the conscious is quite analogous to that existing between a weather vane and the atmosphere.", "Just as the least pressure of the atmosphere causes an action on the part of the weather vane, so does the least thought entertained by the conscious mind produce within your subconscious mind action in exact proportion to the depth of feeling characterizing the thought and the intensity with which the thought is indulged.", "It follows that if you deny unsatisfactory conditions, you are withdrawing the creative power of your thought from these conditions. You are cutting them away at the root. You are sapping their vitality.", "Remember that the law of growth necessarily governs every manifestation in the objective, so that a denial of unsatisfactory conditions will not bring about instant change. A plant will remain visible for some time after its roots have been cut, but it will gradually fade away and eventually disappear, so the withdrawal of your thought from the contemplation of unsatisfactory conditions will gradually, but surely, terminate these conditions.", "You will see that this is an exactly opposite course from the one which we would naturally be inclined to adopt.", "It will therefore have an exactly opposite effect to the one usually secured. Most persons concentrate intently upon unsatisfactory conditions, thereby giving the condition that measure of energy and vitality which is necessary in order to supply a vigorous growth."], "body": ["1. The Universal Energy in which all motion, light, heat, and color have their origin, does not partake of the limitation of the many effects of which it is the cause, but it is supreme over them all. This Universal Substance is the source of all Power, Wisdom and Intelligence.", "2. To recognize this Intelligence is to acquaint yourself with the knowing quality of Mind and through it to move upon the Universal Substance, and bring it into harmonious relations in your affairs.", "3. This is something that the most learned physical science teacher has not attempted—a field of discovery upon which he has not yet launched; in fact, but few of the materialistic schools have ever caught the first ray of this light. It does not seem to have dawned upon them that wisdom is just as much present everywhere as are force and substance.", "4. Some will say, if these principles are true, why are we not demonstrating them? As the fundamental principle is obviously correct, why do we not get proper results? We do. We get results in exact accordance with our understanding of the law and our ability to make the proper application. We secured no results from the laws governing electricity until someone formulated the law and showed us how to apply it.", "5. This puts us in an entirely new relation t
