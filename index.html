  quiz: [
    { q: "According to this part, what is the \"I\"?", o: ["The physical body", "Your strongest emotion", "The spiritual self that directs body and mind", "Your reputation"], a: 2, e: "The body and mind are its instruments." },
    { q: "What does this week's exercise ask you to let go of?", o: ["Your goals", "Negative emotions like worry, anger and envy", "Your breath", "Your list"], a: 1, e: "Having learned stillness and relaxation, you now release negative feeling." }],
  reflect: "Which mood do you most often mistake for yourself?" },
{ id: "mk-05", part: "mk1", title: "The mental home", sub: "You build it, thought by thought",
  body: [
`Haanel says most of our mental life runs below awareness, shaped by heredity, upbringing and surroundings. We live in a "mental home" we mostly didn't choose. The good news: it was built by thought, and it can be rebuilt the same way.`,
`He compares it to an inheritance waiting to be claimed. The materials are your thoughts; the builder is attention. Each day you add something, so add deliberately: better habits of thought, better pictures, better company for your mind.`],
  keys: ["Much of your mental life is inherited or absorbed.", "Your mental home was built by thought.", "It can be rebuilt by deliberate thinking.", "Claim your inheritance: the power to choose thought."],
  practice: `${MK_SIT} After relaxing and quieting the mind, recall a pleasant scene from your past in as much detail as you can: place, light, sounds, people. Hold the picture steadily.`,
  quiz: [
    { q: "What builds the \"mental home\"?", o: ["Money", "Thought", "Luck", "Other people"], a: 1, e: "It was built by thought and can be rebuilt by thought." },
    { q: "What shapes much of it before we choose?", o: ["Heredity and environment", "The solar plexus", "Visualisation", "Concentration"], a: 0, e: "We absorb much of our mental life before we can choose." }],
  reflect: "Which room of your mental home would you rebuild first?" },
{ id: "mk-06", part: "mk1", title: "Attention", sub: "The brain as an instrument, concentration as the skill",
  body: [
`The brain, Haanel says, is a remarkable instrument, and attention is how you use it. Scattered attention gets scattered results. Concentrated attention is the difference between an ordinary mind and a powerful one.`,
`Concentration is not strain. It is steady interest held on one object long enough for the mind to work on it. Like any skill, it grows with daily practice, which is what this week's exercise trains.`],
  keys: ["Attention is how you direct the mind.", "Concentration is the key mental skill.", "Concentration is steady interest, not strain.", "It improves with daily practice."],
  practice: `${MK_SIT} Take a photograph of a friend. Study it closely: expression, eyes, clothes, background. Then put it away and recreate it in your mind in full detail. Repeat until the image is clear.`,
  quiz: [
    { q: "What does Haanel call the key to using the brain well?", o: ["Speed", "Attention or concentration", "Memory tricks", "Sleep"], a: 1, e: "Concentrated attention turns the brain into a powerful instrument." },
    { q: "What is this week's exercise object?", o: ["A battleship", "A photograph of a friend", "A circle", "A flower"], a: 1, e: "You study the photo, then recreate it mentally." }],
  reflect: "Where does your attention leak during the day?" },
{ id: "mk-07", part: "mk2", title: "Visualisation", sub: "Idealisation, visualisation, materialisation",
  body: [
`Haanel describes creation in three steps. Idealisation: decide clearly what you want. Visualisation: see it in your mind, in detail, steadily, as an architect sees a building before it exists. Materialisation: the plan begins to take outward form.`,
`The picture must be clear and held steadily. A vague or changing picture produces vague results. Build it a little at a time, adding detail each day, and trust the process instead of forcing it.`],
  keys: ["Idealise: decide what you want.", "Visualise: see it clearly, like an architect's plan.", "Materialise: it takes form over time.", "Clarity and steadiness matter more than effort."],
  practice: `${MK_SIT} Choose one thing you want. Picture it as clearly as you can, adding a little detail each day. Hold the picture steadily, without straining.`,
  quiz: [
    { q: "What are Haanel's three steps of creation?", o: ["Wish, wait, receive", "Idealisation, visualisation, materialisation", "Plan, work, rest", "Ask, tell, give"], a: 1, e: "Decide, picture, then let it take form." },
    { q: "What analogy does he use for visualisation?", o: ["A gardener", "An architect's plan", "A ship's captain", "A sculptor's clay"], a: 1, e: "The architect sees the building before it is built." }],
  reflect: "What would you build if you planned it as carefully as an architect?" },
{ id: "mk-08", part: "mk2", title: "Imagination", sub: "Constructive imagination and the battleship",
  body: [
`Imagination, for Haanel, is the workshop of the mind. Daydreaming wastes it; constructive imagination uses it to form plans and see connections. It can be trained, and the training makes thought more vivid and more effective.`,
`This week's exercise is his famous battleship: picture a warship in detail, then trace it back through everything that made it possible, down to the ore in the ground and the thought of whoever conceived it. Every great thing began as an idea.`],
  keys: ["Imagination is the mind's workshop.", "Constructive imagination plans; daydreaming drifts.", "Every made thing began as a thought.", "Imagination grows with exercise."],
  practice: `${MK_SIT} Picture a battleship: its size, steel, guns, crew. Then trace it back: the shipyard, the steel mill, the mine, the ore, the engineers, the first idea. Follow the chain as far as you can.`,
  quiz: [
    { q: "What is the battleship exercise meant to show?", o: ["That ships are big", "That every made thing traces back to thought", "How to join the navy", "That steel is strong"], a: 1, e: "You follow the ship back to its origin in an idea." },
    { q: "Constructive imagination differs from daydreaming because it…", o: ["Is more fun", "Forms plans and connections with purpose", "Happens at night", "Avoids details"], a: 1, e: "It's directed toward building something." }],
  reflect: "Trace one object near you back to the thought that started it." },
{ id: "mk-09", part: "mk2", title: "Affirmation and truth", sub: "\"I am whole, perfect, strong…\"",
  body: [
`Haanel argues that the truth about you is that you are whole and capable, and that thinking in line with that truth is what produces health and harmony. He offers an affirmation to hold: "I am whole, perfect, strong, powerful, loving, harmonious and happy."`,
`The affirmation is meant to be understood, not just repeated. Hold each word in mind until you feel what it means. Its job is to replace habits of thinking that contradict it.`],
  keys: ["Think in line with the truth of your wholeness.", "The affirmation: whole, perfect, strong, powerful, loving, harmonious, happy.", "Understand it; don't just repeat it.", "It replaces contradicting habits of thought."],
  practice: `${MK_SIT} Picture a seed planted in soil. Watch it sprout, root, rise, leaf and flower, in detail. Then hold the affirmation for a few minutes, word by word.`,
  quiz: [
    { q: "Which is Haanel's affirmation in this part?", o: ["\"Every day in every way…\"", "\"I am whole, perfect, strong, powerful, loving, harmonious and happy\"", "\"It works\"", "\"Fortune favours the bold\""], a: 1, e: "It names the qualities he says are already true of you." },
    { q: "How should the affirmation be used?", o: ["Repeated fast", "Understood and felt, word by word", "Written once", "Said to others"], a: 1, e: "Meaning, not mechanical repetition, gives it power." }],
  reflect: "Which word of the affirmation feels least true to you right now? Why?" },
{ id: "mk-10", part: "mk2", title: "Abundance and cause", sub: "Nothing happens by chance",
  body: [
`Haanel treats abundance as natural: nature is lavish, and lack is a sign that something is blocking the flow, not a fixed law. He ties this to cause and effect: every condition has a cause, and nothing happens by chance.`,
`If you don't like an effect, look for its cause in thought and action and change that. This week's exercise trains precise mental imagery, so the causes you set in motion are clear ones.`],
  keys: ["Abundance is natural; lack signals a block.", "Every effect has a cause.", "Nothing happens by chance.", "Change effects by changing causes."],
  practice: `${MK_SIT} Picture a straight line. Then build a square from four lines, then a circle, then other shapes. Hold each figure clearly before moving on.`,
  quiz: [
    { q: "How does Haanel view lack?", o: ["As the natural state", "As a sign the flow is blocked", "As a punishment", "As permanent"], a: 1, e: "Nature is lavish; lack means something is in the way." },
    { q: "What does he say about chance?", o: ["Most things are chance", "Nothing happens by chance; every effect has a cause", "Chance can be trained", "Only good things are chance"], a: 1, e: "Cause and effect run everywhere." }],
  reflect: "Pick one result you dislike. What cause in your thinking or action might be producing it?" },
{ id: "mk-11", part: "mk2", title: "Believe that you receive", sub: "Inductive reasoning and the prayer of faith",
  body: [
`Haanel praises inductive reasoning: observing many cases and finding the law behind them. Applied to the mind, it points to a law of supply that responds to belief.`,
`He quotes the gospel line, "whatsoever things ye desire, when ye pray, believe that ye receive them, and ye shall have them," and reads it as a statement of law: hold the thing as already yours in thought, and it tends to follow.`],
  keys: ["Inductive reasoning finds laws from observed cases.", "Belief acts on the law of supply.", "Hold the desire as already received.", "Treat it as law, not wishful thinking."],
  practice: `${MK_SIT} Concentrate on the words "Whatsoever things ye desire, when ye pray, believe that ye receive them, and ye shall have them." Consider what it would mean to hold your desire as already received.`,
  quiz: [
    { q: "What kind of reasoning does Haanel praise here?", o: ["Deductive", "Inductive", "Circular", "Emotional"], a: 1, e: "Observing cases and drawing out the law." },
    { q: "How does he read \"believe that ye receive\"?", o: ["As poetry only", "As a statement of mental law", "As a warning", "As a historical note"], a: 1, e: "He treats it as describing how the law works." }],
  reflect: "What would change in how you act today if you believed you had already received what you want?" },
{ id: "mk-12", part: "mk2", title: "Concentration and love", sub: "The law of attraction",
  body: [
`Here Haanel names the law of attraction: thought attracts its object. He adds that thought charged with feeling, especially love, is far more powerful than cold thinking.`,
`He returns to concentration as the way to use this: hold one purpose steadily, warmly and without scattering. A mind that keeps changing its object attracts nothing in particular.`],
  keys: ["Thought attracts its object.", "Feeling, especially love, strengthens thought.", "Concentration focuses the attraction.", "Scattered aims attract nothing in particular."],
  practice: `${MK_SIT} Relax and quiet the mind, then concentrate on your connection with the Universal Mind: the idea that the power you use is part of something larger. Hold that thought with warmth.`,
  quiz: [
    { q: "What does the law of attraction say in this part?", o: ["Opposites attract", "Thought attracts its object", "Money attracts money", "Nothing attracts"], a: 1, e: "Held thought draws its object toward it." },
    { q: "What makes thought more powerful, according to Haanel?", o: ["Speed", "Feeling, especially love", "Volume", "Repetition alone"], a: 1, e: "Thought joined with feeling is creative." }],
  reflect: "Which of your goals do you think about coldly? How would it feel to hold it with warmth?" },
{ id: "mk-13", part: "mk3", title: "Dreamers and law", sub: "Ideals are practical",
  body: [
`Haanel defends dreamers. The people who changed the world first held a picture others called impractical. An ideal is not an escape; it's the pattern that action follows.`,
`He also argues that results that look miraculous are simply laws we don't yet understand. The point is to understand the law well enough to use it on purpose.`],
  keys: ["Ideals come before achievements.", "Great builders were first dreamers.", "\"Miracles\" are laws not yet understood.", "Understand the law to use it deliberately."],
  practice: `${MK_SIT} Relax and quiet the mind, then concentrate on your ideal: the life you're building. Hold it as a practical plan, not a fantasy.`,
  quiz: [
    { q: "How does Haanel view dreamers?", o: ["As impractical", "As the source of every advance", "As lazy", "As dangerous"], a: 1, e: "Their ideals become the patterns others follow." },
    { q: "What are results that look miraculous?", o: ["Accidents", "Laws not yet understood", "Fraud", "Rare luck"], a: 1, e: "They follow law, even when we don't see it." }],
  reflect: "What ideal have you dismissed as impractical?" },
{ id: "mk-14", part: "mk3", title: "Universal substance", sub: "Harmony with the whole",
  body: [
`Haanel describes one universal substance, which he also calls Universal Mind, present in everything. Individual mind is a point of contact with it. Through that contact, thought can act on conditions.`,
`The practical lesson is harmony. Thinking in conflict with the whole (resentment, criticism, fear) blocks the contact. Harmonious thought opens it.`],
  keys: ["One universal substance runs through everything.", "Your mind is a point of contact with it.", "Discordant thought blocks the contact.", "Harmonious thought opens it."],
  practice: `${MK_SIT} Relax and quiet the mind, then concentrate on harmony: harmony in your body, your relationships, your work. Picture each in balance.`,
  quiz: [
    { q: "What is your mind, in this part's terms?", o: ["Separate from everything", "A point of contact with Universal Mind", "Only the brain", "An illusion"], a: 1, e: "Individual mind connects to the universal." },
    { q: "What blocks the connection?", o: ["Harmony", "Discordant thought like resentment and fear", "Concentration", "Rest"], a: 1, e: "Conflict closes it; harmony opens it." }],
  reflect: "Where in your life are you out of harmony? What thought keeps it that way?" },
{ id: "mk-15", part: "mk3", title: "Laws of life and insight", sub: "Difficulties, words and understanding",
  body: [
`Haanel says difficulties are part of the law of growth: they show us where we're out of line, and overcoming them builds strength. They are not punishments.`,
`He also points to the power of words. Words shape thought, so choose them with care. And he praises insight: understanding a situation from within, which lets you act correctly instead of reacting.`],
  keys: ["Difficulties show where you're out of line.", "Overcoming them builds strength.", "Words shape thought; choose them carefully.", "Insight lets you act instead of react."],
  practice: `${MK_SIT} Relax and quiet the mind, then concentrate on insight. Bring a current difficulty to mind and ask quietly what it is showing you.`,
  quiz: [
    { q: "How does Haanel see difficulties?", o: ["As punishments", "As part of the law of growth", "As random", "As permanent"], a: 1, e: "They show where to adjust, and build strength." },
    { q: "Why choose words carefully?", o: ["To sound educated", "Because words shape thought", "To avoid arguments", "It doesn't matter"], a: 1, e: "Language moulds how you think." }],
  reflect: "What is your current biggest difficulty trying to teach you?" },
{ id: "mk-16", part: "mk3", title: "Cycles and wealth", sub: "Periodicity and the right use of money",
  body: [
`Haanel notes that life moves in cycles, often described as seven-year periods, and that knowing this helps you work with the season you're in rather than against it.`,
`He treats wealth as a means, not an end. Money is useful for what it lets you do and give. Wanting it as an end in itself tends to bring anxiety; wanting it for a worthy ideal tends to bring it.`],
  keys: ["Life moves in cycles.", "Work with your current season.", "Wealth is a means, not an end.", "A worthy ideal draws resources."],
  practice: `${MK_SIT} Relax and quiet the mind, then concentrate on your ideal and on what wealth would let you do and give. Hold the purpose, not the money.`,
  quiz: [
    { q: "How does Haanel view wealth?", o: ["As the goal", "As a means to an ideal", "As evil", "As luck"], a: 1, e: "Money serves a purpose; it isn't the purpose." },
    { q: "What does periodicity refer to?", o: ["Reading periodicals", "Life moving in cycles", "Daily routine", "Punctuation"], a: 1, e: "Life moves through recurring periods." }],
  reflect: "If money were fully taken care of, what would you do with your next seven years?" },
{ id: "mk-17", part: "mk3", title: "True concentration", sub: "Symbol and reality",
  body: [
`Haanel distinguishes the symbol from the reality: outward forms are symbols, and the reality behind them is spiritual. Chasing symbols without the reality leads nowhere.`,
`He describes real concentration as so complete that you forget yourself in the object, the way an inventor or artist does. It isn't forcing; it is absorption, and absorption is where insight and results come from.`],
  keys: ["Outer forms are symbols of inner reality.", "Seek the reality, not just the symbol.", "Real concentration is absorption, not strain.", "Self-forgetful focus brings insight."],
  practice: `${MK_SIT} Relax and quiet the mind, then choose one thing you want and become absorbed in it, the way an artist loses themselves in work. Let self-consciousness fall away.`,
  quiz: [
    { q: "What is real concentration, in this part?", o: ["Forcing your mind", "Absorption so complete you forget yourself", "Thinking fast", "Multitasking"], a: 1, e: "It's absorption, like an inventor at work." },
    { q: "What are outer forms, according to Haanel?", o: ["The only reality", "Symbols of an inner reality", "Illusions to ignore", "Unimportant"], a: 1, e: "Forms point to the reality behind them." }],
  reflect: "When were you last so absorbed that you forgot yourself? What were you doing?" },
{ id: "mk-18", part: "mk3", title: "The law of growth", sub: "Attention, interest and the individual",
  body: [
`Everything grows or decays; nothing stays still. Haanel says growth comes from taking in from the universal what the individual needs, and that attention and interest decide what we take in.`,
`The individual is the universal expressing itself in a particular way. Your growth is that expression becoming fuller, and it depends on where you place your interest day after day.`],
  keys: ["Everything grows or decays.", "Attention and interest direct growth.", "The individual expresses the universal.", "Steady interest compounds over time."],
  practice: `${MK_SIT} Relax and quiet the mind, then concentrate on growth: picture yourself one year from now, grown in the direction you choose.`,
  quiz: [
    { q: "What directs growth, according to this part?", o: ["Luck", "Attention and interest", "Age", "Other people"], a: 1, e: "What you attend to is what you grow toward." },
    { q: "What is the individual's relation to the universal?", o: ["Separate from it", "A particular expression of it", "Opposed to it", "Unrelated"], a: 1, e: "The individual expresses the universal in a particular form." }],
  reflect: "Where has your interest been going this month? Is that where you want to grow?" },
{ id: "mk-19", part: "mk4", title: "Fear and opposites", sub: "Two ends of one thing",
  body: [
`Haanel says opposites are two ends of one thing: heat and cold, light and dark, good and evil. Darkness is the absence of light; you don't fight it, you bring light. In the same way, fear is the absence of understanding and confidence.`,
`Mind, he says, is the one reality behind both poles. When you understand that, you stop fighting conditions and start changing your position on the scale.`],
  keys: ["Opposites are two ends of one thing.", "Darkness is absence of light; fear is absence of understanding.", "Don't fight the negative; bring the positive.", "Mind is the reality behind both poles."],
  practice: `${MK_SIT} Relax and quiet the mind, then concentrate on one fear. Ask what its opposite would be, and hold that opposite instead.`,
  quiz: [
    { q: "How does Haanel see opposites?", o: ["As enemies", "As two ends of one thing", "As illusions", "As random"], a: 1, e: "Heat and cold are degrees of one thing." },
    { q: "How do you deal with darkness, in his analogy?", o: ["Fight it", "Bring light", "Ignore it", "Measure it"], a: 1, e: "You don't fight darkness; you bring light." }],
  reflect: "What fear would disappear if you brought more understanding to it?" },
{ id: "mk-20", part: "mk4", title: "The spirit of things", sub: "Power is latent until used",
  body: [
`Haanel says the spirit of a thing is its reality. Power is everywhere, but it's latent until someone recognises it and uses it, the way electricity existed long before anyone switched on a light.`,
`He quotes "In Him we live and move and have our being," reading it as a statement that we live within the universal power and can draw on it consciously. Breathing deeply, he suggests, is a simple way to feel that connection.`],
  keys: ["The spirit of a thing is its reality.", "Power is latent until recognised and used.", "We live within the universal power.", "Conscious breathing helps you feel it."],
  practice: `${MK_SIT} Relax, breathe slowly and deeply, then concentrate on "In Him we live and move and have our being." Consider what it would mean to live inside the power you're trying to use.`,
  quiz: [
    { q: "When does latent power become useful?", o: ["Never", "When it is recognised and used", "Only at night", "When others allow it"], a: 1, e: "Like electricity, it waits to be recognised." },
    { q: "Which quotation is this week's focus?", o: ["\"Know thyself\"", "\"In Him we live and move and have our being\"", "\"It works\"", "\"Carpe diem\""], a: 1, e: "Haanel reads it as describing our relation to the universal." }],
  reflect: "What power in your life is sitting unused because you haven't recognised it?" },
{ id: "mk-21", part: "mk4", title: "Think big", sub: "Consciousness of power",
  body: [
`Haanel says the real secret of power is consciousness of power. People who achieve large things think in large terms; small thinking limits what can reach you.`,
`He asks you to raise your sights: entertain big ideas, and hold them calmly. Truth, he says, is the foundation: thinking in line with truth is what makes power reliable.`],
  keys: ["The secret of power is consciousness of power.", "Large results start with large thinking.", "Small thinking limits what can reach you.", "Truth makes power reliable."],
  practice: `${MK_SIT} Relax and quiet the mind, then concentrate on "Ye shall know the truth, and the truth shall make you free." Then let your main goal grow bigger in your mind and notice how that feels.`,
  quiz: [
    { q: "What is the real secret of power, according to this part?", o: ["Money", "Consciousness of power", "Hard work alone", "Connections"], a: 1, e: "Awareness of power precedes its use." },
    { q: "What does small thinking do?", o: ["Keeps you safe", "Limits what can reach you", "Saves energy", "Nothing"], a: 1, e: "Large results begin with large thinking." }],
  reflect: "How would your goals look if you multiplied them by ten?" },
{ id: "mk-22", part: "mk4", title: "Thought and health", sub: "Every cell responds",
  body: [
`Haanel argues that the body is constantly renewing itself, and that thought influences how. Fear, worry and anger leave their mark; calm, confident, loving thought supports health.`,
`He doesn't ask you to ignore medicine. He asks you to stop poisoning the process with habitual negative thought, and to hold a steady picture of health.`],
  keys: ["The body renews itself constantly.", "Thought influences that renewal.", "Negative habits of thought take a toll.", "Hold a steady picture of health."],
  practice: `${MK_SIT} Relax and quiet the mind, then concentrate on health. Picture your body renewing itself, cell by cell, strong and well.`,
  quiz: [
    { q: "What does Haanel say influences the body's renewal?", o: ["Nothing", "Thought", "Only diet", "Only exercise"], a: 1, e: "He links habitual thought to the body's condition." },
    { q: "Which kind of thought supports health, in this part?", o: ["Worry", "Calm, confident, loving thought", "Anger", "Criticism"], a: 1, e: "Negative thought takes a toll; positive thought supports." }],
  reflect: "Which habitual thought do you suspect is costing your body the most?" },
{ id: "mk-23", part: "mk4", title: "Money and service", sub: "The law of giving",
  body: [
`Haanel says money consciousness is a state of mind, and that money follows service. The more value you give, the more naturally it returns.`,
`He describes a law of giving: to receive, give. Hoarding and fear block circulation; generosity keeps it moving. Give your best work, your attention and your help, and let the return follow.`],
  keys: ["Money consciousness is a state of mind.", "Money follows service.", "To receive, give.", "Hoarding blocks the flow; giving keeps it moving."],
  practice: `${MK_SIT} Relax and quiet the mind, then concentrate on service: what value you can give this week, and to whom. Then give it.`,
  quiz: [
    { q: "What does money follow, according to Haanel?", o: ["Luck", "Service", "Hoarding", "Inheritance"], a: 1, e: "The more value given, the more returns." },
    { q: "What blocks the flow?", o: ["Generosity", "Hoarding and fear", "Service", "Gratitude"], a: 1, e: "Circulation requires giving." }],
  reflect: "Where could you give more value this month?" },
{ id: "mk-24", part: "mk4", title: "The master key", sub: "Putting the whole system together",
  body: [
`The last part draws the threads together. The master key, Haanel says, is understanding that the world within is the cause, that mind is one with the universal, and that thought held with feeling and concentration shapes conditions.`,
`He ends by pointing you back to practice: knowledge is useless until applied. The 24 weeks are a foundation. Keep sitting, keep guarding the gate, keep holding your ideal, and keep giving.`],
  keys: ["The world within is the cause.", "Mind is one with the universal.", "Thought plus feeling plus concentration shapes conditions.", "Knowledge only works when applied."],
  practice: `${MK_SIT} Relax and quiet the mind, then review the whole course: stillness, letting go, the "I", visualisation, harmony, growth, power, service. Choose the one practice you'll keep daily from now on.`,
  quiz: [
    { q: "What is the master key, in summary?", o: ["A secret password", "Understanding that the world within is cause, and using it", "A book of spells", "Luck"], a: 1, e: "The whole system rests on the inner world as cause." },
    { q: "What does Haanel say about knowledge?", o: ["It's enough by itself", "It's useless until applied", "It's dangerous", "It should be kept secret"], a: 1, e: "The system only works through practice." }],
  reflect: "Looking back over all 24 weeks, which idea changed you most?" },
];

const MK_PRINCIPLES = [
  "The world without reflects the world within.",

/* ------------------------------------------------------------------
   State and storage. Progress lives in the viewer's private db doc when
   the page runs as a claude.ai artifact, and in localStorage otherwise.
------------------------------------------------------------------- */
const LS_KEY = "transurfing-path-v1";
const blank = () => ({ v: 2, bookId: "transurfing", read: {}, quiz: {}, log: {}, journal: [], reflections: {}, book: { title: "Reality Transurfing", page: 0, pages: 0, where: "" }, chRead: {}, list: [], mk: { week: 1, started: 0, weekStart: 0, minutes: 0 }, last: null, lastBy: {}, lastCh: null, updated: 0 });
let S = blank();
let remote = null;
let saveTimer = null, saving = Promise.resolve();

function lsRead() { try { const r = localStorage.getItem(LS_KEY); return r ? JSON.parse(r) : null; } catch { return null; } }
function lsWrite() { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch {} }
function normalize(x) {
  const b = blank(); if (!x || typeof x !== "object") return b;
  const n = { ...b, ...x, book: { ...b.book, ...(x.book || {}) } };
  if (!BOOKS[n.bookId]) n.bookId = "transurfing";
  if (!Array.isArray(n.list)) n.list = [];
  n.mk = { ...b.mk, ...(x.mk || {}) };
  if (!Array.isArray(n.journal)) n.journal = [];
  return n;
}

function setSync(t) { document.getElementById("sync").textContent = t; }

function save() {
  S.updated = Date.now();
  lsWrite();
  if (!remote) return;
  clearTimeout(saveTimer);
  setSync("Saving…");
  saveTimer = setTimeout(() => {
    const body = JSON.parse(JSON.stringify(S));
    saving = saving.then(() => remote.set(body)).then(
      () => setSync("Saved to your account"),
      (e) => setSync(e && e.code === "quota_exceeded" ? "Account storage full; saved in this browser" : "Saved in this browser (sync failed)")
    );
  }, 700);
}

async function connect() {
  if (!window.claude || typeof window.claude.use !== "function") return;
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    const ref = db.doc("data/users/" + uid + "/progress");
    const snap = await ref.get();
    if (snap.exists) {
      const theirs = normalize(snap.data());
      if ((theirs.updated || 0) >= (S.updated || 0)) { S = theirs; lsWrite(); applyBook(); render(); }
      remote = ref;
      if ((S.updated || 0) > (theirs.updated || 0)) save(); else setSync("Saved to your account");
    } else {
      remote = ref;
      if (S.updated) save(); else setSync("Saved to your account");
    }
  } catch (e) { /* stay on browser storage */ }
}

const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const dayKey = (d = new Date()) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
let B = BOOKS.transurfing;
const lessonById = (id) => ALL_LESSONS.find((l) => l.id === id);
const lessonIndex = (id) => { for (const b of Object.values(BOOKS)) { const i = b.lessons.findIndex((l) => l.id === id); if (i >= 0) return i; } return -1; };
const bookOfLesson = (id) => Object.values(BOOKS).find((b) => b.lessons.some((l) => l.id === id));
function status(id) {
  const q = S.quiz[id];
  if (q && q.score === q.total) return "mastered";
  if (S.read[id]) return "read";
  return "new";
}
function statusChip(id) {
  const s = status(id);
  return s === "mastered" ? '<span class="chip mastered">Mastered</span>' : s === "read" ? '<span class="chip read">Read</span>' : '<span class="chip">New</span>';
}
function activeDays() {
  const days = new Set(Object.keys(S.log).filter((k) => (S.log[k] || []).length));
  Object.values(S.read).forEach((t) => days.add(dayKey(new Date(t))));
  Object.values(S.chRead).forEach((t) => days.add(dayKey(new Date(t))));
  S.journal.forEach((j) => days.add(dayKey(new Date(j.ts))));
  return days;
}
function streak() {
  const days = activeDays();
  const d = new Date();
  if (!days.has(dayKey(d))) d.setDate(d.getDate() - 1);
  let n = 0;
  while (days.has(dayKey(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function fmtDate(ts) { return new Date(ts).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }); }
const bookPracticeIds = () => new Set(B.practices.map((p) => p.id));
const todaysFor = () => (S.log[dayKey()] || []).filter((id) => bookPracticeIds().has(id));
let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 1800); }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

function applyBook() {

  if (opts.ch) { S.lastCh = opts.ch; save(); }

function heatmap() {
  const weeks = 16, end = new Date(); end.setHours(0, 0, 0, 0);
  const ids = bookPracticeIds();
  // columns run Mon–Sun; the last column contains today
  const s = new Date(end); s.setDate(s.getDate() - ((end.getDay() + 6) % 7) - (weeks - 1) * 7);
  const cells = [];
  for (let d = new Date(s); d <= end; d.setDate(d.getDate() + 1)) {
    const k = dayKey(d), n = (S.log[k] || []).filter((id) => ids.has(id)).length;

    cells.push(`<i data-l="${lvl}" class="${k === dayKey() ? "today" : ""}" title="${k}: ${n} practice${n === 1 ? "" : "s"}"></i>`);
  }
  return cells.join("");
}

function moveWant(id, dir) {
  const open = S.list.filter((w) => !w.done), i = open.findIndex((w) => w.id === id), j = i + dir;
  if (i < 0 || j < 0 || j >= open.length) return;
  [open[i], open[j]] = [open[j], open[i]];
  S.list = [...open, ...S.list.filter((w) => w.done)];
  save(); render();
}


/* Master Key: weekly course and sitting timer */
const mkWeek = () => Math.min(24, Math.max(1, S.mk.week || 1));
const TIMER = { dur: 15 * 60, left: 15 * 60, running: false, endAt: 0, iv: null, lock: null, audio: null };
const fmtClock = (s) => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(Math.floor(s % 60)).padStart(2, "0");
function timerTick() {
  if (!TIMER.running) return;
  TIMER.left = Math.max(0, Math.round((TIMER.endAt - Date.now()) / 1000));
  const el = $("#timer-clock"); if (el) el.textContent = fmtClock(TIMER.left);
  const bar = $("#timer-bar"); if (bar) bar.style.width = Math.round(100 * (1 - TIMER.left / TIMER.dur)) + "%";
  if (TIMER.left <= 0) timerDone();
}
function chime() {
  try {
    const a = TIMER.audio; if (!a) return;
    [0, 0.6].forEach((t, i) => {
      const o = a.createOscillator(), g = a.createGain();
      o.frequency.value = i ? 660 : 880; o.type = "sine";
      g.gain.setValueAtTime(0.0001, a.currentTime + t); g.gain.exponentialRampToValueAtTime(0.25, a.currentTime + t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + t + 1.8);
      o.connect(g); g.connect(a.destination); o.start(a.currentTime + t); o.stop(a.currentTime + t + 2);
    });
  } catch {}
}
function releaseLock() { try { TIMER.lock && TIMER.lock.release(); } catch {} TIMER.lock = null; }
function timerDone() {
  clearInterval(TIMER.iv); TIMER.running = false; TIMER.left = TIMER.dur; releaseLock(); chime();
  const k = dayKey(), arr = S.log[k] ? S.log[k].slice() : [];
  if (!arr.includes("mk-sit")) { arr.push("mk-sit"); S.log[k] = arr; }
  S.mk.minutes = (S.mk.minutes || 0) + Math.round(TIMER.dur / 60);
  save(); toast("Sitting complete"); if (view === "today" && B.id === "masterkey") render();
}
function timerStart() {
  try { TIMER.audio = TIMER.audio || new (window.AudioContext || window.webkitAudioContext)(); } catch {}
  TIMER.running = true; TIMER.endAt = Date.now() + TIMER.left * 1000;
  clearInterval(TIMER.iv); TIMER.iv = setInterval(timerTick, 500);
  try { navigator.wakeLock && navigator.wakeLock.request("screen").then((l) => (TIMER.lock = l), () => {}); } catch {}
  render();
}
function timerPause() { TIMER.left = Math.max(0, Math.round((TIMER.endAt - Date.now()) / 1000)); TIMER.running = false; clearInterval(TIMER.iv); releaseLock(); render(); }
function timerReset() { TIMER.running = false; clearInterval(TIMER.iv); TIMER.left = TIMER.dur; releaseLock(); render(); }

      <div class="bar"><i id="timer-bar" style="width:${pct}%"></i></div>
      <div class="row" style="justify-content:center">
        ${[15, 20, 30].map((m) => `<button class="btn small ${TIMER.dur === m * 60 ? "primary" : "ghost"}" data-dur="${m}" ${TIMER.running ? "disabled" : ""}>${m} min</button>`).join("")}
      </div>
      <div class="row" style="justify-content:center">

        ${TIMER.left < TIMER.dur || TIMER.running ? `<button class="btn ghost" id="t-reset">Reset</button>` : ""}

    const w = S.list.find((x) => x.id === b.dataset.save), t = $("#e-text").value.trim();
    if (!t) { toast("A want can't be empty"); return; }
    w.text = t.slice(0, 200); w.detail = $("#e-detail").value.trim().slice(0, 300); editing = null; save(); render(); toast("Saved");
  });
  m.querySelectorAll("[data-remove]").forEach((b) => b.onclick = () => {
    const id = b.dataset.remove;
    if (pendingDelete !== id) { pendingDelete = id; render(); return; }
    S.list = S.list.filter((w) => w.id !== id); pendingDelete = editing = null; save(); render(); toast("Removed. That's a sign of progress.");
  });
  m.querySelectorAll("[data-received]").forEach((b) => b.onclick = () => {
    const w = S.list.find((x) => x.id === b.dataset.received);
    w.done = Date.now(); w.thanks = $("#t-text").value.trim().slice(0, 1000); thanking = null;
    const k = dayKey(), arr = S.log[k] ? S.log[k].slice() : [];
    if (!arr.includes("iw-thanks")) { arr.push("iw-thanks"); S.log[k] = arr; }
    save(); render(); toast("Received. Thank you.");
  });
  m.querySelectorAll("[data-undo]").forEach((b) => b.onclick = () => {
    const w = S.list.find((x) => x.id === b.dataset.undo); w.done = 0;
    S.list = [...S.list.filter((x) => !x.done), ...S.list.filter((x) => x.done)];
    save(); render();
  });

  // lesson
  if (view === "lessons" && openLesson) {
    const l = lessonById(openLesson);
    const mr = $("#mark-read");
    if (mr) mr.onclick = () => { S.read[l.id] = Date.now(); save(); render(); toast("Marked as read"); };
    const answers = new Array(l.quiz.length).fill(null);
    m.querySelectorAll(".q").forEach((qel) => {
      const qi = +qel.dataset.qi, q = l.quiz[qi];
      qel.querySelectorAll(".opt").forEach((o) => o.onclick = () => {
        if (answers[qi] !== null) return;
        const oi = +o.dataset.oi; answers[qi] = oi;
        qel.querySelectorAll(".opt").forEach((x) => { x.disabled = true; if (+x.dataset.oi === q.a) x.classList.add("right"); });
        if (oi !== q.a) o.classList.add("wrong");
        const ex = qel.querySelector(".explain"); ex.textContent = (oi === q.a ? "Correct. " : "Not quite. ") + q.e; ex.hidden = false;
        if (answers.every((a) => a !== null)) {
          const score = answers.filter((a, i) => a === l.quiz[i].a).length, total = l.quiz.length;
          const prev = S.quiz[l.id];
          S.quiz[l.id] = { score: Math.max(score, prev ? prev.score : 0), total, ts: Date.now(), lastScore: score };
          if (!S.read[l.id]) S.read[l.id] = Date.now();
          save();
          const r = $("#quiz-result"); r.hidden = false;
          r.innerHTML = `<span class="chip ${score === total ? "mastered" : "read"}">${score}/${total}</span><span class="note">${score === total ? "Lesson mastered." : "Reread the key ideas and try again."}</span><span class="spacer"></span><button class="btn small" id="retry">Try again</button>`;
          $("#retry").onclick = () => { render(); $("#quiz").scrollIntoView({ block: "start" }); };
        }
      });
    });
    const ta = $("#reflect");
    let rt; ta.oninput = () => { clearTimeout(rt); rt = setTimeout(() => { S.reflections[l.id] = ta.value; save(); $("#reflect-note").textContent = "Draft saved"; }, 600); };
    $("#save-reflect").onclick = () => {
      const t = ta.value.trim(); if (!t) { $("#reflect-note").textContent = "Write something first."; return; }
      S.journal.push({ id: "j" + uid(), ts: Date.now(), text: t, lesson: l.id });
      S.reflections[l.id] = ""; ta.value = ""; save();
      $("#reflect-note").textContent = "Saved to your journal.";
    };
  }

  // journal
  const add = $("#j-add");
  if (add) add.onclick = () => {
    const t = $("#j-text").value.trim(); if (!t) { toast("Write something first"); return; }
    S.journal.push({ id: "j" + uid(), ts: Date.now(), text: t.slice(0, 5000), lesson: $("#j-lesson").value || null });
    save(); render(); toast("Entry added");
  };
  const jf = $("#j-filter"); if (jf) jf.onchange = () => { journalFilter = jf.value; render(); };
  m.querySelectorAll("[data-del]").forEach((b) => b.onclick = () => {
    const id = b.dataset.del;
    if (pendingDelete !== id) { pendingDelete = id; render(); return; }
    S.journal = S.journal.filter((j) => j.id !== id); pendingDelete = null; save(); render(); toast("Entry deleted");
  });

  // glossary
  const gq = $("#gloss-q");
  if (gq) gq.oninput = () => { glossQ = gq.value; const pos = gq.selectionStart; render(); const n = $("#gloss-q"); n.focus(); n.setSelectionRange(pos, pos); };

  // data
  const exp = $("#exp");
  if (exp) exp.onclick = () => {
    const txt = JSON.stringify(S); const box = $("#exp-text"); box.value = txt;
    navigator.clipboard.writeText(txt).then(() => { $("#exp-note").textContent = "Copied to clipboard."; }, () => { box.hidden = false; box.select(); $("#exp-note").textContent = "Copy the selected text below."; });
  };
  const imp = $("#imp");
  if (imp) imp.onclick = () => {
    try { const x = JSON.parse($("#imp-text").value); if (!x || typeof x !== "object" || !x.read) throw 0; S = normalize(x); save(); applyBook(); toast("Backup restored"); go("today"); }
    catch { $("#imp-note").textContent = "That text isn't a valid backup. Paste the full text from Copy backup."; }
  };
  const rs = $("#reset");
  if (rs) rs.onclick = () => {
    if (!resetArmed) { resetArmed = true; render(); return; }
    resetArmed = false; S = blank(); save(); applyBook(); toast("Progress reset"); go("today");
  };
}

document.getElementById("tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-view]"); if (!b) return;
  go(b.dataset.view);
});
document.getElementById("books").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-book]"); if (!b || b.dataset.book === S.bookId) return;
  S.bookId = b.dataset.book; save(); applyBook(); go(view);
});

/* boot */
S = normalize(lsRead());
const h = (location.hash || "").slice(1);
if (BOOKS[h]) S.bookId = h;
applyBook();
if (B.tabs.includes(h)) view = h;
render();
connect();
</script>
