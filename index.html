hangeable; if this were not so, it would not be reliable; all principles are changeless.", "7. This stability is your opportunity; you are its active attribute, the channel for its activity; the Universal can act only through the individual.", "8. When you begin to perceive that the essence of the Universal is within yourself—is you—you begin to do things; you begin to feel your power; it is the fuel which fires the imagination; which lights the torch of inspiration; which gives vitality to thought; which enables you to connect with all the invisible forces of the Universe. It is this power which will enable you to plan fearlessly, to execute masterfully.", "9. But perception will come only in the Silence; this seems to be the condition required for all great purposes. You are a visualizing entity. Imagination is your workshop. It is here that your ideal is to be visualized.", "10. As a perfect understanding of the nature of this power is a primary condition for its manifestation, visualize the entire method over and over again, so that you may use it whenever occasion requires. The infinity of wisdom is to follow the method whereby we may have the inspiration of the omnipotent Universal Mind on demand at any time.", "11. We can fail to recognize this world within, and so exclude it from our consciousness, but it will still be the basic fact of all existence; and when we learn to recognize it, not only in ourselves, but in all persons, events, things and circumstances we shall have found the “Kingdom of heaven” which we are told is “within” us.", "12. Our failures are a result of the operation of exactly the same principle; the principle is unchangeable; its operation is exact, there is no deviation; if we think lack, limitation, discord, we shall find their fruits on every hand; if we think poverty, unhappiness or disease, the thought messengers will carry the summons as readily as any other kind of thought and the result will be just as certain. If we fear a coming calamity, we shall be able to say with Job, “the thing I feared has come upon me”; if we think unkindly or ignorantly we shall thus attract to ourselves the results of our ignorance.", "13. This power of thought, if understood and correctly used, is the greatest labor-saving device ever dreamed of, but if not understood or improperly used, the result will in all probability be disastrous, as we have already seen; by the help of this power you can confidently undertake things that are seemingly impossible, because this power is the secret of all inspiration, all genius.", "14. To become inspired means to get out of the beaten path, out of the rut, because extraordinary results require extraordinary means. When we come into a recognition of the Unity of all things and that the source of all power is within, we tap the source of inspiration.", "15. Inspiration is the art of imbibing, the art of self-realization; the art of adjusting the individual mind to that of the Universal Mind; the art of attaching the proper mechanism to the source of all power; the art of differentiating the formless into form; the art of becoming a channel for the flow of Infinite Wisdom; the art of visualizing perfection; the art of realizing the omnipresence of Omnipotence.", "16. An understanding and appreciation of the fact that the infinite power is omnipresent and is therefore in the infinitely small as well as the infinitely large will enable us to absorb its essence; a further understanding of the fact that this power is spirit and therefore indivisible will enable us to appreciate its present at all points at the same time.", "17. An understanding of these facts, first intellectually and then emotionally, will enable us to drink deeply from this ocean of infinite power. An intellectual understanding will be of no assistance; the emotions must be brought into action; thought without feeling is cold. The required combination is thought and feeling.", "18. Inspiration is from within. The Silence is necessary, the senses must be stilled, the muscles relaxed, repose cultivated. When you have thus come into possession of a sense of poise and power you will be ready to receive the information or inspiration or wisdom which may be necessary for the development of your purpose.", "19. Do not confuse these methods with those of the clairvoyant; they have nothing in common. Inspiration is the art of receiving and makes for all that is best in life; your business in life is to understand and command these invisible forces instead of letting them command and rule you. Power implies service; inspiration implies power; to understand and apply the method of inspiration is to become a superman.", "20. We can live more abundantly every time we breathe, if we consciously breathe with that intention. The IF is a very important condition in this case, as the intention governs the attention, and without the attention you can secure only the results which every one else secures. That is, a supply equal to the demand.", "21. In order to secure the larger supply your demand must be increased, and as you consciously increase the demand the supply will follow, you will find yourself coming into a larger and larger supply of life, energy and vitality.", "22. The reason for this is not difficult to understand, but it is another of the vital mysteries of life which does not seem to be generally appreciated. If you make it your own, you will find it one of the great realities of life.", "23. We are told that “In Him we live and move and have our being,” and we are told that “He” is a Spirit, and again that “He” is Love, so that every time we breathe, we breathe this life, love, and spirit. This is Pranic Energy, or Pranic Ether, we could not exist a moment without it. It is the Cosmic Energy; it is the Life of the Solar Plexus.", "24. Every time we breathe we fill our lungs with air and at the same time vitalize our body with this Pranic Ether which is Life itself, so that we have the opportunity of making a conscious connection with All Life, All Intelligence and All Substance.", "25. A knowledge of your relation and oneness with this Principle that governs the Universe and the simple method whereby you can consciously identify yourself with it gives you a scientific understanding of a law whereby you may free yourself from disease, from lack or limitation of any kind; in fact, it enables you to breathe the “breath of life” into your own nostrils.", "26. This “breath of life” is a superconscious reality. It is the essence of the “I am.” It is pure “Being” or Universal Substance, and our conscious unity with it enables us to localize it, and thus exercise the powers of this creative energy.", "27. Thought is creative vibration and the quality of the conditions created will depend upon the quality of our thought, because we cannot express powers which we do not possess. We must “be” before we can “do” and we can “do” only to the extent to which we “are,” and so what we do will necessarily coincide with what we “are” and what we are depends upon what we “think.”", "28. Every time you think you start a train of causation which will create a condition in strict accordance with the quality of the thought which originated it. Thought which is in harmony with the Universal Mind will result in corresponding conditions. Thought which is destructive or discordant will produce corresponding results. You may use thought constructively or destructively, but the immutable law will not allow you to plant a thought of one kind and reap the fruit of another. You are free to use this marvelous creative power as you will, but you must take the consequences.", "29. This is the danger from what is called Will Power. There are those who seem to think that by force of will they can coerce this law; that they can sow seed of one kind and by “Will Power” make it bear fruit of another, but the fundamental principle of creative power is in the Universal, and therefore the idea of forcing a compliance with our wishes by the power of the individual will is an inverted conception which may appear to succeed for a while but is eventually doomed to failure - because it antagonizes the very power which it is seeking to use.", "30. It is the individual attempting to coerce the Universal, the finite in conflict with the Infinite. Our permanent well-being will be best conserved by a conscious cooperation with the continuous forward movement of the Great Whole.", "31. For your exercise this week, go into the Silence and concentrate on the fact that “In him we live and move and have our being” is literally and scientifically exact! That you ARE because He IS, that if He is Omnipresent He must be in you. That if He is all in all you must be in Him! That He is Spirit and you are made in “His image and likeness” and that the only difference between His spirit and your spirit is one of degree, that a part must be the same in kind and quality as the whole. When you can realize this clearly you will have found the secret of the creative power of thought, you will have found the origin of both good and evil, you will have found the secret of the wonderful power of concentration, you will have found the key to the solution of every problem whether physical, financial, or environmental.", "The power to think consecutively and deeply and clearly, is an avowed and deadly enemy to mistakes and blunders, superstitions, unscientific theories, irrational beliefs, unbridled enthusiasm, fanaticism.", "Haddock"], "qa": [{"q": "Upon what condition does power depend?", "a": "Upon recognition and use."}, {"q": "What is recognition?", "a": "Consciousness."}, {"q": "How do we become conscious of power?", "a": "By thinking."}, {"q": "What then is the true business of life?", "a": "Correct scientific thinking."}, {"q": "What is correct scientific thinking?", "a": "The ability to adjust our thought processes to the will of the Universal. In other words, to cooperate with Natural laws."}, {"q": "How is this accomplished?", "a": "By securing a perfect understanding of the principles, forces, methods and combinations of mind."}, {"q": "What is this Universal Mind?", "a": "The basic fact of all existence."}, {"q": "What is the cause of all lack, limitation, disease and discord?", "a": "It is due to the operation of exactly the same law, the law operates relentlessly and is continually bringing about conditions in correspondence with the thought which originated or created them."}, {"q": "What is inspiration?", "a": "The art of realizing the omnipresence of Omniscience."}, {"q": "Upon what does the conditions with which we meet depend?", "a": "Upon the quality of our thought. Because what we do depends upon what we are and what we are depends upon what we think."}]}, {"id": "mkp-21", "title": "Part Twenty-One", "n": 21, "letter": ["It is my privilege to enclose Part Twenty-One. In paragraph 7 you will find that one of the secrets of success, one of the methods of organizing victory, one of the accomplishments of the Master Mind is to think big thoughts.", "In paragraph 8 you will find that everything which we hold in our consciousness for any length of time becomes impressed upon our subconsciousness and so becomes a pattern which the creative energy will wave into our life and environment. This is the secret of the wonderful power of prayer.", "We know that the universe is governed by law; that for every effect there must be a cause, and that the same cause, under the same conditions, will invariably produce the same effect.", "Consequently, if prayer has ever been answered, it will always be answered, if the proper conditions are complied with. This must necessarily be true; otherwise the universe would be a chaos instead of a cosmos. The answer to prayer is therefore subject to law, and this law is definite, exact and scientific, just as are the laws governing gravitation and electricity. An understanding of this law takes the foundation of Christianity out of the realm of superstition and credulity and places it upon the firm rock of scientific understanding.", "But, unfortunately, there are comparatively few persons who know how to pray.", "They understand that there are laws governing electricity, mathematics, and chemistry, but, for some inexplicable reason, it never seems to occur to them that there are also spiritual laws, and that these laws are also definite, scientific, exact, and operate with immutable precision."], "body": ["1. The real secret of power is consciousness of power. The Universal Mind is unconditional; therefore, the more conscious we become of our unity with this mind, the less conscious we shall become of conditions and limitations, and as we become emancipated or freed from conditions we come into a realization of the unconditional. We have become free!", "2. As soon as we become conscious of the inexhaustible power in the world within, we begin to draw on this power and apply and develop the greater possibilities which this discernment has realized, because whatever we become conscious of, is invariably manifested in the objective world, is brought forth into tangible expression.", "3. This is because the Infinite Mind, which is the source from which all things proceed, is one and indivisible, and each individual is a channel whereby this Eternal Energy is being manifested. Our ability to think is our ability to act upon this Universal Substance, and what we think is what is created or produced in the objective world.", "4. The result of this discovery is nothing less than marvelous, and means that mind is extraordinary in quality, limitless in quantity, and contains possibilities without number. To become conscious of this power is to become a “live wire”; it has the same effect as placing an ordinary wire in contact with a wire that is charged. The Universal is the live wire. It carries power sufficient to meet every situation which may arise in the life of every individual. When the individual mind touches the Universal Mind it receives all the power it requires. This is the world within. All science recognizes the reality of this world, and all power is contingent upon our recognition of this world.", "5. The ability to eliminate imperfect conditions depends upon mental action, and mental action depends upon consciousness of power; therefore, the more conscious we become of our unity with the source of all power, the greater will be our power to control and master every condition.", "6. Large ideas have a tendency to eliminate all smaller ideas so that it is well to hold ideas large enough to counteract and destroy all small or undesirable tendencies. This will remove innumerable petty and annoying obstacles from your path. You also become conscious of a larger world of thought, thereby increasing your mental capacity as well as placing yourself in position to accomplish something of value.", "7. This is one of the secrets of success, one of the methods of organizing victory, one of the accomplishments of the Master-Mind. He thinks big thoughts. The creative energies of mind find no more difficulty in handling large situations, than small ones. Mind is just as much present in the Infinitely large as in the Infinitely small.", "8. When we realize these facts concerning mind we understand how we may bring ourselves any condition by creating the corresponding conditions in our consciousness, because everything which is held for any length of time in the consciousness, eventually becomes impressed upon the subconscious and thus becomes a pattern which the creative energy will wave into the life and environment of the individual.", "9. In this way conditions are produced and we find that our lives are simply the reflection of our predominant thoughts, our mental attitude; we see then that the science of correct thinking is the one science, that it includes all other sciences.", "10. From this science we learn that every thought creates an impression on the brain, that these impressions create mental tendencies, and these tendencies create character, ability and purpose, and that the combined action of character, ability and purpose determines the experiences with which we shall meet in life.", "11. These experiences come to us through the Law of Attraction; through the action of this law we meet in the world without the experiences which correspond to our world within.", "12. The predominant thought or the mental attitude is the magnet, and the law is that “like attracts like”, consequently the mental attitude will invariably attract such conditions as correspond to its nature.", "13. This mental attitude is our personality and is composed of the thoughts which we have been creating in our own mind; therefore, if we wish a change in conditions all that is necessary is to change our thought; this will in turn change our mental attitude, which will in turn change our personality, which will in turn change the persons, things and conditions, or, the experiences with which we meet in life.", "14. It is, however, no easy matter to change the mental attitude, but by persistent effort it may be accomplished; the mental attitude is patterned after the mental pictures which have been photographed on the brain; if you do not like the pictures, destroy the negatives and create new pictures; this is the art of visualization.", "15. As soon as you have done this you will begin to attract new things, and the new things will correspond to the new pictures. To do this: impress on the mind a perfect picture of the desire which you wish to have objectified and continue to hold the picture in mind until results are obtained.", "16. If the desire is one which requires determination, ability, talent, courage, power or any other spiritual power, these are necessary essentials for your picture; build them in; they are the vital part of the picture; they are the feeling which combines with thought and creates the irresistible magnetic power which draws the things you require to you. They give your picture life, and life means growth, and as soon as it beings to grow, the result is practically assured.", "17. Do not hesitate to aspire to the highest possible attainments in anything you may undertake, for the mind forces are ever ready to lend themselves to a purposeful will in the effort to crystallize its highest aspirations into acts, accomplishments, and events.", "18. An illustration of how these mind forces operate is suggested by the method in which all our habits are formed. We do a thing, then do it again, and again, and again, until it becomes easy and perhaps almost automatic; and the same rule applies in breaking any and all bad habits; we stop doing a thing, and then avoid it again, and again until we are entirely free from it; and if we do fail now and then, we should by no means lose hope, for the law is absolute and invincible and gives us credit for every effort and every success, even though our efforts and successes are perhaps intermittent.", "19. There is no limit to what this law can do for you; dare to believe in your own idea; remember that Nature is plastic to the ideal; think of the ideal as an already accomplished fact.", "20. The real battle of life is one of ideas; it is being fought out by the few against the many; on the one side is the constructive and creative thought, on the other side the destructive and negative thought; the creative thought is dominated by an ideal, the passive thought is dominated by appearances. On both sides are men of science, men of letters, and men of affairs.", "21. On the creative side are men who spend their time in laboratories, or over microscopes and telescopes, side by side with the men who dominate the commercial, political, and scientific world; on the negative side or men who spend their time investigating law and precedent, men who mistake theology for religion, statesmen who mistake might for right, and all the millions who seem to prefer precedent to progress, who are eternally looking backward instead of forward, who see only the world without, but know nothing of the world within.", "22. In the last analysis there are but these two classes; all men will have to take their place on one side or the other; they will have to go forward, or go back; there is no standing still in a world where all is motion; it is this attempt to stand still that gives sanction and force to arbitrary and unequal codes of law.", "23. That we are in a period of transition is evidenced by the unrest which is everywhere apparent. The complaint of humanity is as a roll of heaven’s artillery, commencing with low and threatening notes and increasing until the sound is sent from cloud to cloud, and the lightning splits the air and earth.", "24. The sentries who patrol the most advanced outposts of the Industrial, Political, and Religious world are calling anxiously to each other. What of the night? The danger and insecurity of the position they occupy and attempt to hold is becoming more apparent every hour. The dawn of a new era necessarily declares that the existing order of things cannot much longer be.", "25. The issue between the old regime and the new, the crux of the social problem, is entirely a question of conviction in the minds of the people as to the nature of the Universe. When they realize that the transcendent force of spirit or mind of the Cosmos is within each individual, it will be possible to frame laws that shall consider the liberties and rights of the many instead of the privileges of the few.", "26. As long as the people regard the Cosmic power as a power non-human and alien to humanity, so long will it be comparatively easy for a supposed privileged class to rule by Divine right in spite of every protest of social sentiment. The real interest of democracy is therefore to exalt, emancipate and recognize the divinity of the human spirit. To recognize that all power is from within. That no human being has any more power than any other human being, except such as may willingly be delegated to him. The old regime would have us believe that the law was superior to the law-makers; herein is the gist of the social crime of every form of privilege and personal inequality, the institutionalizing of the fatalistic doctrine of Divine election.", "27. The Divine Mind is the Universal Mind; it makes no exceptions, it plays no favorites; it does not act through sheer caprice or from anger, jealousy or wrath; neither can it be flattered, cajoled or moved by sympathy or petition to supply man with some need which he thinks necessary for his happiness or even his existence. The Divine Mind makes no exceptions to favor any individual; but when the individual understands and realizes his Unity with the Universal principle he will appear to be favored because he will have found the source of all health, all wealth, and all power.", "28. For your exercise this week, concentrate on the Truth. Try to realize that the Truth shall make you free, that is, nothing can permanently stand in the way of your perfect success when you learn to apply the scientifically correct thought methods and principles. Realize that you are externalizing in your environment your inherent soul potencies. Realize that the Silence offers an ever-available and almost unlimited opportunity for awakening the highest conception of Truth. Try to comprehend that Omnipotence itself is absolute silence, all else is change, activity, limitation. Silent thought concentration is therefore the true method of reaching, awakening, and then expressing the wonderful potential power of the world within.", "The possibilities of thought training are infinite, its consequence eternal, and yet few take the pains to direct their thinking into channels that will do them good, but instead leave all to chance.", "Marden"], "qa": [{"q": "What is the real secret of power?", "a": "The consciousness of power, because whatever we become conscious of, is invariably manifested in the objective world, is brought forth into tangible expression."}, {"q": "What is the source of this power?", "a": "The Universal Mind, from which all things proceed, and which is one and indivisible."}, {"q": "How is this power being manifested?", "a": "Through the individual, each individual is a channel whereby this energy is being differentiated in form."}, {"q": "How may we connect with this Omnipotence?", "a": "Our ability to think is our ability to act on this Universal Energy, and what we think is what is produced or created in the objective world."}, {"q": "What is the result of this discovery?", "a": "The result is nothing less than marvelous, it opens unprecedented and limitless opportunity."}, {"q": "How, then, may we eliminate imperfect conditions?", "a": "By becoming conscious of our Unity with the source of all power."}, {"q": "What is one of the distinctive characteristics of the Master Mind?", "a": "He thinks big thoughts, he holds ideas large enough to counteract and destroy all petty and annoying obstacles."}, {"q": "How do experiences come to us?", "a": "Through the law of attraction."}, {"q": "How is this law brought into operation?", "a": "By our predominant mental attitude."}, {"q": "What is the issue between the old regime and the new?", "a": "A question of conviction as to the nature of the Universe. The old regime is trying to cling to the fatalistic doctrine of Divine election. The new regime recognizes the divinity of the individual, the democracy of humanity."}]}, {"id": "mkp-22", "title": "Part Twenty-Two", "n": 22, "letter": ["In Part Twenty-two you will find that thoughts are spiritual seeds, which, when planted in the subconscious mind, have a tendency to sprout and grow, but unfortunately the fruit is frequently not to our liking.", "The various forms of inflammation, paralysis, nervousness and diseased conditions generally, are the manifestation of fear, worry, care, anxiety, jealousy, hatred and similar thought.", "The life processes are carried on by two distinct methods; first, the taking up and making use of nutritive material necessary for constructing cells; second, breaking down and excreting the waste material.", "All life is based upon these constructive and destructive activities, and as food, water and air are the only requisites necessary for the construction of cells, it would seem that the problem of prolonging life indefinitely would not be a very difficult one.", "However strange it may seem, it is the second or destructive activity that is, with rare exception, the cause of all disease. The waste material accumulates and saturates the tissues, which causes autointoxication. This may be partial or general. In the first case the disturbance will be local; in the second place it will affect the whole system.", "The problem, then, before us in the healing of disease is to increase the inflow and distribution of vital energy throughout the system, and this can only be done by eliminating thoughts of fear, worry, care, anxiety, jealousy, hatred, and every other destructive thought, which tend to tear down and destroy the nerves and glands which control the excretion and elimination of poisonous and waste matter.", "“Nourishing foods and strengthening tonics” cannot bestow life, because these are but secondary manifestations to life. The primary manifestation of life and how you may get in touch with it is explained in the Part which I have the privilege of enclosing herewith."], "body": ["1. Knowledge is of priceless value, because by applying knowledge we can make our future what we wish it to be. When we realize that our present character, our present environment, our present ability, our present physical condition are all the result of past methods of thinking, we shall begin to have some conception of the value of knowledge.", "2. If the state of our health is not all that could be desired, let us examine our method of thinking; let us remember that every thought produces an impression on the mind; every impression is a seed which will sink into the subconscious and form a tendency; the tendency will be to attract other similar thoughts and before we know it we shall have a crop which must be harvested.", "3. If these thoughts contain disease germs, the harvest will be sickness, decay, weakness, and failure; the question is, what are we thinking, what are we creating, what is the harvest to be?", "4. If there is any physical condition which it is necessary to change, the law governing visualization will be found effective. Make a mental image of physical perfection, hold it in the mind until it is absorbed by the consciousness. Many have eliminated chronic ailments in a few weeks by this method, and thousands have overcome and destroyed all manner of ordinary physical disturbances by this method in a few days, sometimes in a few minutes.", "5. It is through the law of vibration that the mind exercises this control over the body. We know that every mental action is a vibration, and we know that all form is simply a mode of motion, a rate of vibration. Therefore, any given vibration immediately modifies every atom in the body, every life cell is affected and an entire chemical change is made in every group of life cells.", "6. Everything in the Universe is what it is by virtue of its rate of vibration. Change the rate of vibration and you change the nature, quality and form. The vast panorama of nature, both visible and invisible, is being constantly changed by simply changing the rate of vibration, and as thought is a vibration we can also exercise this power. We can change the vibration and thus produce any condition which we desire to manifest in our bodies.", "7. We are all using this power every minute. The trouble is most of us are using it unconsciously and thus producing undesirable results. The problem is to use it intelligently and produce only desirable results. This should not be difficult, because we all have had sufficient experience to know what produces pleasant vibration in the body, and we also know the causes which produce the unpleasant and disagreeable sensations.", "8. All that is necessary is to consult our own experience. When our thought has been uplifted, progressive, constructive, courageous, noble, kind or in any other way desirable, we have set in motion vibrations which brought about certain results. When our thought has been filled with envy, hatred, jealousy, criticism or any of the other thousand and one forms of discord, certain vibrations were set in motion which brought about certain other results of a different nature, and each of these rates of vibration, if kept up, crystallized in form. In the first case the result was mental, moral and physical health, and in the second case discord, inharmony and disease.", "9. We can understand, then, something of the power which the mind possesses over the body.", "10. The objective mind has certain effects on the body which are readily recognized. Someone says something to you which strikes you as ludicrous and you laugh, possibly until your whole body shakes, which shows that thought has control over the muscles of your body; or someone says something which excites your sympathy and your eyes fill with tears, which shows that thought controls the glands of your body; or someone says something which makes you angry and the blood mounts to your cheek, which shows that thought controls the circulation of your blood. But as these experiences are all the results of the action of your objective mind over the body, the results are of a temporary nature; they soon pass away and leave the situation as it was before.", "11. Let us see how the action of the subconscious mind over the body differs. You receive a wound; thousands of cells being the work of healing at once; in a few days or a few weeks the work is complete. You may even break a bone. No surgeon on earth can weld the parts together (I am not referring to the insertion of rods or other devices to strengthen or replace bones). He may set the bone for you, and the subjective mind will immediately begin the process of welding the parts together, and in a short time the bone is as solid as it ever was. You may swallow poison; the subjective mind will immediately discover the danger and make violent efforts to eliminate it. You may become infected with a dangerous germ; the subjective will at once commence to build a wall around the infected area and destroy the infection by absorbing it in the white blood corpuscles which it supplies for the purpose.", "12. These processes of the subconscious mind usually proceed without our personal knowledge or direction, and so long as we do not interfere the result is perfect, but, as these millions of repair cells are all intelligent and respond to our thought, they are often paralyzed and rendered impotent by our thoughts of fear, doubt, and anxiety. They are like an army of workmen, ready to start an important piece of work, but every time they get started on the undertaking a strike is called, or plans changed, until they finally get discouraged and give up.", "13. The way to health is founded on the law of vibration, which is the basis of all science, and this law is brought into operation by the mind, the “world within.” It is a matter of individual effort and practice. Our world of power is within; if we are wise we shall not waste time and effort in trying to deal with effects as we find them in the “world without,” which is only an external, a reflection.", "14. We shall always find the cause in the “world within”; by changing the cause, we change the effect.", "15. Every cell in your body is intelligent and will respond to your direction. The cells are all creators and will create the exact pattern which you give them.", "16. Therefore, when perfect images are placed before the subjective, the creative energies will build a perfect body.", "17. Brain cells are constructed in the same way. The quality of the brain is governed by the state of mind, or mental attitude, so that if undesirable mental attitudes are conveyed to the subjective they will in turn be transferred to the body; we can therefore readily see that if we wish the body to manifest health, strength and vitality this must be the predominant thought.", "18. We know then that every element of the human body is the result of a rate of vibration.", "19. We know that mental action is a rate of vibration.", "20. We know that a higher rate of vibration governs, modifies, controls, changes, or destroys a lower rate of vibration.", "21. We know that the rate of vibration is governed by the character of brain cells, and finally,", "22. We know how to create these brain cells; therefore,", "23. We know how to make any physical change in the body we desire, and having secured a working knowledge of the power of mind to this extent, we have come to know that there is practically no limitation which can be placed upon our ability to place ourselves in harmony with natural law, which is omnipotent.", "24. This influence or control over the body by mind is coming to be more and more generally understood, and many physicians are now giving the matter their earnest attention. Dr. Albert T. Shofield, who has written several important books on the subject, say, “The subject of mental therapeutics is still ignored in medical works generally. In our physiologies no references is made to the central controlling power that rules the body for its good, and the power of the mind over the body is seldom spoken of”.", "25. No doubt many physicians treat nervous diseases of functional origin wisely and well, but what we contend is that the knowledge they display was taught at no school, was learned from no book, but it is intuitive and empirical.", "26. This is not as it should be. The power of mental therapeutics should be the subject of careful, special and scientific teaching in every medical school. We might pursue the subject of maltreatment, or want of treatment, further in detail and describe the disastrous results of neglected cases; but the task is an invidious one.", "27. There can be no doubt that few patients are aware how much they can do for themselves. What the patient can do for himself, the forces he can set in motion are as yet unknown. We are inclined to believe that they are far greater than most imagine, and will undoubtedly be used more and more. Mental therapeutics may be directed by the patient himself to calming the mind in excitement, by arousing feelings of joy, hope, faith, and love; by suggesting motives for exertion, by regular mental work, by diverting the thoughts from the malady.", "28. For your exercise this week concentrate on Tennyson’s beautiful lines “Speak to Him, thou, for He hears, and spirit with spirit can meet, Closer is He than breathing, and nearer than hands and feet.” Then try to realize that when you do “Speak to Him” you are in touch with Omnipotence.", "29. This realization and recognition of this Omnipresent power will quickly destroy any and every form of sickness or suffering and substitute harmony and perfection. Then remember there are those who seem to think that sickness and suffering are sent by God; if so, every physician, every surgeon and every Red Cross nurse is defying the will of God and hospitals and sanitariums are places of rebellion instead of houses of mercy. Of course, this quickly reasons itself into an absurdity, but there are many; who still cherish the idea.", "30. Then let the thought rest on the fact that until recently theology has been trying to teach an impossible Creator, one who created beings capable of sinning and then allowed them to be eternally punished for such sins. Of course the necessary outcome of such extraordinary ignorance was to create fear instead of love, and so, after two thousand years of this kind of propaganda, Theology is now busily engaged in apologizing for Christendom.", "31. You will then more readily appreciate the ideal man, the man made in the image and likeness of God, and you will more readily appreciate the all originating Mind that forms, upholds, sustains, originates, and creates all there is.", "All are but parts of one stupendous whole, Whose body nature is, and God the soul.", "Opportunity follows perception, action follows inspiration, growth follows knowledge, eminence flows progress. Always the spiritual first, then the transformation into the infinite and illimitable possibilities of achievement."], "qa": [{"q": "How may sickness be eliminated?", "a": "By placing ourselves in harmony with Natural Law which is Omnipotent."}, {"q": "What is the process?", "a": "A realization that man is a spiritual being and that this spirit must necessarily be perfect."}, {"q": "What is the result?", "a": "A conscious recognition of this perfection - first intellectually, then emotionally - brings about a manifestation of this perfection."}, {"q": "Why is this so?", "a": "Because thought is spiritual and therefore creative and correlates with its object and brings it into manifestation."}, {"q": "What Natural Law is brought into operation?", "a": "The Law of Vibration."}, {"q": "Why does this govern?", "a": "Because a higher rate of vibration governs, modifies, controls, changes, or destroys a lower rate of vibration."}, {"q": "Is this system of mental therapeutics generally recognized?", "a": "Yes, there are literally millions of people in this country who make use of it in one form or another (and obviously many more world-wide)."}, {"q": "What is the result of this system of thought?", "a": "For the first time in the world’s history every man’s highest reasoning faculty can be satisfied by a demonstrable truth which is now fast flooding the world."}, {"q": "Is this system applicable to other forms of supply?", "a": "It will meet every human requirement or necessity."}, {"q": "Is this system scientific or religious?", "a": "Both. True science and true religion are twin sisters, where one goes, the other necessarily follows."}]}, {"id": "mkp-23", "title": "Part Twenty-Three", "n": 23, "letter": ["In the part which I have the honor to transmit herewith you will find that money weaves itself into the entire fabric of our very existence; that the law of success is service; that we get what we give, and for this reason we should consider it a great privilege to be able to give.", "We have found that thought is the creative activity behind every constructive enterprise. We can therefore give nothing of more practical value than our thought.", "Creative thought requires attention, and the power of attention is, as we have found, the weapon of the Super-man. Attention develops concentration, and concentration develops Spiritual Power, and Spiritual Power is the mightiest force in existence.", "This is the science which embraces all sciences. It is the art which, above all arts, is relevant to human life. In the mastery of this science and this art there is opportunity for unending progression. Perfection in this is not acquired in six days, nor in six weeks, nor in six months. It is the labor of life. Not to go forward is to go backward.", "It is inevitable that the entertainment of positive, constructive and unselfish thoughts should have a far-reaching effect for good. Compensation is the keynote of the universe. Nature is constantly seeking to strike an equilibrium. Where something is sent out something must be received; else there should be a vacuum formed.", "By observance of this rule you cannot fail to profit in such measure as to amply justify your effort along this line."], "body": ["1. The money consciousness is an attitude of mind; it is the open door to the arteries of commerce. It is the receptive attitude. Desire is the attractive force which sets the current in motion and fear is the great obstacle by which the current is stopped or completely reversed, turned away from us.", "2. Fear is just the opposite from money consciousness; it is poverty consciousness, and as the law is unchangeable we get exactly what we give; if we fear we get what we feared. Money weaves itself into the entire fabric of our very existence; it engages the best thought of the best minds.", "3. We make money by making friends, and we enlarge our circle of friends by making money for them, by helping them, by being of service to them. The first law of success then is service, and this in turn is built on integrity and justice. The man who at least is not fair in his intention is simply ignorant; he has missed the fundamental law of all exchange; he is impossible; he will lose surely and certainly; he may not know it; he may think he is winning, but he is doomed to certain defeat. He cannot cheat the Infinite. The law of compensation will demand of him an eye for an eye and a tooth for a tooth.", "4. The forces of life are volatile; they are composed of our thoughts and ideals and these in turn are molded into form; our problem is to keep an open mind, to constantly reach out for the new, to recognize opportunity, to be interested in the race rather than the goal, for the pleasure is in the pursuit rather than the possession.", "5. You can make a money magnet of yourself, but to do so you must first consider how you can make money for other people. If you have the necessary insight to perceive and utilize opportunities and favorable conditions and recognize values, you can put yourself in position to take advantage of them, but your greatest success will come as you are enabled to assist others. What benefits one must benefit all.", "6. A generous thought is filled with strength and vitality, a selfish thought contains the germs of dissolution; it will disintegrate and pass away. Great financiers are simply channels for the distribution of wealth; enormous amounts come and go, but it would be as dangerous to stop the outgo as the income; both ends must remain open; and so our greatest success will come as we recognize that it is just as essential to give as to get.", "7. If we recognize the Omnipotent power that is the source of all supply we will adjust our consciousness to this supply in such a way that it will constantly attract all that is necessary to itself and we shall find that the more we give the more we get. Giving in this sense implies service. The banker gives his money, the merchant gives his goods, the author gives his thought, the workman gives his skill; all have something to give, but the more they can give, the more they get, and the more they get the more they are enabled to give.", "8. The financier gets much because he gives much; he thinks; he is seldom a man that lets anyone else do his thinking for him; he wants to know how results are to be secured; you must show him; when you can do this he will furnish the means by which hundreds or thousands may profit, and in proportion as they are successful will he be successful. Morgan, Rockefeller, Carnegie and others did not get rich because they lost money for other people; on the contrary, it is because they made money for other people that they became the wealthiest men in the wealthiest country on the globe.", "9. The average person is entirely innocent of any deep thinking; he accepts the ideas of others, and repeats them, in very much the same way as a parrot; this is readily seen when we understand the method which is used to form public opinion, and this docile attitude on the part of a large majority who seem perfectly willing to let a few persons do all their thinking for them is what enables a few men in a great many countries to usurp all the avenues of power and hold the millions in subjection. Creative thinking requires attention.", "10. The power of attention is called concentration; this power is directed by the will; for this reason we must refuse to concentrate or think of anything except the things we desire. Many are constantly concentrating upon sorrow, loss and discord of every kind; as thought is creative it necessarily follows that this concentration inevitable leads to more loss, more sorrow and more discord. How could it be otherwise? On the other hand, when we meet with success, gain, or any other desirable condition, we naturally concentrate upon the effects of these things and thereby create more, and so it follows that much leads to more.", "11. How an understanding of this principle can be utilized in the business world is well told by an associate of mine:", "12. “Spirit, whatever else it may or may not be, must be considered as the Essence of Consciousness, the Substance of Mind, the reality underlying Thought. And as all ideas are phases of the activity of Consciousness, Mind or Thought, it follows that in Spirit, and in it alone, is to be found the Ultimate Fact, the Real Thing, or Idea.”", "13. This being admitted, does it not seem reasonable to hold that a true understanding of Spirit, and its laws of manifestation, would be about the most “practical” thing that a “practical” person can hope to find? Does it not seem certain that if the “practical” men of the world could but realize this fact, they would “fall all over themselves” in getting to the place in which they might obtain such knowledge of spiritual things and laws? These men are not fools; they need only to grasp this fundamental fact in order to move in the direction of that which is the essence of all achievement.", "14. Let me give you a concrete example. I know a man in Chicago whom I had always considered to be quite materialistic. He had made several successes in life; and also several failures. The last time I had a talk with him he was practically “down and out,” as compared with his former business condition. It looked as if he had indeed reached “the end of his rope,” for he was well advanced into the stage of middle-age, and new ideas came more slowly, and less frequently to him than in former years.", "15. He said to me, in substance: “I know that all things that “work out” in business are the result of Thought; any fool knows that. Just now, I seem to be short on thoughts and good ideas. But, if this “All-Mind” teaching is correct, it should be possible for the individual to attain a ‘direct connection’ with Infinite Mind; and in Infinite Mind there must be the possibility of all kinds of good ideas which a man of my courage and experience could put to practical use in the business world, and make a big success thereof. It looks good to me; and I am going to look into it.”", "16. This was several years ago. The other day I heard of this man again. Talking to a friend, I said: “What has come of our old friend X? Has he ever gotten on his feet again?” The friend looked at me in amazement. “Why,” said he, “don’t you know about X’s great success? He is the Big Man in the ‘_____ Company’ (naming a concern which has made a phenomenal success during the last eighteen months and is now well known, by reason of its advertisements, from one end of the country to another, and also abroad). He is the man who supplied the BIG IDEA for that concern. Why, he is about a half-million to the good and is moving rapidly toward the million mark; all in the space of eighteen months.” I had not connected this man with the enterprise mentioned; although I knew of the wonderful success of the company in question. Investigation has shown that the story is true, and that the above stated facts are not exaggerated in the slightest.", "17. Now, what do you think of that? To me, it means that this man actually made the “direct connection” with Infinite Mind—Spirit—and, having found it, he set it to work for him. He “used it in his business.”", "18. Does this sound sacrilegious or blasphemous? I hope not; I do not mean it to be so. Take away the implication of Personality, or Magnified Human Nature, from the conception of the “The Infinite,” and you have left the conception of an Infinite Presence-Power, the Quintessence of which is Consciousness—in fact, at the last, Spirit. As this man, also, at the last, must be considered as a manifestation of Spirit; there is nothing sacrilegious in the idea that he, being Spirit, should so harmonize himself with his Origin and Source that he would be able to manifest at least a minor degree of its Power. All of us do this, more or less, when we use our minds in the direction of Creative Thought. This man did more, he went about it in an intensely “practical” manner.", "19. I have not consulted him about his method of procedure, though I intend doing so at the first opportunity, but, he not only drew upon the Infinite Supply for the ideas which he needed (and which formed the seed of his success), but that he also used the Creative Power of Thought in building up for himself an Idealistic Pattern of that which he hoped to manifest in material form, adding thereto, changing, improving its detail, from time to time—proceeding from the general outline to the finished detail. I judge this to be the facts of the case, not alone from my recollection of the conversation a few years ago, but also because I have found the same thing to be true in the cases of other prominent men who have made similar manifestation of Creative Thought.", "20. Those who may shrink from this idea of employing the Infinite Power to aid one in his work in the material world, should remember that if the Infinite objected in the least to such a procedure the thing could never happen. The Infinite is quite able to take care of itself.", "21. “Spirituality” is quite “practical,” very “practical,” intensely “practical.” It teaches that Spirit is the Real Thing, the Whole Thing, and that Matter is but plastic stuff, which Spirit is able to create, mould, manipulate, and fashion to its will. Spirituality is the most “practical” thing in the world—the only really and absolutely “practical” thing that there is!", "22. This week concentrate on the fact that man is not a body with a spirit, but a spirit with a body, and that it is for this reason that his desires are incapable of any permanent satisfaction in anything not spiritual. Money is therefore of no value except to bring about the conditions which we desire, and these conditions are necessarily harmonious. Harmonious conditions necessitate sufficient supply, so that if there appears to be any lack, we should realize that the idea or soul of money is service, and as this thought takes form, channels of supply will be opened, and you will have the satisfaction of knowing that spiritual methods are entirely practical.", "We have discovered that premeditated, orderly thinking for a purpose matures that purpose into fixed form, so that we may be absolutely sure of the result of our dynamic experiment.", "Francis Larimer Warner"], "qa": [{"q": "What is the first law of success?", "a": "Service."}, {"q": "How may we be of the most service?", "a": "Have an open mind; be interested in the race rather than the goal, in the pursuit rather than possession."}, {"q": "What is the result of a selfish thought?", "a": "It contains the germs of dissolution."}, {"q": "How will our greatest success be achieved?", "a": "By a recognition of the fact that it is just as essential to give as to receive."}, {"q": "Why do financiers frequently meet with great success?", "a": "Because they do their own thinking."}, {"q": "Why do the great majority in every country remain the docile and apparently willing tools of the few?", "a": "Because they let the few do all their thinking for them."}, {"q": "What is the effect of concentrating upon sorrow and loss?", "a": "More sorrow and more loss."}, {"q": "What is the effect of concentrating upon gain?", "a": "More gain."}, {"q": "Is this principle used in the business world?", "a": "It is the only principle which is ever used, or ever can be used; there is no other principle. The fact that it may be used unconsciously does not alter the situation."}, {"q": "What is the practical application of this principle?", "a": "The fact that success is an effect, not a cause, and if we wish to secure the effect we must ascertain the cause, or idea or thought by which the effect is created."}]}, {"id": "mkp-24", "title": "Part Twenty-Four", "n": 24, "letter": ["Nurture your mind with great thoughts; to believe in the heroic makes heroes.", "Disraeli", "Enclosed you will find Part Twenty-four, your final lesson of this course.", "If you have practiced each of the exercises a few minutes every day, as suggested, you will have found that you can get out of life exactly what you wish by first putting into life that which you wish, and you will probably agree with the student who said: “The thought is almost overwhelming, so vast, so available, so definite, so reasonable and so usable.”", "The fruit of this knowledge is, as it were, a gift of the Gods; it is the “truth” that makes men free, not only free from every lack and limitation, but free from sorrow, worry and care, and, is it not wonderful to realize that this law is no respecter of persons, that it makes no difference what your habit of thought may be, the way has been prepared.", "If you are inclined to be religious, the greatest religious teacher the world has ever known made the way so plain that all may follow. If your mental bias is toward physical science, the law will operate with mathematical certainty. If you are inclined to be philosophical, Plato or Emerson may be your teacher, but in either case, you may reach degrees of power to which it is impossible to assign any limit.", "An understanding of this principle, I believe, is the secret for which the ancient Alchemists vainly sought, because it explains how gold in the mind may be transmuted into gold in the heart and in the hand."], "body": ["1. When the scientists first put the Sun in the center of the Solar System and sent the earth spinning around it, there was immense surprise and consternation. The whole idea was self-evidently false; nothing was more certain than the movement of the Sun across the sky, and anyone could see it descend behind the western hills and sink into the sea; scholars raged and scientists rejected the idea as absurd, yet the evidence has finally carried conviction in the minds of all.", "2. We speak of a bell as a “sounding body,” yet we know that all the bell can do is to produce vibrations in the air. When these vibrations come at the rate of sixteen per second, they cause a sound to be heard in the mind. It is also possible for the mind to hear vibrations up to the rate of 38,000 vibrations per second. When the number increases beyond this, all is silence again; so that we know that the sound is not in the bell, it is in our own mind.", "3. We speak and even think of the Sun as “giving light.” Yet we know it is simply giving forth energy which produces vibrations in the ether at the rate of four hundred trillion a second, causing what are termed light waves, so that we know that we call light is simply a form of energy and that the only light there is, is the sensation caused in the mind by the motion of the waves. When the number increases, the light changes in color, each change in color being caused by shorter and more rapid vibrations; so that although we speak of the rose as being red, the grass as being green, or the sky as being blue, we know that the colors exist only in our minds, and are the sensations experienced by us as the result of the vibrations of light waves. When the vibrations are reduced below four hundred trillion a second, they no longer affect us as light, but we experience the sensation of heat. It is evident, therefore, that we cannot depend upon the evidence of the senses for our information concerning the realities of things; if we did we should believe that the sun moved, that the world was flat instead of round, that the stars were bits of light instead of vast suns.", "4. The whole range then of the theory and practice of any system of metaphysics consists in knowing the Truth concerning yourself and the world in which you live; in knowing that in order to express harmony, you must think harmony; in order to express health you must think health; and in order to express abundance you must think abundance; to do this you must reverse the evidence of the senses.", "5. When you come to know that every form of disease, sickness, lack and limitation are simply the result of wrong thinking, you will have come to know “the Truth which shall make you free.” You will see how mountains may be removed. If these mountains consist only of doubt, fear, distrust or other forms of discouragement, they are none the less real, and they need not only to be removed but to be “cast into the sea.”", "6. Your real work consists in convincing yourself of the truth of these statements. When you have succeeded in doing this you will have no difficulty in thinking the truth, and as has been shown, the truth contains a vital principle and will manifest itself.", "7. Those who heal diseases by mental methods have come to know this truth, they demonstrate it in their lives and the lives of others daily. They know that life, health and abundance are Omnipresent, filling all space, and they know that those who allow disease or lack of any kind to manifest, have as yet not come into an understanding of this great law.", "8. As all conditions are thought creations and therefore entirely mental, disease and lack are simply mental conditions in which the person fails to perceive the truth; as soon as the error is removed, the condition is removed.", "9. The method for removing this error is to go into the Silence and know the Truth; as all mind is one mind, you can do this for yourself or anyone else. If you have learned to form mental images of the conditions desired, this will be the easiest and quickest way to secure results; if not, results can be accomplished by argument, by the process of convincing yourself absolutely of the truth of your statement.", "10. Remember, and this is one of the most difficult as well as most wonderful statements to grasp… remember that no matter what the difficulty is, no matter where it is, no matter who is affected, you have no patient but yourself; you have nothing to do but to convince yourself of the truth which you desire to see manifested.", "11. This is an exact scientific statement in accordance with every system of Metaphysics in existence, and no permanent results are ever secured in any other way.", "12. Every form of concentration, forming Mental Images, Argument, and Autosuggestion are all simply methods by which you are enabled to realize the Truth.", "13. If you desire to help someone, to destroy some form of lack, limitation or error, the correct method is not to think of the person whom you wish to help; the intention to help them is entirely sufficient, as this puts you in mental touch with the person. Then drive out of your own mind any belief of lack, limitation, disease, danger, difficulty or whatever the trouble might be. As soon as you have succeeded is doing this the result will have been accomplished, and the person will be free.", "14. But remember that thought is creative and consequently every time you allow your thought to rest on any inharmonious condition, you must realize that such conditions are apparent only, they have no reality, that spirit is the only reality and it can never be less than perfect.", "15. All thought is a form of energy, a rate of vibration, but a thought of the Truth is the highest rate of vibration known and consequently destroys every form of error in exactly the same way that light destroys darkness; no form of error can exist when the “Truth” appears, so that your entire mental work consists in coming into an understanding of the Truth. This will enable you to overcome every form of lack, limitation or disease of any kind.", "16. We can get no understanding of the truth from the world without; the world without is relative only; Truth is absolute. We must therefore find it in the “world within.”", "17. To train the mind to see Truth only is to express true conditions only, our ability to do this will be an indication as to the progress we are making.", "18. The absolute truth is that the “I” is perfect and complete; the real “I” is spiritual and can therefore never be less than perfect; it can never have any lack, limitation, or disease. The flash of genius does not have origin in the molecular motion of the brain; it is inspired by the ego, the spiritual “I” which is one with the Universal Mind, and it is our ability to recognize this Unity which is the cause of all inspiration, all genius. These results are far reaching and have effect upon generations yet to come; they are the pillars of fire which mark the path that millions follow.", "19. Truth is not the result of logical training or of experimentation, or even of observation; it is the product of a developed consciousness. Truth within a Caesar, manifests in a Caesar’s deportment, in his life and his action; his influence upon social forms and progress. Your life and your actions and your influence in the world will depend upon the degree of truth which you are enabled to perceive, for truth will not manifest in creeds, but in conduct.", "20. Truth manifests in character, and the character of a man, should be the interpretation of his religion, or what to him is truth, and this will in turn be evidenced in the character of his possession. If a man complains of the drift of his fortune he is just as unjust to himself as if he should deny rational truth, though it stand patent and irrefutable.", "21. Our environment and the innumerable circumstances and accidents of our lives already exist in the subconscious personality which attracts to itself the mental and physical material which is congenial to its nature. Thus our future being determined from our present, and if there should be apparent injustice in any feature or phase of our personal life, we must look within for the cause, try to discover the mental fact which is responsible for the outward manifestation.", "22. It is this truth which makes you “free” and it is the conscious knowledge of this truth which will enable you to overcome every difficulty.", "23. The conditions with which you meet in the world without are invariably the result of the conditions obtaining in the world within, therefore it follows with scientific accuracy that by holding the perfect ideal in mind you can bring about ideal conditions in your environment.", "24. If you see only the incomplete, the imperfect, the relative, the limited, these conditions will manifest in your life; but if you train your mind to see and realize the spiritual ego, the “I” which is forever perfect and complete, harmonious; wholesome, and healthful conditions only will be manifested.", "25. As thought is creative, and the truth is the highest and most perfect thought which anyone can think, it is self-evident that to think the truth is to create that which is true and it is again evident that when truth comes into being that which is false must cease to be.", "26. The Universal Mind is the totality of all mind which is in existence. Spirit is Mind, because spirit is intelligent. The words are, therefore, synonymous.", "27. The difficulty with which you have to contend is to realize that mind is not individual. It is omnipresent. It exists everywhere. In other words, there is no place where it is not. It is, therefore, Universal.", "28. Men have, heretofore, generally used the word “God” to indicate this Universal, creative principle; but the word “God” does not convey the right meaning. Most people understand this word to mean something outside of themselves; while exactly the contrary is the fact. It is our very life. Without it we would be dead. We would cease to exist. The minute the spirit leaves the body, we are as nothing. Therefore, spirit is really, all there is of us.", "29. Now, the only activity which the spirit possesses is the power to think. Therefore, thought must be creative, because spirit is creative. This creative power is impersonal and your ability to think is your ability to control it and make use of it for the benefit of yourself and others.", "30. When the truth of this statement is realized, understood, and appreciated, you will have come into possession of the Master-Key, but remember that only those who are wise enough to understand, broad enough to weigh the evidence, firm enough to follow their own judgment, and strong enough to make the sacrifice exacted, may enter and partake.", "31. This week, try to realize that this is truly a wonderful world in which we live, that you are a wonderful being that many are awakening to a knowledge of the Truth, and as fast as they awake and come into a knowledge of the “things which have been prepared for them” they, too, realize that “Eye hath not seen, nor ear heard, neither hath it entered into the heart of man,” the splendors which exist for those who find themselves in the Promised Land. They have crossed the river of judgment and have arrived at the point of discrimination between the true and the false, and have found that all they ever willed or dreamed, was but a faint concept of the dazzling reality.", "Though an inheritance of acres may be bequeathed, an inheritance of knowledge and wisdom cannot. The wealthy man may pay others for doing his work for him, but it is impossible to get his thinking done for him by another or to purchase any kind of self-culture.", "S. Smiles"], "qa": [{"q": "Upon what principle does the theory and practice of every system of Metaphysics in existence depend?", "a": "Upon a knowledge of the “Truth” concerning yourself and the world in which you life."}, {"q": "What is the “Truth” concerning yourself?", "a": "The real “I” or ego is spiritual and can therefore never be less than perfect."}, {"q": "What is the method of destroying any form of error?", "a": "To absolutely convince yourself of the “Truth” concerning the condition which you wish to see manifested."}, {"q": "Can we do this for others?", "a": "The Universal Mind in which “we live and move and have our being” is one and indivisible, it is therefore just as possible to help others as to help ourselves."}, {"q": "What is the Universal Mind?", "a": "The totality of all mind in existence."}, {"q": "Where is the Universal Mind?", "a": "The Universal Mind is omnipresent, it exists everywhere. There is no place where it is not. It is therefore within us. It is “The World within.” It is our spirit, our life."}, {"q": "What is the nature of the Universal Mind?", "a": "It is spiritual and consequently creative. It seeks to express itself in form."}, {"q": "How may we act on the Universal Mind?", "a": "Our ability to think is our ability to act on the Universal Mind and bring it into manifestation for the benefit of ourselves or others."}, {"q": "What is meant by thinking?", "a": "Clear, decisive, calm, deliberate, sustained thought with a definite end in view."}, {"q": "What will be the result?", "a": "You will also be able to say, “It is not I that doeth the works, but the ‘Father’ that dwelleth within me, He doeth the works.” You will come to know that the “Father” is the Universal Mind and that He does really and truly dwell within you, in other words, you will come to know that the wonderful promises made in the Bible are fact, not fiction, and can be demonstrated by anyone having sufficient understanding."}]}];

/* Transurfing in 78 Days: [day, title, summary, practice]. Study notes written for this app, not the book's text. */
const T78 = [
[1, "Awakening", "Ordinary life runs like a dream that steers you. Waking up means remembering, right now, that you can notice what's happening and influence it. Awareness is where your strength comes from.", "Set three reminders today. At each one, stop and tell yourself: I'm awake, I see what's going on, and I can choose."],
[2, "Hacking the Dream", "Life is a game you were pushed into, and while you're absorbed in it you can't see it clearly. Step into the audience, look around calmly, then return to the stage and keep playing while staying the witness.", "Twice today, mentally step off the stage: name where you are, what's happening, what you're doing and why. Then carry on."],
[3, "Child of God", "Zeland describes each person as carrying a small part of God, so your intention is part of the larger creative will. Asking, begging and straining aren't needed; claim the right and shape reality with conscious intention.", "Pick one want. Instead of asking for it, state calmly that you intend to have it, as if it were simply your right."],
[4, "A Star Is Born", "Pendulums push everyone into the same rank and the same idea of success. Real success comes from walking your own path; the system then makes a new star of whoever breaks out. Be yourself and set your own rules.", "Write down one area where you're copying someone else's standard. What would your own rule be?"],
[5, "The World Mirror", "The world is like a mirror that agrees with whatever you believe about it. Expect hostility and you'll meet it; expect that good things are reserved for you and you'll often find them.", "Write one sentence describing what you think the world is like. Then rewrite it the way you'd like the mirror to answer."],
[6, "The Boomerang", "What you send into the world comes back. Hatred and irritation return as more of the same; love returns too. When you look at yourself or your life, look for what you like and pass everything through that filter.", "Today, \"peek\" instead of staring: whenever you look at yourself or your situation, find one thing you like and dwell on that."],
[7, "The Illusory Reflection", "We're like a kitten reacting to its own reflection: we react to circumstances that our own attitude helped create, and the loop repeats. Reverse it: change the image first (your thoughts and attitude), then look in the mirror.", "Catch one complaint about a situation today. Turn away from it and spend a minute picturing what you'd like to see instead."],
[8, "The Pink Twins", "Little echoes of paradise show up in everyday life: rainbows, lucky coincidences, sweet surprises. Notice them and keep them in focus. Heaven and hell are layers of this world, chosen by where your attention rests.", "Keep a list today of every small \"sun dog\": anything lovely, lucky or surprising. Aim for at least five."],
[9, "The Sigh of Relief", "Unfinished plans and self-imposed obligations drain energy. A goal energises you only when you're actually moving toward it. Either act on a plan or drop it.", "List what's weighing on you. Drop at least one item for good, and take one real step on another."],
[10, "Release", "Intention needs energy, and importance wastes it. Notice where you've inflated importance. Worry and waiting dissolve through action: hold your goal slide and quietly keep putting one foot in front of the other.", "Pick something you're anxious about. Take one small concrete step on it today instead of worrying."],
[11, "Confidence", "Insecurity comes from inflated importance. Confidence arrives when you stop needing it: with nothing to protect and nothing to prove, there's nothing to fear. Go with the flow and quietly take what's yours.", "Next time you feel unsure, ask: what am I treating as too important? Lower it a notch and carry on."],
[12, "Balance", "Excess potentials create walls that balancing forces push against. When something is hard, look for what you've overvalued or become obsessed with, and drop its importance instead of fighting the obstacle.", "Name one current obstacle. Write what you've made too important around it, then let that go."],
[13, "The Charismatic Soul", "Charisma comes from heart and mind loving each other: clearing negative slides, enjoying life, doing what you love. Free energy draws people in, and you can train it.", "Spend two minutes affirming that your energy is strong and growing and that people are drawn to you. Notice any warm responses today."],
[14, "Love Yourself", "Pendulums tell you others are better and you should copy them. That creates inner and outer importance. Accept yourself as you are, set your own standards, and let others chase you.", "Write three strengths you have. Allow yourself one shortcoming without judging it."],
[15, "I Am My Goal", "If loving yourself is hard, start by taking care of yourself: new skills, new style, small rituals. We love what we look after, and the love you send out returns.", "Do one thing today purely to take care of yourself or develop yourself."],
[16, "Faith", "Don't try to talk yourself into belief. Practise the principles, visualise your goal slide, and let results turn hope into knowledge. Failures are part of the path to success.", "Choose one small, testable intention for this week and practise toward it. Note what happens."],
[17, "Feelings of Guilt", "Guilt quietly invites punishment and manipulation. Drop it by changing the outer habit: stop justifying yourself and explain only when necessary. The inner feeling follows.", "Today, notice every time you apologise or justify yourself. Drop the ones that aren't needed."],
[18, "Self-worth", "Trying to prove your worth makes it shrink; letting go of the effort makes it appear. Also make it a rule never to bruise someone else's sense of worth.", "Go through one conversation today without trying to impress anyone, and without putting anyone down."],
[19, "The Master's Credo", "Be yourself and live by your own credo. When your thoughts and actions match, heart and mind unite and the image in the mirror isn't distorted.", "Write your credo in three short lines: what you stand for and how you choose to live."],
[20, "Your True Path", "A path with heart feels calm and right; a path without it brings unease even when everything looks fine. Follow what your soul enjoys, but act prudently: don't burn bridges while the world catches up.", "Picture two options in front of you. Notice which feels light and which feels heavy."],
[21, "The Master's Verdict", "Others have always told you what's right. Claim the right to decide for yourself, as long as you harm no one. The verdict has power only when heart and mind agree and you hold it without doubt.", "Make one decision today on your own judgement, without polling anyone, and stand by it calmly."],
[22, "Declaring Intention", "Don't let the thought mixer run you. Let thoughts wander if you like, but knowingly. Several times a day, state your intention or affirmations deliberately to set your course.", "Write a short affirmation for your main goal and repeat it at a fixed time today, like after a shower."],
[23, "Resolve to Act", "When you need something, skip the anxious analysis (\"is it possible?\") and go and get it with calm confidence, as if collecting a parcel already addressed to you.", "Next time you need something small (a seat, a parking spot, a reply), go for it with quiet certainty, no deliberating."],
[24, "Resolve to Have", "With no doubt, desire or fear, just quiet readiness to have, the impossible becomes possible. Accept the possibility of failure, picture the goal already done, and simply be willing to receive it.", "Hold your goal in mind for two minutes as already done. Let go of wanting it; just be ready to have it."],
[25, "World Cleanup", "Tidying your space restores energy and joy. Clear your mind the same way: fear, doubt, resentment, guilt and dissatisfaction are clutter in your personal world.", "Clear one drawer, shelf or corner today. Then write down one negative thought habit you'll throw out too."],
[26, "Wave of Success", "Remember and cherish the feeling of celebration. Notice each sign of things getting better, shut the door on bad news, and be grateful for what you have now. Feeling good becomes a habit that keeps you on the wave.", "Write down three good things from today, however small, and one thing you're grateful for."],
[27, "Chasing the Reflection", "Trying to fix the reflection directly is like grabbing at a mirror. Change the image instead: clear out \"not\" thoughts (dislike, rejection, disbelief) and focus on what you want. The mirror lags, so hold the image steadily without looking back.", "List your \"not\" thoughts from today: I don't want, I can't stand, it won't work. Rewrite each as what you do want."],
[28, "Creating an Image", "A thought form takes root only when repeated systematically over time. It's ordinary, patient work, not magic. When heart and mind disagree the image blurs, so keep visualising the slide regularly, like a long siege.", "Set a fixed daily time for your goal slide, even five minutes, and do it today."],
[29, "World, Give Yourself to Me!", "Demanding from the world just reflects demanding back. Take the first step: replace the intention to receive with the intention to give, and what you let go of comes to you.", "Think of something you want from someone. Give them a version of it first: respect, care, warmth or help."],
[30, "Here World, Have Me!", "People are absorbed in what they want from others. Shift attention to what the other person wants, above all their sense of self-worth, and help them get it; they'll gladly help you in return.", "In your next conversation, ask yourself: what does this person want? Talk about their interests, not yours."],
[31, "The Oyster Effect", "We react loudly to bad things and shrug at good ones, out of habit. Instead, choose the colours of your reality on purpose. What you think about matters more than how you feel about it, so take charge of the content of your thoughts.", "Each time something good happens today, pause and acknowledge it out loud or in writing, as fully as you'd complain."],
