  practice: `${MK_SIT} After a few minutes of stillness, relax completely. Let go of every muscle on purpose: face, jaw, shoulders, hands, belly. Notice where you hold tension and release it.`,
  quiz: [
    { q: "What does Haanel call the solar plexus?", o: ["The gatekeeper", "The sun of the body", "The master key", "The mental home"], a: 1, e: "It radiates energy outward, like a sun." },
    { q: "What closes it down?", o: ["Relaxation", "Fear and tension", "Sleep", "Concentration"], a: 1, e: "Fear contracts it and stops the flow of energy." }],
  reflect: "Where in your body do you hold fear? What happens when you consciously let it go?" },
{ id: "mk-04", part: "mk1", title: "The \"I\"", sub: "You are not your body or your moods",
  body: [
`This part asks who is doing the thinking. Haanel's answer: the "I" is not the body, which is an instrument, and not the passing thoughts and moods either. It is the spiritual self that uses body and mind and can direct them.`,
`Knowing this gives you leverage. If you are not your anger or your worry, you can set them down. Haanel ties this to will: the "I" can decide what to think, and thought combined with feeling is what makes things happen.`],
  keys: ["The body is an instrument, not the self.", "Thoughts and moods pass; the \"I\" remains.", "The \"I\" can direct thought by will.", "Thought plus feeling is creative."],
  practice: `${MK_SIT} Be still, quiet the mind and relax the body as before. Then let go of negative feeling: any anger, worry, jealousy, envy, sorrow or disappointment. Watch each one, recognise it isn't you, and release it.`,
  quiz: [
    { q: "According to this part, what is the \"I\"?", o: ["The physical body", "Your strongest emotion", "The spiritual self that directs body and mind", "Your reputation"], a: 2, e: "The body and mind are its instruments." },
    { q: "What does this week's exercise ask you to let go of?", o: ["Your goals", "Negative emotions like worry, anger and envy", "Your breath", "Your list"], a: 1, e: "Having learned stillness and relaxation, you now release negative feeling." }],
  reflect: "Which mood do you most often mistake for yourself?" },
{ id: "mk-05", part: "mk1", title: "The mental home", sub: "You build it, thought by thought",
  body: [
`Haanel says most of our mental life runs below awareness, shaped by heredity, upbringing and surroundings. We live in a "mental home" we mostly didn't choose. The good news: it was built by thought, and it can be rebuilt the same way.`,
`He compares it to an inheritance waiting to be claimed. The materials are your thoughts; the builder is attention. Each day you add something, so add deliberately: better habits of thought, better pictures, better company for your mind.`],
  keys: ["Much of your mental life is inherited or absorbed.", "Your mental home was built by thought.", "It can be rebuilt by deliberate thinking.", "Claim your inheritance: the power to choose thought."],
  practice: `${MK_SIT} Relax as before, then mentally choose a place with pleasant associations and build a complete picture of it: the buildings, the grounds, the trees, friends, everything. Your mind will wander to everything except this; keep bringing it back. Persistence wins, so practise every day.`,
  quiz: [
    { q: "What builds the \"mental home\"?", o: ["Money", "Thought", "Luck", "Other people"], a: 1, e: "It was built by thought and can be rebuilt by thought." },
    { q: "What shapes much of it before we choose?", o: ["Heredity and environment", "The solar plexus", "Visualisation", "Concentration"], a: 0, e: "We absorb much of our mental life before we can choose." }],
  reflect: "Which room of your mental home would you rebuild first?" },
{ id: "mk-06", part: "mk1", title: "Attention", sub: "The brain as an instrument, concentration as the skill",
  body: [
`The brain, Haanel says, is a remarkable instrument, and attention is how you use it. Scattered attention gets scattered results. Concentrated attention is the difference between an ordinary mind and a powerful one.`,
`Concentration is not strain. It is steady interest held on one object long enough for the mind to work on it. Like any skill, it grows with daily practice, which is what this week's exercise trains.`],
  keys: ["Attention is how you direct the mind.", "Concentration is the key mental skill.", "Concentration is steady interest, not strain.", "It improves with daily practice."],
  practice: `${MK_SIT} Take a photograph of a friend. Study it closely: expression, eyes, clothes, background. Then put it away and recreate it in your mind in full detail. Repeat until the image is clear.`,
  quiz: [
    { q: "What does Haanel call the key to using the brain well?", o: ["Speed", "Attention or concentration", "Memory tricks", "Sleep"], a: 1, e: "Concentrated attention turns the brain into a powerful instrument." },
    { q: "What is this week's exercise object?", o: ["A battleship", "A photograph of a friend", "A circle", "A flower"], a: 1, e: "You study the photo, then recreate it mentally." }],
  reflect: "Where does your attention leak during the day?" },
{ id: "mk-07", part: "mk2", title: "Visualisation", sub: "Idealisation, visualisation, materialisation",
  body: [
`Haanel describes creation in three steps. Idealisation: decide clearly what you want. Visualisation: see it in your mind, in detail, steadily, as an architect sees a building before it exists. Materialisation: the plan begins to take outward form.`,
`The picture must be clear and held steadily. A vague or changing picture produces vague results. Build it a little at a time, adding detail each day, and trust the process instead of forcing it.`],
  keys: ["Idealise: decide what you want.", "Visualise: see it clearly, like an architect's plan.", "Materialise: it takes form over time.", "Clarity and steadiness matter more than effort."],
  practice: `${MK_SIT} Visualise a friend exactly as you last saw them: the room, the furniture, the conversation. See their face distinctly. Talk with them about something you share and watch their expression change; tell them a story and see their eyes light up.`,
  quiz: [
    { q: "What are Haanel's three steps of creation?", o: ["Wish, wait, receive", "Idealisation, visualisation, materialisation", "Plan, work, rest", "Ask, tell, give"], a: 1, e: "Decide, picture, then let it take form." },
    { q: "What analogy does he use for visualisation?", o: ["A gardener", "An architect's plan", "A ship's captain", "A sculptor's clay"], a: 1, e: "The architect sees the building before it is built." }],
  reflect: "What would you build if you planned it as carefully as an architect?" },
{ id: "mk-08", part: "mk2", title: "Imagination", sub: "Constructive imagination and the battleship",
  body: [
`Imagination, for Haanel, is the workshop of the mind. Daydreaming wastes it; constructive imagination uses it to form plans and see connections. It can be trained, and the training makes thought more vivid and more effective.`,
`This week's exercise is his famous battleship: picture a warship in detail, then trace it back through everything that made it possible, down to the ore in the ground and the thought of whoever conceived it. Every great thing began as an idea.`],
  keys: ["Imagination is the mind's workshop.", "Constructive imagination plans; daydreaming drifts.", "Every made thing began as a thought.", "Imagination grows with exercise."],
  practice: `${MK_SIT} Picture a battleship: its size, steel, guns, crew. Then trace it back: the shipyard, the steel mill, the mine, the ore, the engineers, the first idea. Follow the chain as far as you can.`,
  quiz: [
    { q: "What is the battleship exercise meant to show?", o: ["That ships are big", "That every made thing traces back to thought", "How to join the navy", "That steel is strong"], a: 1, e: "You follow the ship back to its origin in an idea." },
    { q: "Constructive imagination differs from daydreaming because it…", o: ["Is more fun", "Forms plans and connections with purpose", "Happens at night", "Avoids details"], a: 1, e: "It's directed toward building something." }],
  reflect: "Trace one object near you back to the thought that started it." },
{ id: "mk-09", part: "mk2", title: "Affirmation and truth", sub: "\"I am whole, perfect, strong…\"",
  body: [
`Haanel argues that the truth about you is that you are whole and capable, and that thinking in line with that truth is what produces health and harmony. He offers an affirmation to hold: "I am whole, perfect, strong, powerful, loving, harmonious and happy."`,
`The affirmation is meant to be understood, not just repeated. Hold each word in mind until you feel what it means. Its job is to replace habits of thinking that contradict it.`],
  keys: ["Think in line with the truth of your wholeness.", "The affirmation: whole, perfect, strong, powerful, loving, harmonious, happy.", "Understand it; don't just repeat it.", "It replaces contradicting habits of thought."],
  practice: `${MK_SIT} Picture a seed planted in soil. Watch it sprout, root, rise, leaf and flower, in detail. Then hold the affirmation for a few minutes, word by word.`,
  quiz: [
    { q: "Which is Haanel's affirmation in this part?", o: ["\"Every day in every way…\"", "\"I am whole, perfect, strong, powerful, loving, harmonious and happy\"", "\"It works\"", "\"Fortune favours the bold\""], a: 1, e: "It names the qualities he says are already true of you." },
    { q: "How should the affirmation be used?", o: ["Repeated fast", "Understood and felt, word by word", "Written once", "Said to others"], a: 1, e: "Meaning, not mechanical repetition, gives it power." }],
  reflect: "Which word of the affirmation feels least true to you right now? Why?" },
{ id: "mk-10", part: "mk2", title: "Abundance and cause", sub: "Nothing happens by chance",
  body: [
`Haanel treats abundance as natural: nature is lavish, and lack is a sign that something is blocking the flow, not a fixed law. He ties this to cause and effect: every condition has a cause, and nothing happens by chance.`,
`If you don't like an effect, look for its cause in thought and action and change that. This week's exercise trains precise mental imagery, so the causes you set in motion are clear ones.`],
  keys: ["Abundance is natural; lack signals a block.", "Every effect has a cause.", "Nothing happens by chance.", "Change effects by changing causes."],
  practice: `${MK_SIT} Pick a blank spot on the wall. Mentally draw a black horizontal line about six inches long, add two vertical lines and another horizontal to make a square, and hold it clearly. Draw a circle inside, put a point at its centre, then draw the point toward you to make a cone. Then change the colours.`,
  quiz: [
    { q: "How does Haanel view lack?", o: ["As the natural state", "As a sign the flow is blocked", "As a punishment", "As permanent"], a: 1, e: "Nature is lavish; lack means something is in the way." },
    { q: "What does he say about chance?", o: ["Most things are chance", "Nothing happens by chance; every effect has a cause", "Chance can be trained", "Only good things are chance"], a: 1, e: "Cause and effect run everywhere." }],
  reflect: "Pick one result you dislike. What cause in your thinking or action might be producing it?" },
{ id: "mk-11", part: "mk2", title: "Believe that you receive", sub: "Inductive reasoning and the prayer of faith",
  body: [
`Haanel praises inductive reasoning: observing many cases and finding the law behind them. Applied to the mind, it points to a law of supply that responds to belief.`,
`He quotes the gospel line, "whatsoever things ye desire, when ye pray, believe that ye receive them, and ye shall have them," and reads it as a statement of law: hold the thing as already yours in thought, and it tends to follow.`],
  keys: ["Inductive reasoning finds laws from observed cases.", "Belief acts on the law of supply.", "Hold the desire as already received.", "Treat it as law, not wishful thinking."],
  practice: `${MK_SIT} Concentrate on the words "Whatsoever things ye desire, when ye pray, believe that ye receive them, and ye shall have them." Consider what it would mean to hold your desire as already received.`,
  quiz: [
    { q: "What kind of reasoning does Haanel praise here?", o: ["Deductive", "Inductive", "Circular", "Emotional"], a: 1, e: "Observing cases and drawing out the law." },
    { q: "How does he read \"believe that ye receive\"?", o: ["As poetry only", "As a statement of mental law", "As a warning", "As a historical note"], a: 1, e: "He treats it as describing how the law works." }],
  reflect: "What would change in how you act today if you believed you had already received what you want?" },
{ id: "mk-12", part: "mk2", title: "Concentration and love", sub: "The law of attraction",
  body: [
`Here Haanel names the law of attraction: thought attracts its object. He adds that thought charged with feeling, especially love, is far more powerful than cold thinking.`,
`He returns to concentration as the way to use this: hold one purpose steadily, warmly and without scattering. A mind that keeps changing its object attracts nothing in particular.`],
  keys: ["Thought attracts its object.", "Feeling, especially love, strengthens thought.", "Concentration focuses the attraction.", "Scattered aims attract nothing in particular."],
  practice: `${MK_SIT} Relax completely, mentally and physically; never do mental work under pressure. Then realise your unity with omnipotence: your ability to think is your ability to act on the Universal Mind, and you have the same potential as anyone who ever lived.`,
  quiz: [
    { q: "What does the law of attraction say in this part?", o: ["Opposites attract", "Thought attracts its object", "Money attracts money", "Nothing attracts"], a: 1, e: "Held thought draws its object toward it." },
    { q: "What makes thought more powerful, according to Haanel?", o: ["Speed", "Feeling, especially love", "Volume", "Repetition alone"], a: 1, e: "Thought joined with feeling is creative." }],
  reflect: "Which of your goals do you think about coldly? How would it feel to hold it with warmth?" },
{ id: "mk-13", part: "mk3", title: "Dreamers and law", sub: "Ideals are practical",
  body: [
`Haanel defends dreamers. The people who changed the world first held a picture others called impractical. An ideal is not an escape; it's the pattern that action follows.`,
`He also argues that results that look miraculous are simply laws we don't yet understand. The point is to understand the law well enough to use it on purpose.`],
  keys: ["Ideals come before achievements.", "Great builders were first dreamers.", "\"Miracles\" are laws not yet understood.", "Understand the law to use it deliberately."],
  practice: `${MK_SIT} Relax, then recognise that you are part of the whole, and that a part must be the same in kind and quality as the whole. The only difference is one of degree.`,
  quiz: [
    { q: "How does Haanel view dreamers?", o: ["As impractical", "As the source of every advance", "As lazy", "As dangerous"], a: 1, e: "Their ideals become the patterns others follow." },
    { q: "What are results that look miraculous?", o: ["Accidents", "Laws not yet understood", "Fraud", "Rare luck"], a: 1, e: "They follow law, even when we don't see it." }],
  reflect: "What ideal have you dismissed as impractical?" },
{ id: "mk-14", part: "mk3", title: "Universal substance", sub: "Harmony with the whole",
  body: [
`Haanel describes one universal substance, which he also calls Universal Mind, present in everything. Individual mind is a point of contact with it. Through that contact, thought can act on conditions.`,
`The practical lesson is harmony. Thinking in conflict with the whole (resentment, criticism, fear) blocks the contact. Harmonious thought opens it.`],
  keys: ["One universal substance runs through everything.", "Your mind is a point of contact with it.", "Discordant thought blocks the contact.", "Harmonious thought opens it."],
  practice: `${MK_SIT} Concentrate on Harmony, so deeply and earnestly that you are conscious of nothing but harmony. Haanel is blunt here: reading the lessons gets you nowhere; the value is in practising them.`,
  quiz: [
    { q: "What is your mind, in this part's terms?", o: ["Separate from everything", "A point of contact with Universal Mind", "Only the brain", "An illusion"], a: 1, e: "Individual mind connects to the universal." },
    { q: "What blocks the connection?", o: ["Harmony", "Discordant thought like resentment and fear", "Concentration", "Rest"], a: 1, e: "Conflict closes it; harmony opens it." }],
  reflect: "Where in your life are you out of harmony? What thought keeps it that way?" },
{ id: "mk-15", part: "mk3", title: "Laws of life and insight", sub: "Difficulties, words and understanding",
  body: [
`Haanel says difficulties are part of the law of growth: they show us where we're out of line, and overcoming them builds strength. They are not punishments.`,
`He also points to the power of words. Words shape thought, so choose them with care. And he praises insight: understanding a situation from within, which lets you act correctly instead of reacting.`],
  keys: ["Difficulties show where you're out of line.", "Overcoming them builds strength.", "Words shape thought; choose them carefully.", "Insight lets you act instead of react."],
  practice: `${MK_SIT} Concentrate on Insight. Knowing that thought is creative is not the same as the art of thinking. Knowledge doesn't apply itself; habit and custom run our actions unless we make a determined effort. Stay with this until you can form a definite plan to apply what you know.`,
  quiz: [
    { q: "How does Haanel see difficulties?", o: ["As punishments", "As part of the law of growth", "As random", "As permanent"], a: 1, e: "They show where to adjust, and build strength." },
    { q: "Why choose words carefully?", o: ["To sound educated", "Because words shape thought", "To avoid arguments", "It doesn't matter"], a: 1, e: "Language moulds how you think." }],
  reflect: "What is your current biggest difficulty trying to teach you?" },
{ id: "mk-16", part: "mk3", title: "Cycles and wealth", sub: "Periodicity and the right use of money",
  body: [
`Haanel notes that life moves in cycles, often described as seven-year periods, and that knowing this helps you work with the season you're in rather than against it.`,
`He treats wealth as a means, not an end. Money is useful for what it lets you do and give. Wanting it as an end in itself tends to bring anxiety; wanting it for a worthy ideal tends to bring it.`],
  keys: ["Life moves in cycles.", "Work with your current season.", "Wealth is a means, not an end.", "A worthy ideal draws resources."],
  practice: `${MK_SIT} Bring yourself to realise that harmony and happiness are states of consciousness and don't depend on possessions. Things are effects of right mental states, so seek the mental attitude first, through realising your spiritual nature and unity with the Universal Mind.`,
  quiz: [
    { q: "How does Haanel view wealth?", o: ["As the goal", "As a means to an ideal", "As evil", "As luck"], a: 1, e: "Money serves a purpose; it isn't the purpose." },
    { q: "What does periodicity refer to?", o: ["Reading periodicals", "Life moving in cycles", "Daily routine", "Punctuation"], a: 1, e: "Life moves through recurring periods." }],
  reflect: "If money were fully taken care of, what would you do with your next seven years?" },
{ id: "mk-17", part: "mk3", title: "True concentration", sub: "Symbol and reality",
  body: [
`Haanel distinguishes the symbol from the reality: outward forms are symbols, and the reality behind them is spiritual. Chasing symbols without the reality leads nowhere.`,
`He describes real concentration as so complete that you forget yourself in the object, the way an inventor or artist does. It isn't forcing; it is absorption, and absorption is where insight and results come from.`],
  keys: ["Outer forms are symbols of inner reality.", "Seek the reality, not just the symbol.", "Real concentration is absorption, not strain.", "Self-forgetful focus brings insight."],
  practice: `${MK_SIT} Concentrate with no conscious effort and no anxiety about results. Relax completely; power comes through repose. Let your thought dwell on your object until you are identified with it and conscious of nothing else.`,
  quiz: [
    { q: "What is real concentration, in this part?", o: ["Forcing your mind", "Absorption so complete you forget yourself", "Thinking fast", "Multitasking"], a: 1, e: "It's absorption, like an inventor at work." },
    { q: "What are outer forms, according to Haanel?", o: ["The only reality", "Symbols of an inner reality", "Illusions to ignore", "Unimportant"], a: 1, e: "Forms point to the reality behind them." }],
  reflect: "When were you last so absorbed that you forgot yourself? What were you doing?" },
{ id: "mk-18", part: "mk3", title: "The law of growth", sub: "Attention, interest and the individual",
  body: [
`Everything grows or decays; nothing stays still. Haanel says growth comes from taking in from the universal what the individual needs, and that attention and interest decide what we take in.`,
`The individual is the universal expressing itself in a particular way. Your growth is that expression becoming fuller, and it depends on where you place your interest day after day.`],
  keys: ["Everything grows or decays.", "Attention and interest direct growth.", "The individual expresses the universal.", "Steady interest compounds over time."],
  practice: `${MK_SIT} Concentrate on your power to create, and look for a logical basis for your faith. As the body lives in air and must breathe, the spiritual self lives in a subtler energy it depends on. And as in nature, nothing grows until a seed is sown.`,
  quiz: [
    { q: "What directs growth, according to this part?", o: ["Luck", "Attention and interest", "Age", "Other people"], a: 1, e: "What you attend to is what you grow toward." },
    { q: "What is the individual's relation to the universal?", o: ["Separate from it", "A particular expression of it", "Opposed to it", "Unrelated"], a: 1, e: "The individual expresses the universal in a particular form." }],
  reflect: "Where has your interest been going this month? Is that where you want to grow?" },
{ id: "mk-19", part: "mk4", title: "Fear and opposites", sub: "Two ends of one thing",
  body: [
`Haanel opens with fear: a powerful form of thought that paralyses the nerve centres and affects the whole body. Then he turns to opposites. North and south, inside and outside, are names for two parts of one quantity, not separate things.`,
`The same holds in the mind: ignorance is simply the absence of knowledge, and evil the absence of good; neither has a principle of its own. Behind every pair is one operative principle, Mind. Matter is always changing; Mind is the real and lasting thing, and your thinking is how you act on it.`],
  keys: ["Fear paralyses body and mind.", "Opposites are two parts of one whole.", "Ignorance is absence of knowledge; evil is absence of good.", "Mind is the one operative principle."],
  practice: `${MK_SIT} Concentrate in the full sense of the word: become so absorbed in the object of your thought that you are conscious of nothing else. Do this a few minutes every day. You make time to feed your body; make time to digest your mental food.`,
  quiz: [
    { q: "How does Haanel see opposites?", o: ["As enemies", "As two parts of one whole", "As illusions", "As random"], a: 1, e: "\"They are not separate entities, but are two parts or aspects of the whole.\"" },
    { q: "What is ignorance, in his terms?", o: ["A force of its own", "Simply the absence of knowledge", "A punishment", "A virtue"], a: 1, e: "It has no principle in itself; it is a lack." }],
  reflect: "What fear would shrink if you brought more knowledge to it?" },
{ id: "mk-20", part: "mk4", title: "The spirit of things", sub: "Power is latent until used",
  body: [
`Haanel says the spirit of a thing is its reality. Power is everywhere, but it's latent until someone recognises it and uses it, the way electricity existed long before anyone switched on a light.`,
`He quotes "In Him we live and move and have our being," reading it as a statement that we live within the universal power and can draw on it consciously. Breathing deeply, he suggests, is a simple way to feel that connection.`],
  keys: ["The spirit of a thing is its reality.", "Power is latent until recognised and used.", "We live within the universal power.", "Conscious breathing helps you feel it."],
  practice: `${MK_SIT} Go into the Silence and concentrate on "In him we live and move and have our being" as literally true: you are because He is, and the difference between that spirit and yours is one of degree, not kind.`,
  quiz: [
    { q: "When does latent power become useful?", o: ["Never", "When it is recognised and used", "Only at night", "When others allow it"], a: 1, e: "Like electricity, it waits to be recognised." },
    { q: "Which quotation is this week's focus?", o: ["\"Know thyself\"", "\"In Him we live and move and have our being\"", "\"It works\"", "\"Carpe diem\""], a: 1, e: "Haanel reads it as describing our relation to the universal." }],
  reflect: "What power in your life is sitting unused because you haven't recognised it?" },
{ id: "mk-21", part: "mk4", title: "Think big", sub: "Consciousness of power",
  body: [
`Haanel says the real secret of power is consciousness of power. People who achieve large things think in large terms; small thinking limits what can reach you.`,
`He asks you to raise your sights: entertain big ideas, and hold them calmly. Truth, he says, is the foundation: thinking in line with truth is what makes power reliable.`],
  keys: ["The secret of power is consciousness of power.", "Large results start with large thinking.", "Small thinking limits what can reach you.", "Truth makes power reliable."],
  practice: `${MK_SIT} Concentrate on the Truth: "the truth shall make you free." Realise that nothing can permanently stand in the way of your success once you apply right thinking, and that the Silence is always available for reaching the highest conception of Truth.`,
  quiz: [
    { q: "What is the real secret of power, according to this part?", o: ["Money", "Consciousness of power", "Hard work alone", "Connections"], a: 1, e: "Awareness of power precedes its use." },
    { q: "What does small thinking do?", o: ["Keeps you safe", "Limits what can reach you", "Saves energy", "Nothing"], a: 1, e: "Large results begin with large thinking." }],
  reflect: "How would your goals look if you multiplied them by ten?" },
{ id: "mk-22", part: "mk4", title: "Thought and health", sub: "Every cell responds",
  body: [
`Haanel argues that the body is constantly renewing itself, and that thought influences how. Fear, worry and anger leave their mark; calm, confident, loving thought supports health.`,
`He doesn't ask you to ignore medicine. He asks you to stop poisoning the process with habitual negative thought, and to hold a steady picture of health.`],
  keys: ["The body renews itself constantly.", "Thought influences that renewal.", "Negative habits of thought take a toll.", "Hold a steady picture of health."],
  practice: `${MK_SIT} Concentrate on Tennyson's lines: "Speak to Him, thou, for He hears, and spirit with spirit can meet. Closer is He than breathing, and nearer than hands and feet." Then realise that when you do speak to Him, you are in touch with Omnipotence.`,
  quiz: [
    { q: "What does Haanel say influences the body's renewal?", o: ["Nothing", "Thought", "Only diet", "Only exercise"], a: 1, e: "He links habitual thought to the body's condition." },
    { q: "Which kind of thought supports health, in this part?", o: ["Worry", "Calm, confident, loving thought", "Anger", "Criticism"], a: 1, e: "Negative thought takes a toll; positive thought supports." }],
  reflect: "Which habitual thought do you suspect is costing your body the most?" },
{ id: "mk-23", part: "mk4", title: "Money and service", sub: "The law of giving",
  body: [
`Haanel says money consciousness is a state of mind, and that money follows service. The more value you give, the more naturally it returns.`,
`He describes a law of giving: to receive, give. Hoarding and fear block circulation; generosity keeps it moving. Give your best work, your attention and your help, and let the return follow.`],
  keys: ["Money consciousness is a state of mind.", "Money follows service.", "To receive, give.", "Hoarding blocks the flow; giving keeps it moving."],
  practice: `${MK_SIT} Concentrate on the fact that you are not a body with a spirit but a spirit with a body, so nothing that isn't spiritual can satisfy you permanently. Money matters only for the harmonious conditions it brings; if you see lack, remember that the soul of money is service.`,
  quiz: [
    { q: "What does money follow, according to Haanel?", o: ["Luck", "Service", "Hoarding", "Inheritance"], a: 1, e: "The more value given, the more returns." },
    { q: "What blocks the flow?", o: ["Generosity", "Hoarding and fear", "Service", "Gratitude"], a: 1, e: "Circulation requires giving." }],
  reflect: "Where could you give more value this month?" },
{ id: "mk-24", part: "mk4", title: "The master key", sub: "Knowing the truth about yourself and the world",
  body: [
`Haanel's last part starts with the sun. We say it rises and gives light, yet the earth turns and the sun only sends out vibrations. The senses mislead; truth has to be reasoned out. The same goes for your life.`,
`The whole system, he says, comes down to knowing the truth about yourself and your world: to express harmony, think harmony; to express health, think health. Your real work is convincing yourself of this. Whatever the difficulty, \"you have no patient but yourself.\" Knowledge is only valuable when applied.`],
  keys: ["The senses can mislead; truth must be reasoned out.", "To express harmony, think harmony.", "Your real work is convincing yourself of the truth.", "You have no patient but yourself."],

const MK_TEXT = [{"id": "mk-intro", "title": "Introduction", "letter": [], "body": ["Nature compels us all to move through life. We could not remain stationary however much we wished. Every right-thinking person wants not merely to move through life like a sound-producing, perambulating plant, but to develop - to improve - and to continue the development mentally to the close of physical life.", "This development can occur only through the improvement of the quality of individual thought and the ideals, actions and conditions that arise as a consequence. Hence a study of the creative processes of thought and how to apply them is of supreme importance to each one of us. This knowledge is the means whereby the evolution of human life on earth may be hastened and uplifted in the process.", "Humanity ardently seeks “The Truth” and explores every avenue to it. In this process it has produced a special literature, which ranges the whole gamut of thought from the trivial to the sublime - up from Divination, through all the Philosophies, to the final lofty Truth of “The Master Key”.", "The “Master Key” is here given to the world as a means of tapping the great Cosmic Intelligence and attracting from it that which corresponds to the ambitions, and aspirations of each reader.", "Every thing and institution we see around us, created by human agency, had first to exist as a thought in some human mind. Thought therefore is constructive. Human thought is the spiritual power of the cosmos operating through its creature man. “The Master Key” instructs the reader how to use that power, and use it both constructively and creatively. The things and conditions we desire to become realities we must first create in thought. “The Master Key” explains and guides the process.", "“The Master Key” teaching has hitherto been published in the form of a Correspondence Course of 24 lessons, delivered to students one per week for 24 weeks. The reader, who now receives the whole 24 parts at one times, is warned not to attempt to read the book like a novel, but to treat it as a course of study and conscientiously to imbibe the meaning of each part - reading and re-reading one part only per week before proceeding to the next. Otherwise the later parts will tend to be misunderstood and the reader’s time and money will be wasted.", "Used as thus instructed “The Master Key” will make of the reader a greater, better personality, and equipped with a new power to achieve any worthy personal purpose and a new ability to enjoy life’s beauty and wonder.", "F.H. Burgess"], "qa": []}, {"id": "mk-foreword", "title": "Foreword", "letter": [], "body": ["Some men seem to attract success, power, wealth, attainment, with very little conscious effort; others conquer with great difficulty; still others fail altogether to reach their ambitions, desires and ideals. Why is this so? Why should some men realize their ambitions easily, others with difficulty, and still others not at all? The cause cannot be physical, else the most perfect men, physically, would be the most successful. The difference, therefore, must be mental - must be in the mind; hence mind must be the creative force, must constitute the sole difference between men. It is mind, therefore, which overcomes environment and every other obstacle in the path of men.", "When the creative power of thought is fully understood, its effect will be seen to be marvelous. But such results cannot be secured without proper application, diligence, and concentration. The student will find that the laws governing in the mental and spiritual world are as fixed and infallible as in the material world. To secure the desired results, then, it is necessary to know the law and to comply with it. A proper compliance with the law will be found to produce the desired result with invariable exactitude. The student who learns that power comes from within, that he is weak only because he has depended on help from outside, and who unhesitatingly throws himself on his own thought, instantly rights himself, stands erect, assumes a dominant attitude, and works miracles.", "It is evident, therefore, that he who fails to fully investigate and take advantage of the wonderful progress which is being made in this last and greatest science, will soon be as far behind as the man who would refuse to acknowledge and accept the benefits which have accrued to mankind through an understanding of the laws of electricity.", "Of course, mind creates negative conditions just as readily as favorable conditions, and when we consciously or unconsciously visualize every kind of lack, limitation and discord, we create these conditions; this is what many are unconsciously doing all the time.", "This law as well as every other law is no respecter of persons, but is in constant operation and is relentlessly bringing to each individual exactly what he has created; in other words, “Whatsoever a man soweth that shall he also reap.”", "Abundance, therefore, depends upon a recognition of the laws of Abundance, and the fact that Mind is not only the creator, but the only creator of all there is. Certainly nothing can be created, before we know that it can be created and then make the proper effort. There is no more Electricity in the world today than there was fifty years ago, but until someone recognized the law by which it could be made of service, we received no benefit; now that the law is understood, practically the whole world is lit by it. So with the law of Abundance; it is only those who recognize the law and place themselves in harmony with it, who share in its benefits.", "The scientific spirit now dominates every field of effort, relations of cause and effect are no longer ignored.", "The discovery of a region of law marked an epoch in human progress. It eliminated the element of uncertainty and caprice in men’s lives, and substituted law, reason and certitude.", "Men now understand that for every result there is an adequate and definite cause, so that when a given result is desired, they seek the condition by which alone this result may be attained.", "The basis upon which all law rests was discovered by inductive reasoning which consists of comparing a number of separate instances with one another until the common factor which gives rise to them all is seen.", "It is this method of study to which the civilized nations owe the greater part of their prosperity and the more valuable part of their knowledge; it has lengthened life, it has mitigated pain, it has spanned rivers, it has brightened the night with the splendor of day, extended the range of vision, accelerated motion, annihilated distance, facilitated intercourse, and enabled men to descend into the sea, and into the air. What wonder then that men soon endeavored to extend the blessings of this system of study to their method of thinking, so that when it became plainly evident that certain results followed a particular method of thinking it only remained to classify these results.", "This method is scientific, and it is the only method by which we shall be permitted retain that degree of liberty and freedom which we have been accustomed to look upon as an inalienable right, because a people is safe at home and in the world only if national preparedness mean such things as growing surplus of health, accumulated efficiency in public and private business of whatever sort, continuous advance in the science and art of acting together, and the increasingly dominant endeavor to make all of these and all other aspects of national development center and revolve about ascending life, single and collective, for which science, art and ethics furnish guidance and controlling motives.", "The Master Key is based on absolute scientific truth and will unfold the possibilities that lie dormant in the individual, and teach how they may be brought into powerful action, to increase the person’s effective capacity, bringing added energy, discernment, vigor and mental elasticity. The student who gains an understanding of the mental laws which are unfolded will come into the possession of an ability to secure results hitherto undreamed of, and which has rewards hardly to be expressed in words.", "It explains the correct use of both the receptive and active elements of the mental nature, and instructs the student in the recognition of opportunity; it strengthens the will and reasoning powers, and teaches the cultivation and best uses of imagination, desire, the emotions and the intuitional faculty. It gives initiative, tenacity of purpose, wisdom of choice, intelligent sympathy and a thorough enjoyment of life on its higher planes.", "The Master Key teaches the use of Mind Power, true Mind Power, not any of the substitutes and perversions; it has nothing to do with Hypnotism, Magic or any of the more or less fascinating deceptions by which many are led to think that something can be had for nothing.", "The Master Key cultivates and develops the understanding which will enable you to control the body and thereby the health. It improves and strengthens the Memory. It develops Insight, the kind of Insight which is so rare, the kind which is the distinguishing characteristic of every successful business man, the kind which enables men to see the possibilities as well as the difficulties in every situation, the kind which enables men to discern opportunity close at hand, for thousands fail to see opportunities almost within their grasp while they are industriously working with situations which under no possibility can be made to realize any substantial return.", "The Master Key develops Mental Power which means that others instinctively recognize that you are a person of force, of character - that they want to do what you want them to do; it means that you attract men and things to you; that you are what some people call “lucky”, that “things” come you way’ that you have come into an understanding of the fundamental laws of Nature, and have put yourself in harmony with them; that you are in tune with Infinite; that you understand the law of attraction, the Natural laws of growth, and the Psychological laws on which all advantages in the social and business world rest.", "Mental Power is creative power, it gives you the ability to create for yourself; it does not mean the ability to take something away from someone else. Nature never does things that way. Nature makes two blades for grass grow where one grew before, and Mind Power enables men to do the same thing.", "The Master Key develops insight and sagacity, increased independence, the ability and disposition to be helpful. It destroys distrust, depression, fear, melancholia, and every form of lack limitation and weakness, including pain and disease; it awakens buried talents, supplies initiative, force, energy, vitality - it awakens an appreciation of the beautiful in Art, Literature and Science.", "It has changed the lives of thousands of men and women, by substituting definite principles for uncertain and hazy methods - and principles for the foundation upon which every system of efficiency must rest.", "Elbert Gary, the chairman of the United States Steel Corporation, said “The services of advisors, instructors, efficiency experts in successful management are indispensable to most business enterprises of magnitude, but I deem the recognition and adoption of right principles vastly more importance.”", "The Master Key teaches right principles, and suggests methods for making a practical application of the principles; in that it differs from every other course of study. It teaches that the only possible value which can attach to any principle is in its application. Many read books, take home study courses, attend lectures all their lives without ever making any progress in demonstrating the value of the principles involved. The Master Key suggests methods by which the value of the principles taught may be demonstrated and put in actual practice in the daily experience.", "There is a change in the thought of the world. This change is silently transpiring in our midst, and is more important than any which the world has undergone since the downfall of Paganism.", "The present revolution in the opinions of all classes of men, the highest and most cultured of men as well as those of the laboring class, stands unparalleled in the history of the world.", "Science has of late made such vast discoveries, has revealed such an infinity of resources, has unveiled such enormous possibilities and such unsuspected forces, that scientific men more and more hesitate to affirm certain theories as established and indubitable or to deny certain other theories as absurd or impossible, and so a new civilization is being born; customs, creeds, and cruelty are passing; vision, faith and service are taking their place. The fetters of tradition are being melted off from humanity, and as the dross of materialism is being consumed, thought is being liberated and truth is rising full orbed before an astonished multitude.", "The whole world is on the eve of a new consciousness, a new power and a new consciousness, a new power and a new realization of the resources within the self. The last century saw the most magnificent material progress in history. The present century will produce the greatest progress in mental and spiritual power.", "Physical Science has resolved matter into molecules, molecules into atoms, atoms into energy, and it has remained for Sir Ambrose Fleming, in an address before the Royal Institution, to resolve this energy into mind. He says: “In its ultimate essence, energy may be incomprehensible by us except as an exhibition of the direct operation of that which we call Mind or Will.”", "Let us see what are the most powerful forces in Nature. In the mineral world everything is solid and fixed. In the animal and vegetable kingdom it is in a state of flux, forever changing, always being created and recreated. In the atmosphere we find heat, light and energy. Each realm becomes finer and more spiritual as we pass from the visible to the invisible, from the coarse to the fine, from the low potentiality to high potentiality. When we reach the invisible we find energy in its purest and most volatile state.", "And as the most powerful forces of Nature are the invisible forces, so we find that the most powerful forces of man are his invisible forces, his spiritual force, and the only way in which the spiritual force can manifest is through the process of thinking. Thinking is the only activity which the spirit possesses, and thought is the only product of thinking.", "Addition and subtraction are therefore spiritual transactions; reasoning is a spiritual process; ideas are spiritual conceptions; questions are spiritual searchlights and logic, argument and philosophy is spiritual machinery.", "Every thought brings into action certain physical tissue, parts of the brain, nerve or muscle. This produces an actual physical change in the construction of the tissue. Therefore it is only necessary to have a certain number of thoughts on a given subject in order to bring about a complete change in the physical organization of a man.", "This is the process by which failure is changed to success. Thoughts of courage, power, inspiration, harmony, are substituted for thoughts of failure, despair, lack, limitation and discord, and as these thoughts take root, the physical tissue is changed and the individual sees life in a new light, old things have actually passed away, all things have become new, he is born again, this time born of the spirit, life has a new meaning for him, he is reconstructed and is filled with joy, confidence, hope, energy. He sees opportunities for success to which he was heretofore blind. He recognizes possibilities which before had no meaning for him. The thoughts of success with which he has been impregnated are radiated to those around him, and they in turn help him onward and upward; he attract to him new and successful associates, and this in turn changes his environment; so that by this simple exercise of thought, a man changes not only himself, but his environment, circumstances and conditions.", "You will see, you must see, that we are at the dawn of a new day; that the possibilities are so wonderful, so fascinating, so limitless as to be almost bewildering. A century ago any man with a Gatling Gun could have annihilated a whole army equipped with the implements of warfare then in use. So it is at present. Any man with a knowledge of the possibilities contained in the Master Key has an inconceivable advantage over the multitude."], "qa": []}, {"id": "mkp-1", "title": "Part One", "n": 1, "letter": ["It is my privilege to enclose herewith Part One of The Master Key System. Would you bring into your life more power? Get the power consciousness. More health? Get the health consciousness. More happiness? Get the happiness consciousness. Live the spirit of these things until they become yours by right. It will then become impossible to keep them from you. The things of the world are fluid to a power within man by which he rules them.", "You need not acquire this power. You already have it. But you want to understand it; you want to use it; you want to control it; you want to impregnate yourself with it, so that you can go forward and carry the world before you.", "Day by day as you go on and on, as you gain momentum, as your inspiration deepens, as your plans crystallize, as you gain understanding, you will come to realize that this world is no dead pile of stones and timber, but that it is a living thing! It is made up of the beating hearts of humanity. It is a thing of life and beauty.", "It is evident that it requires understanding to work with material of this description, but those who come into this understanding, are inspired by a new light, a new force, they gain confidence and greater power each day, they realize their hopes and their dreams come true, life has a deeper, fuller, clearer meaning than before.", "And, now, Part One."], "body": ["1. That much gathers more is true on every plane of existence and that loss leads to greater loss is equally true.", "2. Mind is creative, and conditions, environment and all experiences in life are the result of our habitual or predominant mental attitude.", "3. The attitude of mind necessarily depends upon what we think. Therefore, the secret of all power, all achievement and all possession depends upon our method of thinking.", "4. This is true because we must “be” before we can “do,” and we can “do” only to the extent which we “are,” and what we “are” depends upon what we “think.”", "5. We cannot express powers that we do not possess. The only way by which we may secure possession of power is to become conscious of power, and we can never become conscious of power until we learn that all power is from within.", "6. There is a world within – a world of thought and feeling and power; of light and life and beauty and, although invisible, its forces are mighty.", "7. The world within is governed by mind. When we discover this world we shall find the solution for every problem, the cause for every effect; and since the world within is subject to our control, all laws of power and possession are also within our control.", "8. The world without is a reflection of the world within. What appears without is what has been found within. In the world within may be found infinite Wisdom, infinite Power, infinite Supply of all that is necessary, waiting for unfoldment, development and expression. If we recognize these potentialities in the world within they will take form in the world without.", "9. Harmony in the world within will be reflected in the world without by harmonious conditions, agreeable surroundings, the best of everything. It is the foundation of health and a necessary essential to all greatness, all power, all attainment, all achievement and all success.", "10. Harmony in the world within means the ability to control our thoughts, and to determine for ourselves how any experience is to affect us.", "11. Harmony in the world within results in optimism and affluence; affluence within results in affluence without.", "12. The world without reflects the circumstances and the conditions of the consciousness within.", "13. If we find wisdom in the world within, we shall have the understanding to discern the marvelous possibilities that are latent in this world within, and we shall be given the power to make these possibilities manifest in the world without.", "14. As we become conscious of the wisdom in the world within, we mentally take possession of this wisdom, and by taking mental possession we come into actual possession of the power and wisdom necessary to bring into manifestation the essentials necessary for our most complete and harmonious development.", "15. The world within is the practical world in which the men and women of power generate courage, hope, enthusiasm, confidence, trust and faith, by which they are given the fine intelligence to see the vision and the practical skill to make the vision real.", "16. Life is an unfoldment, not accretion. What comes to us in the world without is what we already possess in the world within.", "17. All possession is based on consciousness. All gain is the result of an accumulative consciousness. All loss is the result of a scattering consciousness.", "18. Mental efficiency is contingent upon harmony; discord means confusion; therefore, he who would acquire power must be in harmony with Natural Law.", "19. We are related to the world without by the objective mind. The brain is the organ of this mind and the cerebro-spinal system of nerves puts us in conscious communication with every part of the body. This system of nerves responds to every sensation of light, heat, odor, sound and taste.", "20. When this mind thinks correctly, when it understands the truth, when the thoughts sent through the cerebro-spinal nervous system to the body are constructive, these sensations are pleasant, harmonious.", "21. The result is that we build strength, vitality and all constructive forces into our body, but it is through this same objective mind that all distress, sickness, lack, limitation and every form of discord and inharmony is admitted to our lives. It is therefore through the objective mind, by wrong thinking, that we are related to all destructive forces.", "22. We are related to the world within by the subconscious mind. The solar plexus is the organ of this mind; the sympathetic system of nerves presides over all subjective sensations, such as joy, fear, love, emotion, respiration, imagination and all other subconscious phenomena. It is through the subconscious that we are connected with the Universal Mind and brought into relation with the Infinite constructive forces of the Universe.", "23. It is the coordination of these two centers of our being, and the understanding of their functions, which is the great secret of life. With this knowledge we can bring the objective and subjective minds into conscious cooperation and thus coordinate the finite and the infinite. Our future is entirely within our own control. It is not at the mercy of any capricious or uncertain external power.", "24. All agree that there is but one Principle or Consciousness pervading the entire Universe, occupying all space, and being essentially the same in kind at every point of its presence. It is all powerful, all wisdom and always present. All thoughts and things are within Itself. It is all in all.", "25. There is but one consciousness in the universe able to think; and when it thinks, its thoughts become objective things to it. As this Consciousness is omnipresent, it must be present within every individual; each individual must be a manifestation of that Omnipotent, Omniscient and Omnipresent Consciousness.", "26. As there is only one Consciousness in the Universe that is able to think it necessarily follows that your consciousness is identical with the Universal Consciousness, or, in other words, all mind is one mind. There is no dodging this conclusion.", "27. The consciousness that focuses in your brain cells is the same consciousness which focuses in the brain cells of every other individual. Each individual is but the individualization of the Universal, the Cosmic Mind.", "28. The Universal Mind is static or potential energy; it simply is; it can manifest only through the individual, and the individual can manifest only through the Universal. They are one.", "29. The ability of the individual to think is his ability to act on the Universal and bring it into manifestation. Human consciousness consists only in the ability of man to think. Mind in itself is believed to be a subtle form of static energy, from which arises the activities called ‘thought,’ which is the dynamic phase of mind. Mind is static energy, thought is dynamic energy - the two phases of the same thing. Thought is therefore the vibratory force formed by converting static mind into dynamic mind.", "30. As the sum of all attributes are contained in the Universal Mind, which is Omnipotent, Omniscient and Omnipresent, these attributes must be present at all times in their potential form in every individual. Therefore, when the individual thinks, the thought is compelled by its nature to embody itself in an objectivity or condition which will correspond with its origin.", "31. Every thought therefore is a cause and every condition an effect; for this reason it is absolutely essential that you control your thoughts so as to bring forth only desirable conditions.", "32. All power is from within, and is absolutely under your control; it comes through exact knowledge and by the voluntary exercises of exact principles.", "33. It should be plain that when you acquire a thorough understanding of this law, and are able to control your thought processes, you can apply it to any condition; in other words, you will have come into conscious cooperation with Omnipotent law which is the fundamental basis of all things.", "34. The Universal Mind is the life principle of every atom which is in existence; every atom is continually striving to manifest more life; all are intelligent, and all are seeking to carry out the purpose for which they were created.", "35. A majority of mankind lives in the world without; few have found the world within, and yet it is the world within that makes the world without; it is therefore creative and everything which you find in your world without has been created by you in the world within.", "36. This system will bring you into a realization of power which will be yours when you understand this relation between the world without and the world within. The world within is the cause, the world without the effect; to change the effect you must change the cause.", "37. You will at once see that this is a radically new and different idea; most men try to change effects by working with effects. They fail to see that this is simply changing one form of distress for another. To remove discord, we must remove the cause, and this cause can be found only in the world within.", "38. All growth is from within. This is evident in all nature. Every plant, every animal, every human is a living testimony to this great law, and the error of the ages is in looking for strength or power from without.", "39. The world within is the Universal fountain of supply, and the world without is the outlet to the stream. Our ability to receive depends upon our recognition of this Universal Fountain, this Infinite Energy of which each individual is an outlet, and so is one with every other individual.", "40. Recognition is a mental process, mental action is therefore the interaction of the individual upon the Universal Mind, and as the Universal Mind is the intelligence which pervades all space and animates all living things, this mental action and reaction is the law of causation, but the principle of causation does not obtain in the individual but in the Universal Mind. It is not an objective faculty but a subjective process, and the results are seen in an infinite variety of conditions and experiences.", "41. In order to express life there must be mind; nothing can exist without mind. Everything which exists is some manifestation of this one basic substance from which and by which all things have been created and are continually being recreated.", "42. We live in a fathomless sea of plastic mind substance. This substance is ever alive and active. It is sensitive to the highest degree. It takes form according to the mental demand. Thought forms the mold or matrix from which the substance expresses.", "43. Remember that it is in the application alone that the value consists, and that a practical understanding of this law will substitute abundance for poverty, wisdom for ignorance, harmony for discord and freedom for tyranny, and certainly there can be no greater blessing than these from a material and social standpoint.", "44. Now make the application: Select a room where you can be alone and undisturbed; sit erect, comfortably, but do not lounge; let your thoughts roam where they will but be perfectly still for from fifteen minutes to half an hour; continue this for three or four days or for a week until you secure full control of your physical being.", "45. Many will find this extremely difficult; others will conquer with ease, but it is absolutely essential to secure complete control of the body before you are ready to progress. Next week you will receive instructions for the next step; in the meantime you must have mastered this one."], "qa": [{"q": "What is the world without in its relation to the world within?", "a": "The world without is a reflection of the world within."}, {"q": "Upon what does all possession depend?", "a": "All possession is based on consciousness."}, {"q": "How is the individual related to the objective world?", "a": "The individual is related to the objective world by the objective mind; the brain is the organ of this mind."}, {"q": "How is he related to the Universal Mind?", "a": "He is related to the Universal Mind by the subconscious mind; the Solar Plexus is the organ of this mind."}, {"q": "What is the Universal Mind?", "a": "Universal Mind is the life principle of every atom which is in existence."}, {"q": "How can the Individual act on the Universal?", "a": "The ability of the individual to think is his ability to act upon the Universal and bring it into manifestation."}, {"q": "What is the result of this action and interaction?", "a": "The result of this action and interaction is cause and effect; every thought is a cause and every condition an effect."}, {"q": "How are harmonious and desirable conditions secured?", "a": "Harmonious and desirable conditions are obtained by right thinking."}, {"q": "What is the cause of all discord, inharmony, lack and limitation?", "a": "Discord, inharmony, lack and limitation are the result of wrong thinking."}, {"q": "What is the source of all power?", "a": "The source of all power is the world within, the Universal Fountain of Supply, the Infinite Energy of which each individual is an outlet."}]}, {"id": "mkp-2", "title": "Part Two", "n": 2, "letter": ["Our difficulties are largely due to confused ideas and ignorance of our true interests. The great task is to discover the laws of nature to which we are to adjust ourselves. Clear thinking and moral insight are, therefore, of incalculable value. All processes, even those of thought, rest on solid foundations.", "The keener the sensibilities, the more acute the judgment, the more delicate the taste, the more refined the moral feelings, the more subtle the intelligence, the loftier the aspiration—the purer and more intense are the gratifications which existence yields. Hence it is that the study of the best that has been thought in the world gives supreme pleasure.", "The powers, uses and possibilities of the mind under the new interpretations are incomparably more wonderful that the most extravagant accomplishment, or even dreams of material progress.", "Thought is energy. Active thought is active energy; concentrated thought is a concentrated energy. Thought concentrated on a definite purpose becomes power. This is the power which is being used by those who do not believe in the virtue of poverty, or the beauty of self-denial. They perceive that this is the talk of weaklings.", "The ability to receive and manifest this power depends upon the ability to recognize the Infinite Energy ever dwelling in man, constantly creating and recreating his body and mind, and ready at any moment to manifest through him in any needful manner. In exact proportion to the recognition of this truth will be the manifestation in the outer life of the individual.", "Part Two explains the method by which this is accomplished."], "body": ["1. The operations of the mind are produced by two parallel modes of activity, the one conscious, and the other subconscious. Professor Davidson says: “He who thinks to illuminate the whole range of mental action by the light of his own consciousness is not unlike the one who should go about to illuminate the universe with a rushlight.”", "2. The subconscious’ logical processes are carried on with a certainty and regularity which would be impossible if there existed the possibility of error. Our mind is so designed that it prepares for us the most important foundations of cognition, whilst we have not the slightest apprehension of the modus operandi.", "3. The subconscious soul, like a benevolent stranger, works and makes provision for our benefit, pouring only the mature fruit into our lap; thus ultimate analysis of thought processes shows that the subconscious is the theatre of the most important mental phenomena.", "4. It is through the subconscious that Shakespeare must have perceived, without effort, great truths which are hidden from the conscious mind of the student; that Phidias fashioned marble and bronze; that Raphael painted Madonnas and Beethoven composed symphonies.", "5. Ease and perfection depend entirely upon the degree in which we cease to depend upon the consciousness; playing the piano, skating, operating the typewriter, the skilled trades, depend for their perfect execution on the process of the sub-conscious mind. The marvel of playing a brilliant piece on the piano, while at the same time conducting a vigorous conversation, shows the greatness of our subconscious powers.", "6. We are all aware how dependent we are upon the subconscious, and the greater, the nobler, the more brilliant our thoughts are, the more it is obvious to ourselves that the origin lies beyond our ken. We find ourselves endowed with tact, instinct, sense of the beautiful in art, music, etc., or whose origin or dwelling place we are wholly unconscious.", "7. The value of the subconscious is enormous; it inspires us; it warns us; it furnishes us with names, facts and scenes from the storehouse of memory. It directs our thoughts, tastes, and accomplishes tasks so intricate that no conscious mind, even if it had the power, has the capacity for.", "8. We can walk at will; we can raise the arm whenever we choose to do so; we can give our attention through eye or ear to any subject at pleasure. On the other hand, we cannot stop our heartbeats nor the circulation of the blood, nor the growth of stature, nor the formation of nerve and muscle tissue, nor the building of the bones, nor many other important vital processes.", "9. If we compare these two sets of action, the one decreed by the will of the moment, and the other proceeding in majestic, rhythmic course, subject to no vacillation, but constant at every moment, we stand in awe of the latter, and ask to have the mystery explained. We see at once that these are the vital processes of our physical life, and we can not avoid the inference that these all-important functions are designedly withdrawn from the domain of our outward will with its variations and transitions, and placed under the direction of a permanent and dependable power within us.", "10. Of these two powers, the outward and changeable has been termed the “Conscious Mind,” or the “Objective Mind” (dealing with outward objects). The interior power is called the “Subconscious Mind,” or the “Subjective Mind,” and besides its work on the mental plane it controls the regular functions which make physical life possible.", "11. It is necessary to have a clear understanding of their respective functions on the mental plane, as well as of certain other basic principles. Perceiving and operating through the five physical senses, the conscious mind deals with the impressions and objects of the outward life.", "12. It has the faculty of discrimination, carrying with it the responsibility of choice. It has the power of reasoning - whether inductive, deductive, analytical or syllogistic - and this power may be developed to a high degree. It is the seat of the will with all the energies that flow therefrom.", "13. Not only can it impress other minds, but it can direct the subconscious mind. In this way the conscious mind becomes the responsible ruler and guardian of the subconscious mind. It is this high function which can completely reverse conditions in your life.", "14. It is often true that conditions of fear, worry, poverty, disease, inharmony and evils of all kinds dominate us by reason of false suggestions accepted by the unguarded subconscious mind. All this the trained conscious mind can entirely prevent by its vigilant protective action. It may properly be called “the watchman at the gate” of the great subconscious domain.", "15. One writer has expressed the chief distinction between the two phases of mind thus: “Conscious mind is reasoning will. Subconscious mind is instinctive desire, the result of past reasoning will.”", "16. The subconscious mind draws just and accurate inferences from premises furnished from outside sources. Where the premise is true, the subconscious mind reaches a faultless conclusion, but, where the premise or suggestion is an error, the whole structure falls. The subconscious mind does not engage in the process of proving. It relies upon the conscious mind, “the watchman at the gate,” to guard it from mistaken impressions.", "17. Receiving any suggestions as true, the subconscious mind at once proceeds to act thereon in the whole domain of its tremendous field of work. The conscious mind can suggest either truth or error. If the latter, it is at the cost of wide-reaching peril to the whole being.", "18. The conscious mind ought to be on duty during every waking hour. When the “watchman” is “off guard,” or when its calm judgment is suspended, under a variety of circumstances, then the subconscious mind is unguarded and left open to suggestion from all sources. During the wild excitement of panic, or during the height of anger, or the impulses of the irresponsible mob, or at any other time of unrestrained passion, the conditions are most dangerous. The subconscious mind is then open to the suggestion of fear, hatred, selfishness, greed, self-depreciation and other negative forces, derived from surrounding persons or circumstances. The result is usually unwholesome in the extreme, with effects that may endure to distress it for a long time. Hence, the great importance of guarding the subconscious mind from false impressions.", "19. The subconscious mind perceives by intuition. Hence, its processes are rapid. It does not wait for the slow methods of conscious reasoning. In fact, it can not employ them.", "20. The subconscious mind never sleeps, never rests, any more than does your heart, or your blood. It has been found that by plainly stating to the subconscious mind certain specific things to be accomplished, forces are set in operation that lead to the result desired. Here, then, is a source of power which places us in touch with Omnipotence. Here in is a deep principle which is well worth our most earnest study.", "21. The operation of this law is interesting. Those who put it into operation find that when they go out to meet the person with whom they anticipate a difficult interview, something has been there before them and dissolved the supposed differences; everything is changed; all is harmonious; they find that when some difficult business problem presents itself they can afford to make delay and something suggests the proper solution; everything is properly arranged; in fact, those who have learned to trust the subconscious find that they have infinite resources at their command.", "22. The subconscious mind is the seat of our principles and our aspirations. It is the fount of our artistic and altruistic ideals. These instincts can only be overthrown by an elaborate and gradual process of undermining the innate principles.", "23. The subconscious mind cannot argue controversially. Hence, if it has accepted wrong suggestions, the sure method of overcoming them is by the use of a strong counter suggestion, frequently repeated, which the mind must accept, thus eventually forming new and healthy habits of thought and life, for the subconscious mind is the seat of Habit. That which we do over and over becomes mechanical; it is no longer an act of judgment, but has worn its deep grooves in the subconscious mind. This is favorable for us if the habit be wholesome and right. If it be harmful, and wrong, the remedy is to recognize the omnipotence of the subconscious mind and suggest present actual freedom. The subconscious being creative and one with our divine source will at once create the freedom suggested.", "24. To sum up: The normal functions of the subconscious on the physical side have to do with the regular and vital processes, with the preservation of life and the restoration of health; with the care of offspring, which includes an instinctive desire to preserve all life and improve conditions generally.", "25. On the mental side, it is the storehouse of memory; it harbors the wonderful thought messengers, who work, unhampered by time or space; it is the fountain of the practical initiative and constructive forces of life: It is the seat of habit.", "26. On the spiritual side, it is the source of ideals, of aspiration, of the imagination, and is the channel through which we recognize our Divine Source, and in proportion as we recognize this divinity do we come into an understanding of the source of power.", "27. Some one may ask: “How can the subconscious change conditions?” The reply is, because the subconscious is a part of the Universal Mind and a part must be the same in kind and quality as the whole; the only difference is one of degree. The whole, as we know, is creative, in fact, it is the only creator there is, consequently, we find that mind is creative, and as thought is the only activity which the mind possesses, thought must necessarily be creative also.", "28. But we shall find that there is a vast difference between simply thinking, and directing our thought consciously, systematically and constructively; when we do this we place our mind in harmony with the Universal Mind, we come in tune with the Infinite, we set in operation the mightiest force in existence, the creative power of the Universal Mind. This, as everything else, is governed by natural law, and this law is the “Law of Attraction,” which is that Mind is creative, and will automatically correlate with its object and bring it into manifestation.", "29. Last week I gave you an exercise for the purpose of securing control of the physical body; if you have accomplished this you are ready to advance. This time you will begin to control your thought. Always take the same room, the same chair, and the same position, if possible. In some cases it is not convenient to take the same room, in this case simply make the best use of such conditions as may be available. Now be perfectly still as before, but inhibit all thought; this will give you control over all thoughts of care, worry and fear, and will enable you to entertain only the kind of thoughts you desire. Continue this exercise until you gain complete mastery.", "30. You will not be able to do this for more that a few moments at a time, but the exercise is valuable, because it will be a very practical demonstration of the great number of thoughts which are constantly trying to gain access to your mental world.", "31. Next week you will receive instructions for an exercise which may be a little more interesting, but it is necessary that you master this one first.", "Cause and effect is as absolute and undeviating in the hidden realm of thought as in the world of visible and material things. Mind is the master weaver, both of the interior garment of character and the outer garment of circumstance", "James Allen"], "qa": [{"q": "What are the two modes of mental activity?", "a": "Conscious and subconscious."}, {"q": "Upon what do ease and perfection depend?", "a": "Ease and perfection depend entirely upon the degree in which we cease to depend upon the conscious mind."}, {"q": "What is the value of the subconscious?", "a": "It is enormous; it guides us, warns us, it controls the vital processes and is the seat of memory."}, {"q": "What are some of the functions of the conscious mind?", "a": "It has the faculty of discrimination; it has the power of reasoning; it is the seat of the will and may impress the subconscious."}, {"q": "How has the distinction between the conscious and subconscious been expressed?", "a": "“Conscious mind is reasoning will. Subconscious mind is instinctive desire, the result of past reasoning will.”"}, {"q": "What method is necessary in order to impress the subconscious?", "a": "Mentally state what is wanted."}, {"q": "What will be the result?", "a": "If the desire is in harmony with the forward movement of the great Whole, forces will be set in motion which will bring about the result."}, {"q": "What is the result of the operation of this law?", "a": "Our environment reflects conditions corresponding to the predominant mental attitude which we entertain."}, {"q": "What name has been given to this law?", "a": "The Law of Attraction."}, {"q": "How is the law stated?", "a": "Thought is a creative energy, and will automatically correlate with is object and bring it into manifestation."}]}, {"id": "mkp-3", "title": "Part Three", "n": 3, "letter": ["You have found that the Individual may act on the Universal, and that the result of this action and interaction is cause and effect. Thought, therefore, is the cause, and the experiences with which you meet in life are the effect.", "Eliminate, therefore, any possible tendency to complain of conditions as they have been, or as they are, because it rests with you to change them and make them what you would like them to be.", "Direct your effort to a realization of the mental resources, always at your command, from which all real and lasting power comes.", "Persist in this practice until you come to a realization of the fact that there can be no failure in the accomplishment of any proper object in life if you but understand your power and persist in your object, because the mind-forces are ever ready to lend themselves to a purposeful will, in the effort to crystallize thought and desire into actions, events and conditions.", "Whereas in the beginning of each function of life and each action is the result of conscious thought, the habitual actions become automatic and the thought that controls them passes into the realm of the subconscious; yet it is just as intelligent as before. It is necessary that it become automatic, or subconscious, in order that the self-conscious mind may attend to other things. The new actions will, however, in their turn, be come habitual,
