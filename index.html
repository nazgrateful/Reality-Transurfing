[32, "The Master's Intention", "Decide by will that events are favourable to you. This isn't hope or optimism; it's the Master's stance. The Master is more witness than pusher: you move yourself (your attitude) and let the world move freely. Release your grip.", "For one hour today, give the world permission to be a comfortable place for you. Notice what loosens."],
[33, "The Pendulum Rule", "The pendulum's rule is \"do as I do\": copy the standard. Following it makes people unhappy. Set your own standards and claim the right to break the rule, but use structures consciously rather than fighting them blindly.", "Name one standard of success you've been chasing. Write your own version of success in that area."],
[34, "The Transurfing Rule", "Replace \"do as I do\" with: give yourself permission to be yourself, and allow others to be themselves. It dissolves guilt, inferiority and many conflicts.", "In a tricky situation today, ask: how can I act here without breaking the Transurfing rule?"],
[35, "Dropping Importance", "Unbalanced emotions, from irritation to idealisation, all come from inflated importance, which lets pendulums hook you. Don't suppress feelings; change the attitude behind them. Care, but don't inflate.", "Pick one thing that's bothering you. Watch it as an outside observer for a minute and consciously lower its importance."],
[36, "Ending the Battle", "Fight the world and it fights back; stop fighting and it meets you halfway. Pendulums say you must change yourself and battle for your place. Instead, give yourself permission to have, right now.", "Write: \"I give myself permission to have ___.\" Say it once, calmly, without insisting."],
[37, "Co-ordinating Intention", "Every event has a favourable and an unfavourable branch, and your reaction picks one. Treat apparent setbacks as good: \"If it works out, great. If not, even better.\"", "Use \"if it works out, great; if not, even better\" on every hiccup today."],
[38, "My World Cares", "Take \"My world takes care of me\" as an axiom and affirm it in every situation, good or bad. Like gold in a mirror's backing, it warms everything the mirror shows.", "Say \"My world takes care of me\" at least ten times today, attached to real moments."],
[39, "Against the Flow", "The mind rows against the current: refusing, arguing, correcting, insisting on its script. Spend a day watching it. Shift from control to observation and let life move.", "For one day, notice each time you resist, argue or refuse. Let at least three of them go."],
[40, "With the Variants Flow", "There's already a simple solution in the flow of events. Ask \"what's the simplest way?\", accept unplanned changes, consider offers and advice, and let others do things their way.", "For every task today, ask \"what's the simplest way to do this?\" and do that."],
[41, "The Habit of Remembering", "Problems grip you only while you've forgotten you're in a dream. Build an inner observer who notices when importance has swallowed you, then wake up and apply Transurfing.", "Several times today, stop, look around with a clear head, and remember you're dreaming awake."],
[42, "Smashing Stereotypes", "Don't believe anyone who says you must slave, fight for your place, stay in your lane, or that your options are limited. Common sense is a \"thin\" law; let a miracle in by giving yourself permission.", "Write one limiting \"common sense\" belief you were taught. Cross it out and write your own."],
[43, "Visualising the Process", "Admire your work as you do it and picture it improving each day: \"Today I'm doing better than yesterday.\" Seeing the process unfold speeds the goal. The same works for your body.", "While you work today, picture the result getting better with each step, and tell yourself it's excellent."],
[44, "Slides", "Run the goal slide systematically: a picture of your life as if the goal were already reached. Live inside it, don't watch it like a film, add details and enjoy it. Don't worry about how; outer intention opens doors.", "Spend five minutes inside your goal slide today. Add one new detail."],
[45, "Path to Your Goal", "Drop importance and longing until only the resolve to have remains, like walking to the postbox. Don't think about the means; hold the slide and keep stepping. Keep a fall-back and don't burn bridges.", "Run your slide without any script for how it happens. Then take one small practical step."],
[46, "Doors", "Your door is the path that leads to your goal. If it drains you, it isn't yours; if it lifts and inspires you, it is. Your quirky, childlike interests may be the key.", "List three things you do easily and with enthusiasm. Could any of them be a door?"],
[47, "Co-dependent Relationships", "Comparison and conditions (\"if you're this, I'm that\") create polarisation that attracts trouble. Loosen your grip: don't compare, don't over-attach, accept things graciously and let them go.", "Catch yourself comparing yourself to someone today. Let the comparison drop."],
[48, "The Search for Love", "Don't hunt for love. Run a slide of life with an ideal partner (an abstract person, not someone you know), and when a door opens, step through simply and sincerely, as yourself.", "Write a short slide of a day with your ideal partner, without naming anyone real."],
[49, "Extinguishing a Pendulum", "Pendulums provoke you to lose balance. Respond abnormally: swap fear for confidence, gloom for enthusiasm, irritation for joy or indifference. Off-rhythm responses stop the swing.", "The next time something provokes you, deliberately respond in the opposite way to what's expected."],
[50, "The Pendulum Flop", "To let go of what you don't want, first accept that it exists, then pass by indifferently. At a pendulum's first push, agree, then step aside or steer it your way. Express emotion, don't bottle it, then adjust your attitude.", "When something irritates you today, say \"fair enough\" to yourself, then turn your attention elsewhere."],
[51, "Incomprehensible Infinity", "No one created the space of variations; it simply is. Transurfing doesn't explain the world, it offers a practical model, like driving a car without knowing how it was built.", "Write down one question you've been stuck on \"understanding\". Decide to act on the practical model instead."],
[52, "Gatekeeper to Eternity", "The gate to everything you want opens only for those who claim the Master's right: \"I'm capable and worthy because I've decided it. I don't want or hope; I intend.\" The chosen ones choose themselves.", "Say to yourself, once and calmly: \"From this moment on, I choose myself.\""],
[53, "Shaping Your Own Destiny", "Fate isn't fixed; you can row your own boat instead of drifting. When the means aren't clear yet, forget the \"how\" and run the goal slide as if it's done. Like a night flight, you can't feel the movement, but the engine is running.", "When your mind asks \"but how?\" today, answer: not my job right now. Then run your slide."],
[54, "Spiritual Laziness", "Horoscopes and predictions plant a program you then live out, because you believe it. Don't hand your future to \"mirror makers\"; you already have your own mirror.", "Skip any forecast, horoscope or prediction today. Decide your own outlook for the day instead."],
[55, "The Master's Mindset", "The mirror reflects what you think about, not whether you like it. People keep dragging around what they dislike. Make it a rule to steer your thoughts toward what you want, and turn everything into a positive.", "Each time your mind dwells on something unwanted today, redirect it to the thing you do want."],
[56, "Dissatisfaction with the World", "As people age they often slide into discontent, like a spoiled child demanding more, and the world agrees. Replace that reflex with a positive dominant: my world chooses the best for me and meets me halfway.", "Write your own short \"my world…\" paragraph and read it morning and evening."],
[57, "Inferiority", "Inferiority comes from comparison. Fighting it head-on makes it worse. Stop comparing and move attention to your strengths; build a slide where they're in full bloom and the shortcomings fade into the background.", "Pick one strength and use it on purpose today. Notice how the \"flaw\" matters less."],
[58, "Self-sufficiency", "You have huge potential. Stop searching for truth in outside authorities; ask yourself the question and dare to answer it. Original work comes from the soul; the mind alone produces the ordinary.", "Take a question you'd normally look up or ask someone about. Give yourself time and answer it yourself first."],
[59, "Decision Making", "Let the mind do its analysis, then check how your soul felt when the decision landed. If you have to persuade yourself to say yes, the soul is saying no.", "For your next decision, decide with the mind, then notice the first feeling. Light or heavy?"],
[60, "The Rustle of the Morning Stars", "The soul doesn't think or talk; it feels and knows. Its voice shows up when the mind's chatter pauses. A wave of unease about a decision is a reliable signal.", "Sit quietly for five minutes with a question in mind. Don't think; notice any feeling that comes."],
[61, "Borrowed Goals", "Ask: do I really want this, or do I just want to want it? Borrowed goals feel like obligation, prestige and proving yourself, with joy always in the future. Your own goal makes you happy now.", "Imagine one goal already achieved and behind you. Do you feel good, or burdened?"],
[62, "Your Personal Goal", "Each soul has its own goal, and happiness lives on that path now, not later. The mind's job isn't to find the goal by logic but to recognise it. Widen your horizons and let the soul meet it.", "Do something new today: a new place, book, film or conversation. Notice what lights you up."],
[63, "The Boat Wheel of Intention", "Turn desire into firm intention. Longing is fear of failure, and it comes from fixating on how. Keep the course fixed on the goal no matter what happens: \"I don't want, I don't hope, I intend.\"", "Write your goal as a fact. Under it write: I don't want and I don't hope. I intend."],
[64, "The Soul's Sail", "Without awareness, pendulums hand you false goals and a slot in the system, and life feels like serving time. Your own goal turns life into a celebration and brings other wishes with it.", "List what in your week feels like serving time. What would a celebration version look like?"],
[65, "Pessimism", "Picking at what you dislike darkens your world bit by bit. Stop looking for problems and look for solutions. Stop whining, and the sense that things are getting better will follow.", "Go one whole day without complaining. Each time you catch one, turn it into a solution."],
[66, "Support", "In a hard moment, pendulums want you either to fight or to collapse. Do neither. Wake up and see the game: \"Ah, it's you, pendulum.\" Understanding what's happening gives you back your footing.", "Next time something knocks you off balance, name the pendulum out loud and take a breath before reacting."],
[67, "Refining the Script", "Watch events like an observer while still taking part. Don't insist on your script; let the flow move and nudge it only now and then, like a wise mentor. Giving up control gives you real control.", "Today, let one plan change without resisting. Watch where it leads."],
[68, "Box for the Soul", "Your soul came here to celebrate, not suffer. The mind, captured by pendulums, becomes the soul's jailer. Drop importance when a pendulum hooks you and choose to live for yourself.", "When you feel hooked today, smile at it and consciously drop the importance."],
[69, "Idealisation", "Myths you build around people or things eventually get debunked by balancing forces. Follow three don'ts: don't inflate importance, don't idolise anyone, and don't sugar-coat reality. See things soberly.", "Pick one person or thing you've idealised. Write a more down-to-earth description."],
[70, "Unconditional Love", "Being loved is a small miracle; treat it gently even if you don't return it. Give love without demands or conditions; only unconditional love can invite mutual love.", "Do one kind thing for someone you love without expecting anything back, and without mentioning it."],
[71, "Polar Comparisons", "Comparison breeds either inferiority or superiority, and both are traps. Claim the right not to be like everyone else. Live by your own credo; others care far less about your flaws than you think.", "Notice each comparison today, up or down. Replace it with: I'm allowed to be me."],
[72, "The Unique Soul", "Your uniqueness is beyond competition. Copying a star makes a parody. Drop the masks, turn to your heart, and allow yourself to be the extraordinary person you are.", "Name one \"mask\" you wear to fit in. Spend part of today without it."],
[73, "The Miserly Mind", "The mind, trained by pendulums, says no: \"too expensive, unrealistic, not for people like us.\" Don't let it bury your dream. Agree to have it, and let outer intention take care of the how.", "Write down one dream your mind has vetoed. Read it again and say: I agree to have this."],
[74, "The Greedy Soul", "When choosing, ignore limits. A boat? Why not a yacht? Head of department? Why not president? Your requests are tiny compared to what's possible on your own path. Be realistic, demand the impossible.", "Take your current goal and ask \"what about…?\" three times, making it bigger each time."],
[75, "Money", "Move toward your goal and money follows. Meanwhile, think about the money you have, not what you lack. Receive it with joy and let it go easily; money flows through a pipe, not a reservoir.", "Every time you pay or are paid today, think: money comes and goes freely and there's always more."],
[76, "Comfort Zone", "If wealth or success feels uncomfortable to imagine, it's outside your comfort zone and won't come. Widen the zone by returning to your slide again and again until the dream feels normal.", "Spend a few minutes picturing yourself already living your goal, until it feels a little more ordinary."],
[77, "Allies", "Treat objects around you as if they were alive and on your side: a talisman, your car, your home. Don't ask them for anything; just trust that they look after you and thank them.", "Choose one object as your ally today. Treat it with care and thank it."],
[78, "Guardian Angel", "If you need support, create a guardian angel in your imagination. Believe in it, never get angry with it, share your joys and troubles with it, and thank it often; the more you love it, the stronger it gets.", "Picture your guardian angel in a form you like. Thank it for three things from today."],
];

const ALL_LESSONS = Object.values(BOOKS).flatMap((b) => b.lessons);

/* ------------------------------------------------------------------
   State and storage. Progress lives in the viewer's private db doc when
   the page runs as a claude.ai artifact, and in localStorage otherwise.
------------------------------------------------------------------- */
const LS_KEY = "transurfing-path-v1";
const blank = () => ({ v: 2, bookId: "transurfing", read: {}, quiz: {}, log: {}, journal: [], reflections: {}, book: { title: "Reality Transurfing", page: 0, pages: 0, where: "" }, chRead: {}, list: [], mk: { week: 1, started: 0, weekStart: 0, minutes: 0 }, t78: { done: {}, notes: {} }, last: null, lastBy: {}, lastCh: null, updated: 0 });
let S = blank();
let remote = null;
let saveTimer = null, saving = Promise.resolve();

function lsRead() { try { const r = localStorage.getItem(LS_KEY); return r ? JSON.parse(r) : null; } catch { return null; } }
function lsWrite() { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch {} }
function normalize(x) {
  const b = blank(); if (!x || typeof x !== "object") return b;
  const n = { ...b, ...x, book: { ...b.book, ...(x.book || {}) } };
  if (!BOOKS[n.bookId]) n.bookId = "transurfing";
  if (!Array.isArray(n.list)) n.list = [];
  n.mk = { ...b.mk, ...(x.mk || {}) };
  n.t78 = { done: {}, notes: {}, ...(x.t78 || {}) };
  if (!Array.isArray(n.journal)) n.journal = [];
  return n;
}

function setSync(t) { document.getElementById("sync").textContent = t; }

function save() {
  S.updated = Date.now();
  lsWrite();
  if (!remote) return;
  clearTimeout(saveTimer);
  setSync("Saving…");
  saveTimer = setTimeout(() => {
    const body = JSON.parse(JSON.stringify(S));
    saving = saving.then(() => remote.set(body)).then(
      () => setSync("Saved to your account"),
      (e) => setSync(e && e.code === "quota_exceeded" ? "Account storage full; saved in this browser" : "Saved in this browser (sync failed)")
    );
  }, 700);
}

async function connect() {
  if (!window.claude || typeof window.claude.use !== "function") return;
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    const ref = db.doc("data/users/" + uid + "/progress");
    const snap = await ref.get();
    if (snap.exists) {
      const theirs = normalize(snap.data());
      if ((theirs.updated || 0) >= (S.updated || 0)) { S = theirs; lsWrite(); applyBook(); render(); }
      remote = ref;
      if ((S.updated || 0) > (theirs.updated || 0)) save(); else setSync("Saved to your account");
    } else {
      remote = ref;
      if (S.updated) save(); else setSync("Saved to your account");
    }
  } catch (e) { /* stay on browser storage */ }
}

/* ------------------------------------------------------------------
   Helpers
------------------------------------------------------------------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const dayKey = (d = new Date()) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
let B = BOOKS.transurfing;
const lessonById = (id) => ALL_LESSONS.find((l) => l.id === id);
const lessonIndex = (id) => { for (const b of Object.values(BOOKS)) { const i = b.lessons.findIndex((l) => l.id === id); if (i >= 0) return i; } return -1; };
const bookOfLesson = (id) => Object.values(BOOKS).find((b) => b.lessons.some((l) => l.id === id));
function status(id) {
  const q = S.quiz[id];
  if (q && q.score === q.total) return "mastered";
  if (S.read[id]) return "read";
  return "new";
}
function statusChip(id) {
  const s = status(id);
  return s === "mastered" ? '<span class="chip mastered">Mastered</span>' : s === "read" ? '<span class="chip read">Read</span>' : '<span class="chip">New</span>';
}
function activeDays() {
  const days = new Set(Object.keys(S.log).filter((k) => (S.log[k] || []).length));
  Object.values(S.read).forEach((t) => days.add(dayKey(new Date(t))));
  Object.values(S.chRead).forEach((t) => days.add(dayKey(new Date(t))));
  S.journal.forEach((j) => days.add(dayKey(new Date(j.ts))));
  return days;
}
function streak() {
  const days = activeDays();
  const d = new Date();
  if (!days.has(dayKey(d))) d.setDate(d.getDate() - 1);
  let n = 0;
  while (days.has(dayKey(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function fmtDate(ts) { return new Date(ts).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }); }
const bookPracticeIds = () => new Set(B.practices.map((p) => p.id));
const todaysFor = () => (S.log[dayKey()] || []).filter((id) => bookPracticeIds().has(id));
let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 1800); }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

   Views
------------------------------------------------------------------- */
let view = "today", openLesson = null, openCh = null, glossQ = "", journalFilter = "", pendingDelete = null, resetArmed = false, thanking = null, editing = null;

function applyBook() {
  B = BOOKS[S.bookId] || BOOKS.transurfing;
  document.documentElement.setAttribute("data-book", B.id);
  document.querySelectorAll("#books button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.book === B.id)));
  if (!B.tabs.includes(view)) view = "today";
  $("#tabs").innerHTML = B.tabs.map((t) => `<button data-view="${t}">${(B.labels || {})[t] || TAB_LABEL[t]}</button>`).join("");
}

function go(v, opts = {}) {
  view = v; openLesson = opts.lesson || null; openCh = opts.ch || null;
  if (opts.lesson) { S.last = opts.lesson; S.lastBy[B.id] = opts.lesson; save(); }
  if (opts.ch) { S.lastCh = opts.ch; save(); }
  pendingDelete = null; resetArmed = false; thanking = null; editing = null; t78View = 0; t78Force = false;
  render();
  window.scrollTo(0, 0);
}
function openLessonAnyBook(id) {
  const bk = bookOfLesson(id);
  if (bk && bk.id !== B.id) { S.bookId = bk.id; applyBook(); }
  go("lessons", { lesson: id });
}

function render() {
  document.querySelectorAll("#tabs button").forEach((b) => b.setAttribute("aria-current", b.dataset.view === view ? "page" : "false"));
  const m = $("#main");
  if (view === "lessons" && openLesson) m.innerHTML = vLesson(lessonById(openLesson));
  else if (view === "read" && B.id === "masterkey") m.innerHTML = openCh ? vPartMK(openCh) : vReadMK();
  else if (view === "read" && openCh) m.innerHTML = vChapter(openCh);
  else m.innerHTML = ({ today: vToday, t78: vT78, read: vRead, list: vList, lessons: vLessons, practice: vPractice, journal: vJournal, glossary: vGlossary, settings: vSettings })[view]();
  bind();
}

}

function principleOfDay() {
  const di = Math.floor((Date.now() - new Date(2026, 0, 1)) / 864e5);

function heatmap() {
  const weeks = 16, end = new Date(); end.setHours(0, 0, 0, 0);
  const ids = bookPracticeIds();
  // columns run Mon–Sun; the last column contains today
  const s = new Date(end); s.setDate(s.getDate() - ((end.getDay() + 6) % 7) - (weeks - 1) * 7);
  const cells = [];
  for (let d = new Date(s); d <= end; d.setDate(d.getDate() + 1)) {
    const k = dayKey(d), n = (S.log[k] || []).filter((id) => ids.has(id)).length;
    const lvl = n === 0 ? 0 : n <= 2 ? 1 : n <= 4 ? 2 : 3;
    cells.push(`<i data-l="${lvl}" class="${k === dayKey() ? "today" : ""}" title="${k}: ${n} practice${n === 1 ? "" : "s"}"></i>`);
  }
  return cells.join("");
}

function moveWant(id, dir) {
  const open = S.list.filter((w) => !w.done), i = open.findIndex((w) => w.id === id), j = i + dir;
  if (i < 0 || j < 0 || j >= open.length) return;
  [open[i], open[j]] = [open[j], open[i]];
  S.list = [...open, ...S.list.filter((w) => w.done)];
  save(); render();
}


/* Master Key: weekly course and sitting timer */
const mkWeek = () => Math.min(24, Math.max(1, S.mk.week || 1));
const TIMER = { dur: 15 * 60, left: 15 * 60, running: false, endAt: 0, iv: null, lock: null, audio: null };
const fmtClock = (s) => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(Math.floor(s % 60)).padStart(2, "0");
function timerTick() {
  if (!TIMER.running) return;
  TIMER.left = Math.max(0, Math.round((TIMER.endAt - Date.now()) / 1000));
  const el = $("#timer-clock"); if (el) el.textContent = fmtClock(TIMER.left);
  const bar = $("#timer-bar"); if (bar) bar.style.width = Math.round(100 * (1 - TIMER.left / TIMER.dur)) + "%";
  if (TIMER.left <= 0) timerDone();
}
function chime() {
  try {
    const a = TIMER.audio; if (!a) return;
    [0, 0.6].forEach((t, i) => {
      const o = a.createOscillator(), g = a.createGain();
      o.frequency.value = i ? 660 : 880; o.type = "sine";
      g.gain.setValueAtTime(0.0001, a.currentTime + t); g.gain.exponentialRampToValueAtTime(0.25, a.currentTime + t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + t + 1.8);
      o.connect(g); g.connect(a.destination); o.start(a.currentTime + t); o.stop(a.currentTime + t + 2);
    });
  } catch {}
}
function releaseLock() { try { TIMER.lock && TIMER.lock.release(); } catch {} TIMER.lock = null; }
function timerDone() {
  clearInterval(TIMER.iv); TIMER.running = false; TIMER.left = TIMER.dur; releaseLock(); chime();
  const k = dayKey(), arr = S.log[k] ? S.log[k].slice() : [];
  if (!arr.includes("mk-sit")) { arr.push("mk-sit"); S.log[k] = arr; }
  S.mk.minutes = (S.mk.minutes || 0) + Math.round(TIMER.dur / 60);
  save(); toast("Sitting complete"); if (view === "today" && B.id === "masterkey") render();
}
function timerStart() {
  try { TIMER.audio = TIMER.audio || new (window.AudioContext || window.webkitAudioContext)(); } catch {}
  TIMER.running = true; TIMER.endAt = Date.now() + TIMER.left * 1000;
  clearInterval(TIMER.iv); TIMER.iv = setInterval(timerTick, 500);
  try { navigator.wakeLock && navigator.wakeLock.request("screen").then((l) => (TIMER.lock = l), () => {}); } catch {}
  render();
}

/* Reminders: daily calendar alarms built as an .ics file */
const SITE_URL = "https://nazgrateful.github.io/Reality-Transurfing/";
const REMINDERS = [
  { id: "iw-m", label: "It Works · morning reading", time: "08:00", on: true },
  { id: "iw-n", label: "It Works · noon reading", time: "12:30", on: true },
  { id: "iw-e", label: "It Works · night reading", time: "21:30", on: true },
  { id: "mk-s", label: "Master Key · daily sitting", time: "07:00", on: true },
  { id: "rt-78", label: "78 Days · read today's principle", time: "07:30", on: true },
];
const inArtifact = () => !!(window.claude && typeof window.claude.use === "function");
function remList() { return REMINDERS.map((r) => ({ ...r, ...((S.reminders || {})[r.id] || {}) })); }
function buildICS() {
  const pad = (n) => String(n).padStart(2, "0"), d = new Date();
  const ymd = d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate());
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
  const ev = remList().filter((r) => r.on).map((r) => [
    "BEGIN:VEVENT", "UID:" + r.id + "-" + ymd + "@transurfing-path", "DTSTAMP:" + stamp,
    "DTSTART:" + ymd + "T" + r.time.replace(":", "") + "00", "DURATION:PT10M", "RRULE:FREQ=DAILY",
    "SUMMARY:" + r.label, "DESCRIPTION:Open Transurfing Path: " + SITE_URL,
    "BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:" + r.label, "TRIGGER:PT0S", "END:VALARM", "END:VEVENT"].join("\r\n"));
  return ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Transurfing Path//Reminders//EN", "CALSCALE:GREGORIAN", ...ev, "END:VCALENDAR"].join("\r\n") + "\r\n";
}
function remindersPanel() {
  const list = remList();
  return `<div class="panel stack" style="gap:12px">
      <div class="eyebrow">Daily reminders</div>
      <p class="note" style="margin:0">Pick the times you want to be reminded. Turn off any you don't need.</p>
      <div class="rem-list">${list.map((r) => `<label class="rem">
        <input type="checkbox" id="rem-on-${r.id}" data-rem-on="${r.id}" ${r.on ? "checked" : ""}>
        <span>${esc(r.label)}</span>
        <input type="time" id="rem-t-${r.id}" data-rem-t="${r.id}" value="${r.time}" aria-label="${esc(r.label)} time">
      </label>`).join("")}</div>
      ${inArtifact() ? `<p class="note" style="margin:0">To add these to your phone's calendar, open the website version of this app and tap <b>Add to my calendar</b> there: <a href="${SITE_URL}" target="_blank" rel="noopener">${SITE_URL.replace("https://", "")}</a>. This viewer can't save calendar files.</p>`
        : `<div class="row"><button class="btn primary" id="rem-ics">Add to my calendar</button><span class="note" id="rem-note"></span></div>`}
      <details class="howto"><summary>Make reminders ring through Do Not Disturb</summary>
        <p>No website or calendar file can override Do Not Disturb on its own; only your phone can allow that.</p>
        <p><b>Most reliable: phone alarms.</b> Alarms in the Clock app ring through Do Not Disturb and silent mode on both iPhone and Android. Create one alarm per time above and name it (for example "It Works · morning reading").</p>
        <p><b>iPhone, calendar reminders:</b> Settings → Focus → Do Not Disturb → Apps → add <b>Calendar</b>. Turn on <b>Time Sensitive Notifications</b> there too.</p>
        <p><b>Android, calendar reminders:</b> Settings → Notifications → Do Not Disturb → Exceptions (or "What can interrupt") → allow <b>Alarms</b>, <b>Events</b> and <b>Reminders</b>, or add your Calendar app as an exception.</p>
      </details>
    </div>`;
}
function bindReminders() {
  const setR = (id, patch) => { S.reminders = S.reminders || {}; S.reminders[id] = { ...(S.reminders[id] || {}), ...patch }; save(); };
  document.querySelectorAll("[data-rem-on]").forEach((el) => el.onchange = () => setR(el.dataset.remOn, { on: el.checked }));

  m.querySelectorAll("[data-received]").forEach((b) => b.onclick = () => {
    const w = S.list.find((x) => x.id === b.dataset.received);
    w.done = Date.now(); w.thanks = $("#t-text").value.trim().slice(0, 1000); thanking = null;
    const k = dayKey(), arr = S.log[k] ? S.log[k].slice() : [];
    if (!arr.includes("iw-thanks")) { arr.push("iw-thanks"); S.log[k] = arr; }
    save(); render(); toast("Received. Thank you.");
  });
  m.querySelectorAll("[data-undo]").forEach((b) => b.onclick = () => {
    const w = S.list.find((x) => x.id === b.dataset.undo); w.done = 0;
    S.list = [...S.list.filter((x) => !x.done), ...S.list.filter((x) => x.done)];
    save(); render();
  });

  // lesson
  if (view === "lessons" && openLesson) {
    const l = lessonById(openLesson);
    const mr = $("#mark-read");
    if (mr) mr.onclick = () => { S.read[l.id] = Date.now(); save(); render(); toast("Marked as read"); };
    const answers = new Array(l.quiz.length).fill(null);
    m.querySelectorAll(".q").forEach((qel) => {
      const qi = +qel.dataset.qi, q = l.quiz[qi];
      qel.querySelectorAll(".opt").forEach((o) => o.onclick = () => {
        if (answers[qi] !== null) return;
        const oi = +o.dataset.oi; answers[qi] = oi;
        qel.querySelectorAll(".opt").forEach((x) => { x.disabled = true; if (+x.dataset.oi === q.a) x.classList.add("right"); });
        if (oi !== q.a) o.classList.add("wrong");
        const ex = qel.querySelector(".explain"); ex.textContent = (oi === q.a ? "Correct. " : "Not quite. ") + q.e; ex.hidden = false;
        if (answers.every((a) => a !== null)) {
          const score = answers.filter((a, i) => a === l.quiz[i].a).length, total = l.quiz.length;
          const prev = S.quiz[l.id];
          S.quiz[l.id] = { score: Math.max(score, prev ? prev.score : 0), total, ts: Date.now(), lastScore: score };
          if (!S.read[l.id]) S.read[l.id] = Date.now();
          save();
          const r = $("#quiz-result"); r.hidden = false;
          r.innerHTML = `<span class="chip ${score === total ? "mastered" : "read"}">${score}/${total}</span><span class="note">${score === total ? "Lesson mastered." : "Reread the key ideas and try again."}</span><span class="spacer"></span><button class="btn small" id="retry">Try again</button>`;
          $("#retry").onclick = () => { render(); $("#quiz").scrollIntoView({ block: "start" }); };
        }
      });
    });
    const ta = $("#reflect");
    let rt; ta.oninput = () => { clearTimeout(rt); rt = setTimeout(() => { S.reflections[l.id] = ta.value; save(); $("#reflect-note").textContent = "Draft saved"; }, 600); };
    $("#save-reflect").onclick = () => {
      const t = ta.value.trim(); if (!t) { $("#reflect-note").textContent = "Write something first."; return; }
      S.journal.push({ id: "j" + uid(), ts: Date.now(), text: t, lesson: l.id });
      S.reflections[l.id] = ""; ta.value = ""; save();
      $("#reflect-note").textContent = "Saved to your journal.";
    };
  }

  // journal
  const add = $("#j-add");
  if (add) add.onclick = () => {
    const t = $("#j-text").value.trim(); if (!t) { toast("Write something first"); return; }
    S.journal.push({ id: "j" + uid(), ts: Date.now(), text: t.slice(0, 5000), lesson: $("#j-lesson").value || null });
    save(); render(); toast("Entry added");
  };
  const jf = $("#j-filter"); if (jf) jf.onchange = () => { journalFilter = jf.value; render(); };
  m.querySelectorAll("[data-del]").forEach((b) => b.onclick = () => {
    const id = b.dataset.del;
    if (pendingDelete !== id) { pendingDelete = id; render(); return; }
    S.journal = S.journal.filter((j) => j.id !== id); pendingDelete = null; save(); render(); toast("Entry deleted");
  });

  // glossary
  const gq = $("#gloss-q");
  if (gq) gq.oninput = () => { glossQ = gq.value; const pos = gq.selectionStart; render(); const n = $("#gloss-q"); n.focus(); n.setSelectionRange(pos, pos); };

  // data
  if (view === "settings") bindReminders();
  const exp = $("#exp");
  if (exp) exp.onclick = () => {
    const txt = JSON.stringify(S); const box = $("#exp-text"); box.value = txt;
    navigator.clipboard.writeText(txt).then(() => { $("#exp-note").textContent = "Copied to clipboard."; }, () => { box.hidden = false; box.select(); $("#exp-note").textContent = "Copy the selected text below."; });
  };
  const imp = $("#imp");
  if (imp) imp.onclick = () => {
    try { const x = JSON.parse($("#imp-text").value); if (!x || typeof x !== "object" || !x.read) throw 0; S = normalize(x); save(); applyBook(); toast("Backup restored"); go("today"); }
    catch { $("#imp-note").textContent = "That text isn't a valid backup. Paste the full text from Copy backup."; }
  };
  const rs = $("#reset");
  if (rs) rs.onclick = () => {
    if (!resetArmed) { resetArmed = true; render(); return; }
    resetArmed = false; S = blank(); save(); applyBook(); toast("Progress reset"); go("today");
  };
}

document.getElementById("tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-view]"); if (!b) return;
  go(b.dataset.view);
});
document.getElementById("books").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-book]"); if (!b || b.dataset.book === S.bookId) return;
  S.bookId = b.dataset.book; save(); applyBook(); go(view);
});

/* boot */
S = normalize(lsRead());
const h = (location.hash || "").slice(1);
if (BOOKS[h]) S.bookId = h;
applyBook();
if (B.tabs.includes(h)) view = h;
render();
connect();
</script>
