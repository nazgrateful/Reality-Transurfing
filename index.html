o our environment, opening up possibilities previously undreamed of, and this by an orderly sequence of law which is naturally involved in our new mental attitude.", "6. Mind is creative and the principle upon which this law is based is sound and legitimate and is inherent in the nature of things; but this creative power does not originate in the individual, but in the Universal, which is the source and fountain of all energy and substance, the individual is simply the channel for the distribution of this energy. The individual is the means by which the Universal produces the various combinations which result in the formation of phenomena.", "7. We know that scientists have resolved matter into an immense number of molecules; these molecules have been resolved into atoms, and the atoms into electrons. The discovery of electrons in high vacuum glass tubes containing fused terminals of hard metal, indicates conclusively that these electrons fill all space; that they exist everywhere, that they are omnipresent. They fill all material bodies and occupy the whole of what we call empty space. This, then, is the Universal Substance from which all things proceed.", "8. Electrons would forever remain electrons unless directed where to go to be assembled into atoms and molecules, and this director is Mind. A number of electrons revolving around a center of force constitutes an atom; atoms unite in absolutely regular mathematical ratios and form molecules, and these unite with each other to form a multitude of compounds which unite to build the Universe.", "9. The lightest known atom is hydrogen and this is 1,700 times heavier than an electron. An atom of mercury is 300,000 times heavier than an electron. Electrons are pure negative electricity, and as they have the same potential velocity as all other cosmic energy, such as heat, light, electricity and thought, neither time nor space require consideration. The manner in which the velocity of light was ascertained is interesting.", "10. The velocity of light was obtained by the Danish astronomer Roemer in 1676, by observing the eclipses of Jupiter’s moons. When the earth was nearest to Jupiter, the eclipse appeared about eight and one-half minutes too soon for the calculations, and when the earth was most remote from Jupiter, they were about eight and one-half minutes too late. Roemer concluded the reason to be that it required 17 minutes for light from the planet to traverse the diameter of the earth’s orbit, which measured the difference of the distances of the earth from Jupiter. This calculation has since been verified, and proves that light travels about 186,000 miles a second.", "11. Electrons manifest in the body as cells, and possess mind and intelligence sufficient for them to perform their functions in the human physical anatomy. Every part of the body is composed of cells, some of which operate independently; others in communities. Some are busy building tissue, while others are engaged in forming the various secretions necessary for the body. Some act as carriers of material; others are the surgeons whose work it is to repair damage; others are scavengers, carrying off waste; others are constantly ready to repel invaders or other undesirable intruders of the germ family.", "12. All these cells are moving for a common purpose and each one is not only a living organism, but has sufficient intelligence to enable it to perform its necessary duties. It is also endowed with sufficient intelligence to conserve the energies and perpetuate its own life. It must, therefore, secure sufficient nourishment and it has been found that it exercises choice in the selection of such nourishment.", "13. Each cell is born, reproduces itself, dies and is absorbed. The maintenance of health and life itself depends upon the constant regeneration of these cells.", "14. It is therefore apparent that there is mind in every atom of the body; this mind is negative mind, and the power of the individual to think makes him positive, so that he can control this negative mind. This is the scientific explanation for metaphysical healing, and will enable anyone to understand the principle upon which this remarkable phenomenon rests.", "15. This negative mind, which is contained in every cell of the body, has been called the subconscious mind, because it acts without our conscious knowledge. We have found that this subconscious mind is responsive to the will of the conscious mind.", "16. All things have their origin in mind, and appearances are the result of thought. So that we see that things in themselves have no origin, permanency, or reality. Since they are produced by thought, they can be erased by thought.", "17. In mental, as in natural science, experiments are being made and each discovery lifts man one step higher toward his possible goal. We find that every man is the reflection of the thought he has entertained during his lifetime. This is stamped on his face, his form, his character, his environment.", "18. Back of every effect there is a cause, and if we follow the trail to its starting point, we shall find the creative principle out of which it grew. Proofs of this are now so complete that this truth is generally accepted.", "19. The objective world is controlled by an unseen and, heretofore, unexplainable power. We have, heretofore, personalized this power and called it God. We have now, however, learned to look upon it as the permeating essence or Principle of all that exists—the Infinite or Universal Mind.", "20. The Universal Mind, being infinite and omnipotent, has unlimited resources at its command, and when we remember that it is also omnipresent, we cannot escape the conclusion that we must be an expression or manifestation of that Mind.", "21. A recognition and understanding of the resources of the subconscious mind will indicate that the only difference between the subconscious and the Universal is one of degree. They differ only as a drop of water differs from the ocean. They are the same in kind and quality, the difference is one of degree only.", "22. Do you, can you, appreciate the value of this all-important fact; do you realize that a recognition of this tremendous fact places you in touch with Omnipotence? The subconscious mind being the connecting link between the Universal Mind and the conscious mind, is it not evident that the conscious mind can consciously suggest thoughts which the subconscious mind will put into action, and as the subconscious is one with the Universal, is it not evident that no limit can be placed upon its activities?", "23. A scientific understanding of this principle will explain the wonderful results which are secured through the power of prayer. The results which are secured in this way are not brought about by any special dispensations of providence, but on the contrary, they are the result of the operation of a perfectly natural law. There is, therefore, nothing either religious or mysterious about it.", "24. Yet there are many who are not ready to enter into the discipline necessary to think correctly, even though it is evident that wrong thinking has brought failure.", "25. Thought is the only reality; conditions are but the outward manifestations; as the thought changes, all outward or material conditions must change in order to be in harmony with their creator, which is thought.", "26. But the thought must be clear cut, steady, fixed, definite, unchangeable; you cannot take one step forward and two steps backward, neither can you spend twenty or thirty years of your life building up negative conditions as the result of negative thoughts, and then expect to see them all melt away as the result of fifteen or twenty minutes of right thinking.", "27. If you enter into the discipline necessary to bring about a radical change in your life, you must do so deliberately, after giving the matter careful thought and full consideration, and then you must allow nothing to interfere with your decision.", "28. This discipline, this change of thought, this mental attitude will not only bring you the material things which are necessary for your highest and best welfare, but will bring health and harmonious conditions generally.", "29. If you wish harmonious conditions in your life, you must develop an harmonious mental attitude.", "30. Your world without will be a reflection of your world within.", "31. For your exercise this week, concentrate on Harmony, and when I say concentrate, I mean all that the word implies; concentrate so deeply, so earnestly, that you will be conscious of nothing but harmony. Remember, we learn by doing. Reading these lessons will get you nowhere. It is in the practical application that the value consists.", "Learn to keep the door shut, keep out of your mind and out of your world, every element that seeks admittance with no definite helpful end in view.", "George Mathew Adams"], "qa": [{"q": "What is the source of all Wisdom, Power and Intelligence?", "a": "The Universal Mind."}, {"q": "Where do all motion, light, heat and color have their origin?", "a": "In the Universal Energy, which is one manifestation of the Universal Mind."}, {"q": "Where does the creative power of thought originate?", "a": "In the Universal Mind."}, {"q": "What is thought?", "a": "Mind in motion."}, {"q": "How is the Universal differentiated in form?", "a": "The individual is the means by which the Universal produces the various combinations which result in formation of phenomena."}, {"q": "How is this accomplished?", "a": "The power of the individual to think is his ability to act upon the Universal and bring it into manifestation."}, {"q": "What is the first form which the Universal takes so far as we know?", "a": "Electrons, which fill all space."}, {"q": "Where do all things have their origin?", "a": "In mind."}, {"q": "What is the result of a change of thought?", "a": "A change in conditions."}, {"q": "What is the result of a harmonious mental attitude?", "a": "Harmonious conditions in life."}]}, {"id": "mkp-15", "title": "Part Fifteen", "n": 15, "letter": ["Thought, immaterial though it may be, is the matrix that shapes the issues of life. The mind has been active in all fields during this fruitful century, but it is to science we must look for the thoughts that have shaped all thinking.", "Experiments with parasites found on plants indicate that even the lowest order of life is enabled to take advantage of natural law. This experiment was made by Jacques Loch, M.D., Ph. D., a member of the Rockefeller Institute.", "“In order to obtain the material, potted rose bushes are brought into a room and placed in front of a closed window. If the plants are allowed to dry out, the aphids (parasites), previously wingless, change to winged insects. After the metamorphosis, the animals leave the plants, fly to the window and then creep upward on the glass.”", "It is evident that these tiny insects found that the plants on which they had been thriving were dead, and that they could therefore secure nothing more to eat and drink from this source. The only method by which they could save themselves from starvation was to grow temporary wings and fly, which they did.", "Experiments such as these indicate that Omniscience as well as Omnipotence is omnipresent and that the tiniest living thing can take advantage of it in an emergency.", "Part Fifteen will tell you more about the law under which we live. It will explain that these laws operate to our advantage; that all conditions and experiences that come to us are for our benefit; that we gain strength in proportion to the effort expended, and that our happiness is best attained through a conscious cooperation with natural laws."], "body": ["1. The laws under which we live are designed solely for our advantage. These laws are immutable and we cannot escape from their operation.", "2. All the great eternal forces act in solemn silence, but it is in our power to place ourselves in harmony with them and thus express a life of comparative peace and happiness.", "3. Difficulties, inharmonies, and obstacles, indicate that we are either refusing to give out what we no longer need, or refusing to accept what we require.", "4. Growth is attained through an exchange of the old for the new, of the good for the better; it is a conditional or reciprocal action, for each of us is a complete thought entity and this completeness makes it possible for us to receive only as we give.", "5. We cannot obtain what we lack if we tenaciously cling to what we have. We are able to consciously control our conditions as we come to sense the purpose of what we attract, and are able to extract from each experience only what we require for our further growth. Our ability to do this determines the degree of harmony or happiness we attain.", "6. The ability to appropriate what we require for our growth, continually increases as we reach higher planes and broader visions, and the greater our abilities to know what we require, the more certain we shall be to discern its presence, to attract it and to absorb it. Nothing may reach us except what is necessary for our growth.", "7. All conditions and experiences that come to us do so for our benefit. Difficulties and obstacles will continue to come until we absorb their wisdom and gather from them the essentials of further growth.", "8. That we reap what we sow is mathematically exact. We gain permanent strength exactly to the extent of the effort required to overcome difficulties.", "9. The inexorable requirements of growth demand that we exert the greatest degree of attraction for what is perfectly in accord with us. Our highest happiness will be best attained through our understanding of, and conscious cooperation with natural laws.", "10. In order to possess vitality thought must be impregnated with love. Love is a product of the emotions. It is therefore essential that the emotions be controlled and guided by the intellect and reason.", "11. It is love which imparts vitality to thought and thus enables it to germinate. The law of attraction, or the law of love, for they are one and the same, will bring to it the necessary material for its growth and maturity.", "12. The first form which thought will find is language, or words; this determines the importance of words; they are the first manifestation of thought—the vessels in which thought is carried. They take hold of the ether and by setting it in motion reproduce the thought to others in the form of sound.", "13. Thought may lead to action of any kind, but whatever the action, it is simply the thought attempting to express itself in visible form. It is evident, therefore, that if we wish desirable conditions, we can afford to entertain only desirable thoughts.", "14. This leads to the inevitable conclusion that if we wish to express abundance in our lives, we can afford to think abundance only, and as words are only thoughts taking form, we must be especially careful to use nothing but constructive and harmonious language, which when finally crystallized into objective forms, will prove to our advantage.", "15. We cannot escape from the pictures we incessantly photograph on the mind, and this photography of erroneous conceptions is exactly what is being done by the use of words, when we use any form of language which is not identified with our welfare.", "16. We manifest more and more life as our thought becomes clarified and takes higher planes. This is obtained with greater facility as we use word pictures that are clearly defined, and relieved of the conceptions attached to them on lower planes of thought.", "17. It is with words that we must express our thoughts, and if we are to make use of higher forms of truth, we may use only such material as has been carefully and intelligently selected with this purpose in view.", "18. This wonderful power of clothing thoughts in the form of words is what differentiates man from the rest of the animal kingdom; by the use of the written word he has been enabled to look back over the centuries and see the stirring scenes by which he has come into his present inheritance.", "19. He has been enabled to come into communion with the greatest writers and thinkers of all time, and the combined record which we possess today is therefore the expression of Universal Thought as it has been seeking to take form in the mind of Man.", "20. We know that the Universal Thought has for its goal the creation of form, and we know that the individual thought is likewise forever attempting to express itself in form, and we know that the word is a thought form, and a sentence is a combination of thought forms, therefore, if we wish our ideal to be beautiful or strong, we must see that the words out of which this temple will eventually be created are exact, that they are put together carefully, because accuracy in building words and sentences is the highest form of architecture in civilization and is a passport to success.", "21. Words are thoughts and are therefore an invisible and invincible power which will finally objectify themselves in the form they are given.", "22. Words may become mental places that will live forever, or they may become shacks which the first breeze will carry away. They may delight the eye as well as the ear; they may contain all knowledge; in them we find the history of the past as well as the hope of the future; they are living messengers from which every human and superhuman activity is born.", "23. The beauty of the word consists in the beauty of the thought; the power of the word consists in the power of the thought, and the power of the thought consists in its vitality. How shall we identify a vital thought? What are its distinguishing characteristics? It must have principle. How shall we identify principle?", "24. There is a principle of Mathematics, but none of error; there is a principle of health, but none of disease; there is a principle of truth, but none of dishonesty; there is a principle of light, but none of darkness, and there is a principle of abundance, but none of poverty.", "25. How shall we know that this is true? Because if we apply the principle of Mathematics correctly we shall be certain of our results. Where there is health there will be no disease. If we know the Truth we cannot be deceived by error. If we let in light there can be no darkness, and where there is abundance there can be no poverty.", "26. These are self-evident facts, but the all-important truth that a thought containing principle is vital and therefore contains life and consequently takes root, and eventually but surely and certainly displaces the negative thoughts, which by their very nature can contain no vitality, is one which seems to have been overlooked.", "27. But this is a fact which will enable you to destroy every manner of discord, lack and limitation.", "28. There can be no question but that he who “is wise enough to understand” will readily recognize that the creative power of thought places an invincible weapon in his hands and makes him a master of destiny.", "29. In the physical world there is a law of compensation which is that “the appearance of a given amount of energy anywhere means the disappearance of the same amount somewhere else,” and so we find that we can get only what we give; if we pledge ourselves to a certain action we must be prepared to assume the responsibility for the development of that action. The subconscious cannot reason. It takes us at our word; we have asked for something; we are now to receive it; we have made our bed, we are now to lie in it; the die has been cast; the threads will carry out the pattern we have made.", "30. For this reason Insight must be exercised so that the thought which we entertain contains no mental, moral or physical germ which we do not wish objectified in our lives.", "31. Insight is a faculty of the mind whereby we are enabled to examine facts and conditions at long range, a kind of human telescope; it enables us to understand the difficulties, as well as the possibilities, in any undertaking.", "32. Insight enables us to be prepared for the obstacles which we shall meet; we can therefore overcome them before they have any opportunity of causing difficulty.", "33. Insight enables us to plan to advantage and turn our thought and attention in the right direction, instead of into channels which can yield no possible return.", "34. Insight is therefore absolutely essential for the development of any great achievement, but with it we may enter, explore and possess any mental field.", "35. Insight is a product of the world within and is developed in the Silence, by concentration.", "36. For your exercise this week, concentrate on Insight; take your accustomed position and focus the thought on the fact that to have a knowledge of the creative power of thought does not mean to possess the art of thinking. Let the thought dwell on the fact that knowledge does not apply itself. That our actions are not governed by knowledge, but by custom, precedent and habit. That the only way we can get ourselves to apply knowledge is by a determined conscious effort. Call to mind the fact that knowledge unused passes from the mind, that the value of the information is in the application of the principle; continue this line of thought until you gain sufficient insight to formulate a definite program for applying this principle to your own particular problem.", "Think truly, and thy thoughts Shall the world’s famine feed; Speak truly, and each word of thine Shall be a fruitful seed; Live truly, and thy life shall be A great and noble creed.", "Horatio Bonar"], "qa": [{"q": "What determines the degree of harmony which we attain?", "a": "Our ability to appropriate what we require for our growth from each experience."}, {"q": "What do difficulties and obstacles indicate?", "a": "That they are necessary for our wisdom and spiritual growth."}, {"q": "How may these difficulties be avoided?", "a": "By a conscious understanding of and cooperation with Natural laws."}, {"q": "What is the principle by which thought manifests itself in form?", "a": "The Law of Attraction."}, {"q": "How is the necessary material secured by which the growth, development and maturity of the idea take form?", "a": "The law of love, which is the creative principle of the Universe, imparts vitality to the thought, and the law of attraction brings the necessary substance by the law of growth."}, {"q": "How are desirable conditions secured?", "a": "By entertaining desirable thoughts only."}, {"q": "How are undesirable conditions brought about?", "a": "By thinking, discussing and visualizing conditions of lack, limitation, disease, inharmony and discord of every kind. This mental photography of erroneous conceptions is taken up by the subconscious and the law of attraction will inevitable crystallize it into objective form. That we reap what we sow is scientifically exact."}, {"q": "How can we overcome every kind of fear, lack, limitation, poverty and discord?", "a": "By substituting principle for error."}, {"q": "How may we recognize principle?", "a": "By a conscious realization of the fact that Truth invariably destroys error. We do not have to laboriously shovel the darkness out; all that is necessary is to turn on the light. The same principle applies to every form of negative thought."}, {"q": "What is the value of Insight?", "a": "It enables us to understand the value of making application of the knowledge which we gain. Many seem to think that knowledge will automatically apply itself, which is by no means true."}]}, {"id": "mkp-16", "title": "Part Sixteen", "n": 16, "letter": ["To every man there openeth a way, And the high soul climbs the high way, And the low soul gropes the low; And in between on the misty flats, The rest drift to and fro. But to every man there openeth A high way and a low And every man decideth The way his soul shall go", "The vibratory activities of the planetary Universe are governed by a law of periodicity. Everything that lives has periods of birth, growth, fruitage, and decline. These periods are governed by the Septimal Law.", "The Law of Sevens governs the days of the week, the phases of the moon, the harmonies of sound, light, heat, electricity, magnetism, atomic structure. It governs the life of individuals and of nations, and it dominates the activities of the commercial world.", "Life is growth, and growth is change, each seven years period takes us into a new cycle. The first seven years is the period of infancy. The next seven the period of childhood, representing the beginning of individual responsibility. The next seven represents the period of adolescence. The fourth period marks the attainment of full growth. The fifth period is the constructive period, when men begin to acquire property, possessions, a home and family. The next from 35 to 42, is a period of reactions and changes, and this in turn is followed by a period of reconstruction, adjustment and recuperation, so as to be ready for a new cycle of sevens, beginning with the fiftieth year.", "There are many who think that the world is just bout to pass out of the sixth period; that it will soon enter into the seventh period, the period of readjustment, reconstruction and harmony; the period which is frequently referred to as the Millennium.", "Those familiar with these cycles will not be disturbed when things seem to go wrong, but can apply the principle outlined in these lessons with the full assurance that a higher law will invariably control all other laws, and that through an understanding and conscious operation of spiritual laws, we can convert every seeming difficulty into a blessing."], "body": ["1. Wealth is a product of labor. Capital is an effect, not a cause; a servant, not a master; a means, not an end.", "2. The most commonly accepted definition of wealth is that it consists of all useful and agreeable things which possess exchange value. It is this exchange value which is the predominant characteristic of wealth.", "3. When we consider the small addition made by wealth to the happiness of the possessor, we find that the true value consists not in its utility but in its exchange.", "4. This exchange value makes it a medium for securing the things of real value whereby our ideals may be realized.", "5. Wealth should then never be desired as an end, but simply as a means of accomplishing an end. Success is contingent upon a higher ideal than the mere accumulation of riches, and he who aspires to such success must formulate an ideal for which he is willing to strive.", "6. With such an ideal in mind, the ways and means can and will be provided, but the mistake must not be made of substituting the means for the end. There must be a definite fixed purpose, an ideal.", "7. Prentice Mulford said: “The man of success is the man possessed of the greatest spiritual understanding and every great fortune comes of superior and truly spiritual power.” Unfortunately, there are those who fail to recognize this power; they forget that Andrew Carnegie’s mother had to help support the family when they came to America, that Harriman’s father was a poor clergyman with a salary of only $200 a year, that Sir Thomas Lipton started with only 25 cents. These men had no other power to depend upon, but it did not fail them.", "8. The power to create depends entirely upon spiritual power; there are three steps, idealization, visualization and materialization. Every captain of industry depends upon this power exclusively. In an article in Everybody’s Magazine, Henry M. Flagler, the Standard Oil multi-millionaire, admitted that the secret of his success was his power to see a thing in its completeness. The following conversation with the reporter shows his power of idealization, concentration and visualization, all spiritual powers:", "9. “Did you actually vision to yourself the whole thing? I mean, did you, or could you, really close your eyes and see the tracks? And the trains running? And hear the whistles blowing? Did you go as far as that?” “Yes.” “How clearly?” “Very clearly.”", "10. Here we have a vision of the law, we see “cause and effect”, we see that thought necessarily precedes and determines action. If we are wise, we shall come into a realization of the tremendous fact that no arbitrary condition can exist for a moment, and that human experience is the result of an orderly and harmonious sequence.", "11. The successful businessman is more often than not an idealist and is every striving for higher and higher standards. The subtle forces of thought as they crystallize in our daily moods is what constitutes life.", "12. Thought is the plastic material with which we build images of our growing conception of life. Use determines its existence. As in all other things our ability to recognize it and use it properly is the necessary condition for attainment.", "13. Premature wealth is but the forerunner of humiliation and disaster, because we cannot permanently retain anything which we do not merit or which we have not earned.", "14. The conditions with which we meet in the world without, correspond to the conditions which we find in the world within. This is brought about by the law of attraction. How then shall we determine what is to enter into the world within?", "15. Whatever enters the mind through the senses or the objective mind will impress the mind and result in a mental image which will become a pattern for the creative energies. These experiences are largely the result of environment, chance, past thinking and other forms of negative thought, and must be subjected to careful analysis before being entertained. On the other hand, we can form our own mental images, through our own interior processes of thought regardless of the thoughts of others, regardless of exterior conditions, regardless of environment of every kind, and it is by the exercise of this power that we can control our own destiny, body, mind and soul.", "16. It is by the exercise of this power that we take our fate out of the hands of chance, and consciously make for ourselves the experiences which we desire, because when we consciously realize a condition, that condition will eventually manifest in our lives; it is therefore evident that in the last analysis thinking is the one great cause in life.", "17. Therefore, to control thought is to control circumstances, conditions, environment, and destiny.", "18. How then are we to control thought; what is the process? To think is to create a thought, but the result of the thought will depend upon its form, its quality and its vitality.", "19. The form will depend upon the mental images from which it emanates; this will depend upon the depth of the impression, the predominance of the idea, the clarity of the vision, the boldness of the image.", "20. The quality depends upon its substance, and this depends upon the material of which the mind is composed; if this material has been woven from thoughts of vigor, strength, courage, determination, the thought will possess these qualities.", "21. And finally, the vitality depends upon the feeling with which the thought is impregnated. If the thought is constructive, it will possess vitality; it will have life, it will grow, develop, expand, it will be creative; it will attract to itself everything necessary for its complete development.", "22. If the thought is destructive, it will have within itself the germ of its own dissolution; it will die, but in the process of dying, it will bring sickness, disease, and every other form of discord.", "23. This we call evil, and when we bring it upon ourselves, some of us are disposed to attribute our difficulties to a Supreme Being, but this supreme being is simply Mind in equilibrium.", "24. It is neither good nor bad, it simply is.", "25. Our ability to differentiate it into form is our ability to manifest good or evil.", "26. Good and evil therefore are not entities, they are simply words which we use to indicate the result of our actions, and these actions are in turn predetermined by the character of our thought.", "27. If our thought is constructive and harmonious we manifest good; if it is destructive and discordant we manifest evil.", "28. If you desire to visualize a different environment, the process is simply to hold the ideal in mind, until your vision has been made real; give no thought to persons, places or things; these have no place in the absolute; the environment you desire will contain everything necessary; the right persons, and the right things will come at the right time and in the right place.", "29. It is sometimes not plain how character, ability, attainment, achievement, environment and destiny can be controlled through the power of visualization, but this is an exact scientific fact.", "30. You will readily see that what we think determines the quality of mind, and that the quality of mind in turn determines our ability and mental capacity, and you can readily understand that the improvement in our ability will naturally be followed by increase in attainment and a greater control of circumstances.", "31. It will thus be seen that Natural laws work in a perfectly natural and harmonious manner; everything seems to “just happen.” If you want any evidence of this fact simply compare results of your efforts in your own life, when your actions were prompted by high ideals and when you had selfish or ulterior motives in mind. You will need no further evidence.", "32. If you wish to bring about the realization of any desire, form a mental picture of success in your mind, by consciously visualizing your desire; in this way you will be compelling success, you will be externalizing it in your life by scientific methods.", "33. We can only see what already exists in the objective world, but what we visualize, already exists in the spiritual world, and this visualization is a substantial token of what will one day appear in the objective world, if we are faithful to our ideal. The reason for this is not difficult; visualization is a form of imagination; this process of thinking forms impressions on the mind, and these impressions in turn form concepts and ideals, and they in turn are the plans from which the Master architect will weave the future.", "34. The psychologists have come to the conclusion that there is but one sense, the sense of feeling, and that all other senses are but modifications of this one sense; this being true, we know why feeling is the very fountain head of power, why the emotions so easily overcome the intellect, and why we must put feeling into our thought, if we wish results. Thought and feeling is the irresistible combination.", "35. Visualization must, of course, be directed by the will; we are to visualize exactly what we want; we must be careful not to let the imagination run riot. Imagination is a good servant but a poor master, and unless it is controlled it may easily lead us into all kinds of speculations and conclusions which have no basis or foundation of fact whatever. Every kind of plausible opinion is liable to be accepted without any analytical examination and the inevitable result is mental chaos.", "36. We must therefore construct only such mental images as are known to be scientifically true. Subject every idea to a searching analysis and accept nothing which is not scientifically exact. When you do this you will attempt nothing but what you know you can carry out and success will crown your efforts; this is what businessmen call far-sightedness; it is much the same as insight, and is one of the great secrets of success in all important undertakings.", "37. For your exercise this week, try to bring yourself to a realization of the important fact that harmony and happiness are states of consciousness and do not depend upon the possession of things. That things are effects and come as a consequence of correct mental states. So that if we desire material possession of any kind our chief concern should be to acquire the mental attitude which will bring about the result desired. This mental attitude is brought about by a realization of our spiritual nature and our unity with the Universal Mind which is the substance of all things. This realization will bring about everything which is necessary for our complete enjoyment. This is scientific or correct thinking. When we succeed in bringing about this mental attitude it is comparatively easy to realize our desire as an already accomplished fact; when we can do this we shall have found the “Truth” which makes us “free” from every lack or limitation of any kind.", "A man might frame and let loose a star, to roll in its orbit, and yet not have done so memorable a thing before God as he who lets a golden-orbed thought to roll through the generations of time.", "H. W. Beecher"], "qa": [{"q": "Upon what does wealth depend?", "a": "Upon an understanding of the creative nature of thought."}, {"q": "Upon what does its true value consist?", "a": "Upon its exchange value."}, {"q": "Upon what does success depend?", "a": "Upon spiritual power."}, {"q": "Upon what does this power depend?", "a": "Upon use; use determines its existence."}, {"q": "How may we take our fate out of the hands of chance?", "a": "By consciously realizing the conditions which we desire to see manifested in our lives."}, {"q": "What then is the great business of life?", "a": "Thinking."}, {"q": "Why is this so?", "a": "Because thought is spiritual and therefore creative. To consciously control thought is therefore to control circumstances, conditions, environment and destiny."}, {"q": "What is the source of all evil?", "a": "Destructive thinking."}, {"q": "What is the source of all good?", "a": "Scientific correct thinking."}, {"q": "What is scientific thinking?", "a": "A recognition of the creative nature of spiritual energy and our ability to control it."}]}, {"id": "mkp-17", "title": "Part Seventeen", "n": 17, "letter": ["The greatest events of an age are its best thoughts. It is the nature of thought to find its way into action.", "Bovee", "The kind of Deity which a man, consciously or unconsciously, worships, indicates the intellectual status of the worshipper.", "Ask the Indian of God, and he will describe to you a powerful chieftain of a glorious tribe. Ask the Pagan of God, and he will tell you of a God of fire, a God of water, a god of this, that, and the other.", "Ask the Israelite of God, and he will tell you of the God of Moses, who conceived it expedient to rule by coercive measures; hence, the Ten Commandments. Or of Joshua, who led the Israelites into battle, confiscated property, murdered the prisoners, and laid waste to cities.", "The so-called heathen made “graven images” of their Gods, whom they were accustomed to worship, but among the most intelligent, at least, these images were but the visible fulcrums with which they were enabled to mentally concentrate on the qualities which they desired to externalize in their lives.", "We of the twentieth century worship a God of Love in theory, but in practice we make for ourselves “graven images” of “Wealth,” “Power,” “Fashion,” “Custom” and “Conventionality.” We “fall down” before them and worship them. We concentrate on them and they are thereby externalized in our lives.", "The student who masters the contents of Part Seventeen will not mistake the symbols for the reality; he will be interested in causes, rather than effects. He will concentrate on the realities of life, and will then not be disappointed in the results."], "body": ["1. We are told that Man has “dominion over all things”; this dominion is established through Mind. Thought is the activity which controls every principle beneath it. The highest principle by reason of its superior essence and qualities necessarily determines the circumstances, aspects and relation of everything with which it comes in contact.", "2. The vibrations of mental forces are the finest and consequently the most powerful in existence. To those who perceive the nature and transcendency of mental force, all physical power sinks into insignificance.", "3. We are accustomed to look upon the Universe with a lens of five senses, and from these experiences our anthropomorphic conceptions originate, but true conceptions are only secured by spiritual insight. This insight requires a quickening of the vibrations of the Mind, and is only secured when the mind is continuously concentrated in a given direction.", "4. Continuous concentration means an even, unbroken flow of thought and is the result of patient, persistent, persevering and well-regulated system.", "5. Great discoveries are the result of long-continued investigation. The science of mathematics requires years of concentrated effort to master it, and the greatest science—that of the Mind—is revealed only through concentrated effort.", "6. Concentration is much misunderstood; there seems to be an idea of effort or activity associated with it, when just the contrary is necessary. The greatness of an actor lies in the fact that he forgets himself in the portrayal of his character, becoming so identified with it, that the audience is swayed by the realism of the performance. This will give you a good idea of true concentration; you should be so interested in your thought, so engrossed in your subject, as to be conscious of nothing else. Such concentration leads to intuitive perception and immediate insight into the nature of the object concentrated upon.", "7. All knowledge is the result of concentration of this kind; it is thus that the secrets of Heaven and Earth have been wrested; it is thus that the mind becomes a magnet and the desire to know draws the knowledge, irresistibly attracts it, makes it your own.", "8. Desire is largely subconscious; conscious desire rarely realizes its object when the latter is out of immediate reach. Subconscious desire arouses the latent faculties of the mind, and difficult problems seem to solve themselves.", "9. The subconscious mind may be aroused and brought into action in any direction and made to serve us for any purpose, by concentration. The practice of concentration requires the control of the physical, mental, and physical being; all modes of consciousness whether physical, mental, or physical, must be under control.", "10. Spiritual Truth is therefore the controlling factor; it is this which will enable you to grow out of limited attainment and reach a point where you will be able to translate modes of thought into character and consciousness.", "11. Concentration does not mean mere thinking of thoughts, but the transmutation of these thoughts into practical values; the average person has no conception of the meaning of concentration. There is always the cry “to have” but never the cry “to be”; they fail to understand that they cannot have one without the other, that they must first find the “kingdom” before they can have the “things added.” Momentary enthusiasm is of no value; it is only with unbounded self-confidence that the goal is reached.", "12. The mind may place the ideal a little too high and fall short of the mark; it may attempt to soar on untrained wings and instead of flying, fall to earth; but that is no reason for not making another attempt.", "13. Weakness is the only barrier to mental attainment; attribute your weakness to physical limitations or mental uncertainties and try again; ease and perfection are gained by repetition.", "14. The astronomer centers his mind on the stars and they give forth their secrets; the geologists centers his mind on the construction of the earth and we have geology; so with all things. Men center their minds on the problems of life, and the result is apparent in the vast and complex social order of the day.", "15. All mental discovery and attainment are the result of desire plus concentration; desire is the strongest mode of action; the more persistent the desire, the more authoritative the revelation. Desire added to concentration will wrench any secret from nature.", "16. In realizing great thoughts, in experiencing great emotions that correspond with great thoughts, the mind is in a state where it appreciates the value of higher things.", "17. The intensity of one moment’s earnest concentration and the intense longing to become and to attain may take you further than years of slow normal and forced effort; it will unfasten the prison bars of unbelief, weakness, impotence and self-belittlement, and you will come into a realization of the joy of overcoming.", "18. The spirit of initiative and originality is developed through persistence and continuity of mental effort. Business teaches the value of concentration and encourages decision of character; it develops practical insight and quickness of conclusion. The mental element in every commercial pursuit is dominant as the controlling factor, and desire is the predominating force; all commercial relations are the externalization of desire.", "19. Many of the sturdy and substantial virtues are developed in commercial employment; the mind is steadied and directed; it becomes efficient. The principal necessity is the strengthening of the mind so that it rises superior to the distractions and wayward impulses of instinctive life and thus successfully overcomes in the conflict between the higher and lower self.", "20. All of us are dynamos, but the dynamo of itself is nothing; the mind must work the dynamo; then it is useful and its energy can be definitely concentrated. The mind is an engine whose power is undreamed; thought is an omni-working power. It is the ruler and creator of all form and all events occurring in form. Physical energy is nothing in comparison with the omnipotence of thought, because thought enables man to harness all other natural power.", "21. Vibration is the action of thought; it is vibration which reaches out and attracts the material necessary to construct and build. There is nothing mysterious concerning the power of thought; concentration simply implies that consciousness can be focalized to the point where it becomes identified with the object of its attention. As food absorbed is the essence of the body, so the mind absorbs the object of its attention, gives it life and being.", "22. If you concentrate on some matter of importance, the intuitive power will be set in operation, and help will come in the nature of information which will lead to success.", "23. Intuition arrives at conclusions without the aid of experience or memory. Intuition often solves problems that are beyond the grasp of the reasoning power. Intuition often comes with a suddenness that is startling; it reveals the truth for which we are searching, so directly that it seems to come from a higher power. Intuition can be cultivated and developed; in order to do this it must be recognized and appreciated; if the intuitive visitor is given a royal welcome when he comes, he will come again; the more cordial the welcome the more frequent his visits will become, but if he is ignored or neglected he will make his visits few and far apart.", "24. Intuition usually comes in the Silence; great minds seek solitude frequently; it is here that all the larger problems of life are worked out. For this reason every businessman who can afford it has a private office, where he will not be disturbed; if you cannot afford a private office you can at least find somewhere, where you can be alone a few minutes each day, to train the thought along lines which will enable you to develop that invincible power which is necessary to achieve.", "25. Remember that fundamentally the subconscious is omnipotent; there is no limit to the things that can be done when it is given the power to act. Your degree of success is determined by the nature of your desire. If the nature of your desire is in harmony with Natural Law or the Universal Mind, it will gradually emancipate the mind and give you invincible courage.", "26. Every obstacle conquered, every victory gained, will give you more faith in your power, and you will have greater ability to win. Your strength is determined by your mental attitude; if this attitude is one of success, and is permanently held with an unswerving purpose, you will attract to you from the invisible domain the things you silently demand.", "27. By keeping the thought in mind, it will gradually take tangible form. A definite purpose sets causes in motion which go out in the invisible world and find the material necessary to serve your purpose.", "28. You may be pursuing the symbols of power, instead of power itself. You may be pursuing fame instead of honor, riches instead of wealth, position instead of servitude; in either event you will find that they turn to ashes just as you overtake them.", "29. Premature wealth or position cannot be retained because it has not been earned; we get only what we give, and those who try to get without giving always find that the law of compensation is relentlessly bringing about an exact equilibrium.", "30. The race has usually been for money and other mere symbols of power, but with an understanding of the true source of power, we can afford to ignore the symbols. The man with a large bank account finds it unnecessary to load his pockets down with gold; so with the man who has found the true source of power; he is no longer interested in its shams or pretensions.", "31. Thought ordinarily leads outwardly in evolutionary directions, but it can be turned within where it will take hold of the basic principles of things, the heart of things, the spirit of things. When you get to the heart of things it is comparatively easy to understand and command them.", "32. This is because the Spirit of a thing is the thing itself, the vital part of it, the real substance. The form is simply the outward manifestation of the spiritual activity within.", "33. For your exercise this week concentrate as nearly as possible in accordance with the method outlined in this lesson; let there be no conscious effort or activity associated with your purpose. Relax completely, avoid any thought of anxiety as to results. Remember that power comes through repose. Let the thought dwell upon your object, until it is completely identified with it, until you are conscious of nothing else.", "34. If you wish to eliminate fear, concentrate on courage.", "35. If you wish to eliminate lack, concentrate on abundance.", "36. If you wish to eliminate disease, concentrate on health.", "37. Always concentrate on the ideal as an already existing fact; this is the germ cell, the life principle which goes forth and sets in motion those causes which guide, direct and bring about the necessary relation, which eventually manifest in form.", "Thought is the property of those only who can entertain it.", "Emerson"], "qa": [{"q": "What is the true method of concentration?", "a": "To become so identified with the object of your thought that you are conscious of nothing else."}, {"q": "What is the result of this method of concentration?", "a": "Invisible forces are set in motion which irresistibly bring about conditions in correspondence with your thought."}, {"q": "What is the controlling factor in this method of thought?", "a": "Spiritual Truth."}, {"q": "Why is this so?", "a": "Because the nature of our desire must be in harmony with Natural Law."}, {"q": "What is the practical value of this method of concentration?", "a": "Thought is transmuted into character, and character is the magnet which creates the environment of the individual."}, {"q": "What is the controlling factor in every commercial pursuit?", "a": "The mental element."}, {"q": "Why is this so?", "a": "Because Mind is the ruler and creator of all form and all events occurring in form."}, {"q": "How does concentration operate?", "a": "By the development of the powers of perception, wisdom, intuition, and sagacity."}, {"q": "Why is intuition superior to reason?", "a": "Because it does not depend upon experience or memory and frequently brings about the solution to our problems by methods concerning which we are in entire ignorance."}, {"q": "What is the result of pursuing the symbol of the reality?", "a": "They frequently turn to ashes just as we overtake them, because the symbol is only the outward form of the spiritual activity within, therefore unless we can possess the spiritual reality, the form disappears."}]}, {"id": "mkp-18", "title": "Part Eighteen", "n": 18, "letter": ["In order to grow we must obtain what is necessary for our growth. This is brought about through the law of attraction. This principle is the sole means by which the individual is differentiated from the Universal.", "Think for a moment, what would a man be if he were not a husband, father, or brother, if he were not interested in the social, economical, political or religious world. He would be nothing but an abstract theoretical ego. He exists, therefore, only in his relation to the whole, in his relation to other men, in his relation to society. This relation constitutes his environment and in no other way.", "It is evident, therefore, that the individual is simply the differentiation of the one Universal Mind “which lighteth every man that cometh into the world,” and his so-called individuality or personality consists of nothing but the manner in which he relates with the whole.", "This we call his environment and is brought about by the law of attraction. Part Eighteen, which follows, has something more to say concerning this important law."], "body": ["1. There is a change in the thought of the world. This change is silently transpiring in our midst, and is more important than any which the world has undergone since the downfall of Paganism.", "2. These present revolution in the opinions of all classes of men, the highest and most cultured of men as well as those of the laboring class, stands unparalleled in the history of the world.", "3. Science has of late made such vast discoveries, has revealed such an infinity of resources, has unveiled such enormous possibilities and such unsuspected forces, that scientific men more and more hesitate to affirm certain theories as established and beyond doubt or to deny other theories as absurd or impossible.", "4. A new civilization is being born; customs, creeds, and precedent are passing; vision, faith and service are taking their place. The fetters of tradition are being melted off from humanity, and as the impurities of materialism are being consumed, thought is being liberated and truth is rising full robed before an astonished multitude.", "5. The whole world is on the eve of a new consciousness, a new power, and a new realization within the self.", "6. Physical Science has resolved matter into molecules, molecules into atoms, atoms into energy, and it has remained for Mr. J. A. Fleming, in an address before the Royal Institution, to resolve this energy into mind. He says, “In its ultimate essence, energy may be incomprehensible by us except as an exhibition of the direct operation of that which we call Mind or Will.”", "7. And this mind is the indwelling and ultimate. It is imminent in matter as in spirit. It is the sustaining, energizing, all pervading Spirit of the universe.", "8. Every living thing must be sustained by this omnipotent Intelligence, and we find the difference in individual lives to be largely measured by the degree of this intelligence, which they manifest. It is greater intelligence that places the animal in a higher scale of being than the plant, the man higher than the animal, and we find that this increased intelligence is again indicated by the power of the individual to control modes of action and thus to consciously adjust himself to his environment.", "9. It is this adjustment that occupies the attention of the greatest minds, and this adjustment consists in nothing else than the recognition of an existing order in the universal mind, for it is well known that this mind will obey us precisely in proportion as we first obey it.", "10. It is the recognition of Natural Laws that has enabled us to annihilate time and space, to soar in the air and to make iron float, and the greater the degree of intelligence the greater will be our recognition of these Natural Laws and the greater will be the power we can possess.", "11. It is the recognition of the self as an individualization of this Universal Intelligence that enables the individual to control those forms of intelligence which have not yet reached this level of self-recognition; they do not know that this Universal Intelligence permeates all things ready to be called into action; they do not know that it is responsive to every demand, and they are therefore in bondage to the law of their own being.", "12. Thought is creative and the principle on which the law is based is sound and legitimate and is inherent in the nature of things; but this creative power does not originate in the individual, but in the universal, which is the source and foundation of all energy and substance; the individual is simply the channel for the distribution of this energy.", "13. The individual is simply the means by which the universal produces the various combinations which result in the formation of phenomena, which depends upon the law of vibration, whereby various rates of rapidity of motion in the primary substance form new substances only in certain exact numerical ratios.", "14. Thought is the invisible link by which the individual comes into communication with the Universal, the finite with the Infinite, the seen with the Unseen. Thought is the magic by which the human is transformed into a being who thinks and knows and feels and acts.", "15. As the proper apparatus has enabled the eye to discover worlds without number millions of miles away, so, with the proper understanding, man has been enabled to communicate with the Universal Mind, the source of all power.", "16. The Understanding which is usually developed is about as valuable as a VCR without a videotape; in fact, it is usually nothing more than a “belief”, which means nothing at all. The savages of the Cannibal Islands believe something; but that proves nothing.", "17. The only belief which is of any value to anyone is a belief that has been put to a test and demonstrated to be a fact; it is then no longer a belief, but has become a living Faith or Truth.", "18. And this Truth has been put to the test by hundreds of thousands of people and has been found to be the Truth exactly in proportion to the usefulness of the apparatus which they used.", "19. A man would not expect to locate stars hundreds of millions of miles away without a sufficiently strong telescope, and for this reason Science is continually engaged in building larger and more powerful telescopes and is continually rewarded by additional knowledge of the heavenly bodies.", "20. So with understanding; men are continually making progress in the methods which they use to come into communication with the Universal Mind and its infinite possibilities.", "21. The Universal Mind manifests itself in the objective, through the principle of attraction that each atom has for every other atom, in infinite degrees of intensity.", "22. It is by this principle of combining and attracting that things are brought together. This principle is of universal application and is the sole means whereby the purpose of existence is carried into effect.", "23. The expression of growth is met in a most beautiful manner through the instrumentality of this Universal Principle.", "24. In order to grow we must obtain what is essential for our growth, but as we are at all times a complete thought entity, this completeness makes it possible for us to receive only as we give; growth is therefore conditioned on reciprocal action, and we find that on the mental plane like attracts like, that mental vibrations respond only to the extent of their vibratory harmony.", "25. It is clear, therefore, that thoughts of abundance will respond only to similar thoughts; the wealth of the individual is seen to be what he inherently is. Affluence within is found to be the secret of attraction for affluence without. The ability to produce is found to be the real source of wealth of the individual. It is for this reason that he who has his heart in his work is certain to meet with unbounded success. He will give and continually give; and the more he gives, the more he will receive.", "26. What do the great financiers of Wall Street, the captains of industry, the statesmen, the great corporation attorneys, the inventors, the physicians, the authors—what do each of these contribute to the sum of human happiness but the power of their thought?", "27. Thought is the energy which the law of attraction is brought into operation, which eventually manifests in abundance.", "28. The Universal Mind is static Mind or Substance in equilibrium. It is differentiated into form by our power to think. Thought is the dynamic phase of mind.", "29. Power depends upon consciousness of power; unless we use it, we shall lose it, and unless we are conscious of it, we cannot use it.", "30. The use of this power depends upon attention; the degree of attention determines our capacity for the acquirement of knowledge which is another name for power.", "31. Attention has been held to be the distinguishing mark of genius. The cultivation of attention depends upon practice.", "32. The incentive of attention is interest; the greater the interest, the greater the attention; the greater the attention, the greater the interest, action and reaction; begin by paying attention; before long you will have aroused interest; this interest will attract more attention, and this attention will produce more interest, and so on. This practice will enable you to cultivate the power of attention.", "33. This week concentrate upon your power to create; seek insight, perception; try to find a logical basis for the faith which is in you. Let the thought dwell on the fact that the physical man lives and moves and has his being in the sustainer of all organic life air, that he must breathe to live. Then let the thought rest on the fact that the spiritual man also lives and moves and has his being in a similar but subtler energy upon which he must depend for life, and that as in the physical world no life assumes form until after a seed is sown, and no higher fruit than that of the parent stock can be produced; so in the spiritual world no effect can be produced until the seed is sown and the fruit will depend upon the nature of the seed, so that the results which you secure depend upon your perception of law in the mighty domain of causation, the highest evolution of human consciousness.", "There is no thought in my mind but it quickly tends to convert itself into a power and organizes a huge instrumentality of means.", "Emerson"], "qa": [{"q": "How is the difference in individual lives measured?", "a": "By the degree of intelligence which they manifest."}, {"q": "What is the law by which the individual may control other forms of intelligence?", "a": "A recognition of the self as an individualization of the Universal Intelligence."}, {"q": "Where does the creative power originate?", "a": "In the Universal."}, {"q": "How does the Universal create form?", "a": "By means of the individual."}, {"q": "What is the connecting link between the individual and the Universal?", "a": "Thought."}, {"q": "What is the principle by which the means of existence is carried into effect?", "a": "The Law of Love."}, {"q": "How is this principle brought into expression?", "a": "By the law of growth."}, {"q": "Upon what condition does the law of growth depend?", "a": "Upon reciprocal action. The individual is complete at all times and this makes it possible to receive only as we give."}, {"q": "What is it that we give?", "a": "Thought."}, {"q": "What do we receive?", "a": "Thought, which is substance in equilibrium and which is constantly being differentiated in form by what we think."}]}, {"id": "mkp-19", "title": "Part Nineteen", "n": 19, "letter": ["Fear is a powerful form of thought. It paralyzes the nerve centers, thus affecting the circulation of the blood.", "This, in turn, paralyzes the muscular system, so that fear affects the entire being, body, brain and nerve, physical, mental, and muscular.", "Of course the way to overcome fear is to become conscious of power. What is this mysterious vital force which we call power? We do not know, but then, neither do we know what electricity is.", "But we do know that by conforming to the requirements of the law by which electricity is governed, it will be our obedient servant; that it will light our homes, our cities, run our machinery, and serve us in many useful capacities.", "And so it is with vital force. Although we do not know what it is, and possibly may never know, we do know that it is a primary force which manifests through living bodies, and that by complying with the laws and principles by which it is governed, we can open ourselves to a more abundant inflow of this vital energy, and thus express the highest possible degree of mental, moral, and spiritual efficiency.", "This part tells of a very simple way of developing this vital force. If you put into practice the information outlined in this lesson you will soon develop the sense of power which has ever been the distinguishing mark of genius."], "body": ["1. The search for truth is no longer a haphazard adventure, but it is a systematic process, and is logical in its operation. Every kind of experience is given a voice in shaping its decision.", "2. In seeking the truth we are seeking ultimate cause; we know that every human experience is an effect; then if we may ascertain the cause, and if we shall find that this cause is one which we can consciously control, the effect or the experience will be within our control also.", "3. Human experience will then no longer be the football of fate; a man will not be the child of fortune, but destiny. Fate and fortune will be controlled as readily as a captain controls his ship, or an engineer his train.", "4. All things are finally resolvable into the same element and as they are thus translatable, one into the other, they must ever be in relation and may never be in opposition to one another.", "5. In the physical world there are innumerable contrasts, and these may for convenience sake, be designated by distinctive names. There are sizes, colors, shades or ends to all things. There is a North Pole, and a South Pole, an inside and an outside, a seen and an unseen, but these expressions merely serve to place extremes in contrast.", "6. They are names given to two different parts of one quantity. The two extremes are relative; they are not separate entities, but are two parts or aspects of the whole.", "7. In the mental world we find the same law; we speak of knowledge and ignorance, but ignorance is but a lack of knowledge and is therefore found to be simply a word to express the absence of knowledge; it has no principle in itself.", "8. In the Moral World we again find the same law; we speak of good and evil, but Good is a reality, something tangible, while Evil is found to be simply a negative condition, the absence of Good. Evil is sometimes thought to be a very real condition, but it has no principle, no vitality, no life; we know this because it can always be destroyed by Good; just as Truth destroys Error and light destroys darkness, so Evil vanishes when Good appears; there is therefore but one principle in the Moral World.", "9. We find exactly the same law obtaining in the Spiritual world; we speak of Mind and Matter as two separate entities, but clearer insight makes it evident that there is but one operative principle and that is Mind.", "10. Mind is the real and the eternal. Matter is forever changing; we know that in the eons of time a hundred years is but as a day. If we stand in any large city and let the eye rest on the innumerable large and magnificent buildings, the vast array of modern automobiles, cellular telephones, the electric lights, and all the other conveniences of modern civilization, we may remember that not one of them was there just over a century ago, and if we could stand on the same spot in a hundred years from now, in all probability we should find that but few of them remained.", "11. In the animal kingdom we find the same law of change. The millions and millions of animals come and go, a few years constituting their span of life. In the plant world the change is still more rapid. Many plants and nearly all grasses come and go in a single year. When we pass to the inorganic, we expect to find something more substantial, but as we gaze on the apparently solid continent, we are told that it arose from the ocean; we see the giant mountain and are told that the place where it now stands was once a lake; and as we stand in awe before the great cliffs in the Yosemite Valley we can easily trace the path of the glaciers which carried all before them.", "12. We are in the presence of continual change, and we know that this change is but the evolution of the Universal Mind, the grand process whereby all things are continually being created anew, and we come to know that matter is but a form which Mind takes and is therefore simply a condition. Matter has no principle; Mind is the only principle.", "13. We have then come to know that Mind is the only principle which is operative in the physical, mental, moral and spiritual world.", "14. We also know that this mind is static, mind at rest, we also know that the ability of the individual to think is his ability to act upon the Universal Mind and convert it into dynamic mind, or mind in motion.", "15. In order to do this fuel must be applied in the form of food, for man cannot think without eating, and so we find that even a spiritual activity such as thinking cannot be converted into sources of pleasure and profit except by making use of material means.", "16. It requires energy of some kind to collect electricity and convert it into a dynamic power, it requires the rays of the sun to give the necessary energy to sustain plant life, so it also requires energy in the form of food to enable the individual to think and thereby act upon the Universal Mind.", "17. You may know that thought constantly, eternally is taking form, is forever seeking expression, or you may not, but the fact remains that if your thought is powerful, constructive, and positive, this will be plainly evident in the state of your health, your business and your environment; if your thought is weak, critical, destructive and negative generally, it will manifest in your body as fear, worry and nervousness, in your finance as lack and limitation, and in discordant conditions in your environment.", "18. All wealth is the offspring of power; possessions are of value only as they confer power. Events are significant only as they affect power; all things represent certain forms and degrees of power.", "19. A knowledge of cause and effect as shown by the laws governing steam, electricity, chemical affinity and gravitation enables men to plan courageously and to execute fearlessly. These laws are called Natural Laws, because they govern the physical world, but all power is not physical power; there is also mental power, and there is moral and spiritual power.", "20. What are our schools, our universities, but mental powerhouses, places where mental power is being developed?", "21. As there are many mighty powerhouses for the application of power to ponderous machinery, whereby raw material is collected and converted into the necessities and comforts of life, so the mental powerhouses collect the raw material and cultivate and develop it into a power which is infinitely superior to all the forces of nature, marvelous though they may be.", "22. What is this raw material which is being collected in these thousands of mental powerhouses all over the world and developed into a power which is evidently controlling every other power? In its static form it is Mind - in its dynamic form, it is Thought.", "23. This power is superior because it exists on a higher plane, because it has enabled man to discover the law by which these wonderful forces of Nature could be harnessed and made to do the work of hundreds and thousands of men. It has enabled man to discover laws whereby time and space have been annihilated, and the law of gravitation overcome.", "24. Thought is the vital force or energy which is being developed and which has produced such startling results in the last half century as to bring about a world which would be absolutely inconceivable to a man existing only 50 or 25 years ago. If such results have been secured by organizing these mental powerhouses in 50 years, what may not be expected in another 50 years?", "25. The substance from which all things are created is infinite in quantity; we know that light travels at the rate of 186,000 miles per second, and we know that there are stars so remote that it takes light 2,000 years to reach us, and we know that such starts exist in all parts of the heaven; we know, too, that this light comes in waves, so that if the ether on which these waves travel was not continuous the light would fail to reach us; we can then only come to the conclusion that this substance, or ether, or raw material, is universally present.", "26. How, then, does it manifest in form? In electrical science a battery is formed by connecting the opposite poles of zinc and copper, which causes a current to flow from one to the other and so provides energy. This same process is repeated in respect to every polarity, and as all form simply depends upon the rate of vibration and consequent relations of atoms to each other, if we wish to change the form of manifestation we must change the polarity. This is the principle of causation.", "27. For your exercise this week, concentrate, and when I use the word concentrate, I mean all that the word implies; become so absorbed in the object of your thought that you are conscious of nothing else, and do this a few minutes every day. You take the necessary time to eat in order that the body may be nourished, why not take the time to assimilate your mental food?", "28. Let the thought rest on the fact that appearances are deceptive. The earth is not flat, neither is it stationary; the sky is not a dome, the sun does not move, the stars are not small specks of light, and matter which was once supposed to be fixed has been found to be in a state of perpetual flux.", "29. Try to realize that the day is fast approaching—its dawn is now at hand—when modes of thought and action must be adjusted to rapidly increasing knowledge of the operation of eternal principles.", "Silent thought, is, after all, the mightiest agent in human affairs.", "Channing"], "qa": [{"q": "How are extremes placed in contrast?", "a": "They are designated by distinctive names, such as inside and outside, top and bottom, light and dark, good and bad."}, {"q": "Are these separate entities?", "a": "No, they are parts or aspects of one Whole."}, {"q": "What is the one creative Principle in the physical, mental and spiritual world?", "a": "The Universal Mind, or the Eternal Energy from which all things proceed."}, {"q": "How are we related to this creative Principle?", "a": "By our ability to think."}, {"q": "How does this creative Principle become operative?", "a": "Thought is the seed, which results in action and action results in form."}, {"q": "Upon what does form depend?", "a": "Upon the rate of vibration."}, {"q": "How may the rate of vibration be changed?", "a": "By mental action."}, {"q": "Upon what does mental action depend?", "a": "Upon polarity, action and reaction, between the individual and the Universal."}, {"q": "Does the creative energy originate in the individual or the Universal?", "a": "In the Universal, but the Universal can manifest only through the individual."}, {"q": "Why is the individual necessary?", "a": "Because the Universal is static, and requires energy to start it in motion. This is furnished by food which is converted into energy, which in turn enables the individual to think. When the individual stops eating he stops thinking; then he no longer acts upon the Universal; there is consequently no longer any action or reaction; the Universal is then only pure mind in static form—mind at rest."}]}, {"id": "mkp-20", "title": "Part Twenty", "n": 20, "letter": ["For many years there has been an endless discussion as to the origin of evil. Theologians have told us that God is Love, and that God is Omnipresent. If this be true, there is no place where God is not. Where, then, is Evil, Satan and Hell?", "Let us see: God is Spirit. Spirit is the Creative Principle of the Universe. Man is made in the image and likeness of God. Man is therefore a spiritual being. The only activity which spirit possesses is the power to think. Thinking is therefore a creative process. All form is therefore the result of the thinking process. The destruction of form must also be a result of the thinking process. Fictitious representations of form are the result of the creative power of thought, as in Hypnotism. Apparent representation of form are the result of the creative power of thought, as in Spiritualism. Invention, organization and constructive work of all kinds are the result of the creative power of thought, as in concentration. When the creative power of thought is manifested for the benefit of humanity, we call the result good. When the creative power of thought is manifested in a destructive or evil manner, we call the result evil.", "This indicates the origin of both good and evil; they are simply words which have been coined in order to indicate the nature of the result of the thinking or creative process. Thought necessarily precedes and predetermines action; action precedes and predetermines condition.", "Part Twenty will throw more light upon this important subject."], "body": ["1. The spirit of a thing is that thing; it is necessarily fixed, changeless and eternal. The spirit of you is—you; without the spirit you would be nothing. It becomes active through your recognition of it and its possibilities.", "2. You may have all the wealth in Christendom, but unless you recognize it and make use of it, it will have no value; so with your spiritual wealth: unless you recognize it and use it, it will have no value. The one and only condition of spiritual power is use or recognition.", "3. All great things come through recognition; the scepter of power is consciousness, and thought is its messenger, and this messenger is constantly molding the realities of the invisible world into the conditions and environments of your objective world.", "4. Thinking is the true business of life, power is the result. You are at all times dealing with the magical power of thought and consciousness. What results can you expect so long as you remain oblivious to the power which has been placed within your control?", "5. So long as you do this you limit yourself to superficial conditions, and make of yourself a beast of burden for those who think; those who recognize their power; those who know that unless we are willing to think we shall have to work, and the less we think the more we shall have to work, and the less we shall get for our work.", "6. The secret of power is a perfect understanding of the principles, forces, methods and combinations of Mind, and a perfect understanding of our relationship to the Universal Mind. It is well to remember that this principle is unc
