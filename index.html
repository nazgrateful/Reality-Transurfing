 then automatic, then subconscious in order that the mind again may be freed from this detail and advanced to still other activities.", "When you realize this, you will have found a source of power which will enable you to take care of any situation in life which may develop."], "body": ["1. The necessary interaction of the conscious and subconscious mind requires a similar interaction between the corresponding systems of nerves. Judge Troward indicates the very beautiful method in which this interaction is effected. He says: The cerebro-spinal system is the organ of the conscious mind and the sympathetic is the organ of the subconscious. The cerebro-spinal is the channel through which we receive conscious perception from the physical senses and exercise control over the movements of the body. This system of nerves has its centre in the brain.", "2. The Sympathetic System has its centre in a ganglionic mass at the back of the stomach known as the Solar Plexus, and is the channel of that mental action which unconsciously supports the vital functions of the body.", "3. The connection between the two systems is made by the vagus nerve which passes out of the cerebral region as a portion of the voluntary system to the thorax, sending out branches to the heart and lungs, and finally passing through the diaphragm, it loses its outer coating and becomes identified with the nerves of the Sympathetic System, so forming a connecting link between the two and making man physically a “single entity”.", "4. We have seen that every thought is received by the brain, which is the organ of the conscious; it is here subjected to our power of reasoning. When the objective mind has been satisfied that the thought is true it is sent to the Solar Plexus, or the brain of the subjective mind, to be made into our flesh, to be brought forth into the world as reality. It is then no longer susceptible to any argument whatever. The subconscious mind cannot argue; it only acts. It accepts the conclusions of the objective mind as final.", "5. The Solar Plexus has been likened to the sum of the body, because it is a central point of distribution for the energy which the body is constantly generating. This energy is very real energy, and this sun is a very real sun, and the energy is being distributed by very real nerves to all parts of the body, and is thrown off in an atmosphere which envelopes the body.", "6. If this radiation is sufficiently strong the person is called magnetic; he is said to be filled with personal magnetism. Such a person may wield an immense power for good. His presence alone will often bring comfort to the troubled minds with which he comes in contact.", "7. When the Solar Plexus is in active operation and is radiating life, energy and vitality to every part of the body, and to every one whom he meets, the sensations are pleasant, the body is filled with health and all with whom he comes in contact experience a pleasant sensation.", "8. If there is any interruption of this radiation the sensations are unpleasant, the flow of life and energy to some part of the body is stopped, and this is the cause of every ill to the human race, physical, mental or environmental.", "9. Physical because the sun of the body is no longer generating sufficient energy to vitalize some part of the body; mental because the conscious mind is dependent upon the subconscious mind for the vitality necessary to support its thought, and environmental, because the connection between the subconscious mind and the Universal mind, is being interrupted.", "10. The Solar Plexus is the point at which the part meets with the whole, where the finite becomes Infinite, where the Uncreate becomes create, the Universal becomes individualized, the Invisible becomes visible. It is the point at which life appears and there is no limit to the amount of life an individual may generate from this Solar centre.", "11. This centre of energy is Omnipotent because it is the point of contact with all life and all intelligence. It can therefore accomplish whatever it is directed to accomplish, and herein lies the power of the conscious mind; the subconscious can and will carry out such plans and ideas as may be suggested to it by the conscious mind.", "12. Conscious thought, then, is master of this sun centre from which the life and energy of the entire body flows and the quality of the thought which we entertain determines the quality of the thought which this sun will radiate, and the character of the thought which our conscious mind entertains will determine the character of the thought which this sun will radiate, and the nature of the thought which our conscious mind entertains will determine the nature of thought which this sun will radiate, and consequently will determine the nature of the experience which will result.", "13. It is evident, therefore, that all we have to do is let our light shine; the more energy we can radiate, the more rapidly shall we be enabled to transmute undesirable conditions into sources of pleasure and profit. The important question, then, is how to let this light shine; how to generate this energy.", "14. Non-resistant thought expands the Solar Plexus; resistant thought contracts it. Pleasant thought expands it; unpleasant thought contracts it. Thoughts of courage, power, confidence and hope all produce a corresponding state, but the one arch enemy of the Solar Plexus which must be absolutely destroyed before there is any possibility of letting any light shine is fear. This enemy must be completely destroyed; he must be eliminated; he must be expelled forever; he is the cloud which hides the sun; which causes a perpetual gloom.", "15. It is this personal devil which makes men fear the past, the present and the future; fear themselves, their friends and their enemies; fear everything and everybody. When fear is effectually and completely destroyed, your light will shine, the clouds will disperse and you will have found the source of power, energy and life.", "16. When you find that you are really one with the Infinite power, and when you can consciously realize this power by a practical demonstration of your ability to overcome any adverse condition by the power of your thought, you will have nothing to fear; fear will have been destroyed and you will have come into possession of your birthright.", "17. It is our attitude of mind toward life which determines the experiences with which we are to meet; if we expect nothing, we shall have nothing; if we demand much, we shall receive the greater portion. The world is harsh only as we fail to assert ourselves. The criticism of the world is bitter only to those who cannot compel room for their ideas. It is fear of this criticism that causes many ideas to fail to see the light of day.", "18. But the man who knows that he has a Solar Plexus will not fear criticism or anything else; he will be too busy radiating courage, confidence, and power; he will anticipate success by his mental attitude; he will pound barriers to pieces, and leap over the chasm of doubt and hesitation which fear places in his path.", "19. A knowledge of our ability to consciously radiate health, strength and harmony will bring us into a realization that there is nothing to fear because we are in touch with Infinite Strength.", "20. This knowledge can be gained only by making practical application of this information. We learn by doing; through practice the athlete comes powerful.", "21. As the following statement is of considerable importance, I will put it in several ways, so that you cannot fail to get the full significance of it. If you are religiously inclined, I would say, you can let your light shine. If your mind has a bias toward physical science, I would say you can wake the Solar Plexus; or, if you prefer the strictly scientific interpretation, I will say that you can impress your subconscious mind.", "22. I have already told you what the result of this impression will be. It is the method in which you are now interested. You have already learned that the subconscious is intelligent and that it is creative, and responsive to the will of the conscious mind. What, then, is the most natural way of making the desired impression? Mentally concentrate on the object of your desire; when you are concentrating you are impressing the subconscious.", "23. This is not the only way, but it is a simple and effective way, and the most direct way, and consequently the way in which the best results are secured. It is the method which is producing such extraordinary results that many think that miracles are being accomplished.", "24. It is the method by which every great inventor, every great financier, every great statesman has been enabled to convert the subtle and invisible force of desire, faith and confidence into actual, tangible, concrete facts in the objective world.", "25. The subconscious mind is a part of the Universal mind. The Universal is the creative principle of the Universe, a part must be the same in kind and quality as the whole. This means that this creative power is absolutely unlimited; it is not bound by precedent of any kind, and consequently has no prior existing pattern by which to apply its constructive principle.", "26. We have found that the subconscious mind is responsive to our conscious will, which means that the unlimited creative power of the Universal Mind is within control of the conscious mind of the individual.", "27. When making a practical application of this principle, in accordance with the exercises given in the subsequent lessons, it is well to remember that it is not necessary to outline the method by which the subconscious will produce the results you desire. The finite cannot inform the Infinite. You are simply to say what you desire, not how you are to obtain it.", "28. You are the channel by which the undifferentiated is being differentiated, and this differentiation is being accomplished by appropriation. It only requires recognition to set causes in motion which will bring about results in accordance with your desire, and this is accomplished because the Universal can act only through the individual, and the individual can act only through the Universal; they are one.", "29. For your exercise this week, I will ask you to go one step further. I want you to not only be perfectly still, and inhibit all thought as far as possible, but relax, let go, let the muscles take their normal condition; this will remove all pressure from the nerves, and eliminate that tension which so frequently produces physical exhaustion.", "30. Physical relaxation is a voluntary exercise of the will and the exercise will be found to be of great value, as it enables the blood to circulate freely to and from the brain and body.", "31. Tensions leads to mental unrest and abnormal mental activity of the mind; it produces worry, care, fear and anxiety. Relaxation is therefore an absolute necessity in order to allow the mental faculties to exercise the greatest freedom.", "32. Make this exercise as thorough and complete as possible, mentally determine that you will relax every muscle and nerve, until you feel quiet and restful and at peace with yourself and the world.", "33. The Solar Plexus will then be ready to function and you will be surprised at the result."], "qa": [{"q": "What system of nerves is the organ of the Conscious Mind?", "a": "The Cerebro-spinal."}, {"q": "What system of nerves is the organ of the subconscious mind?", "a": "The sympathetic."}, {"q": "What is the central point of distribution for energy which the body is constantly generating?", "a": "The solar plexus."}, {"q": "How may this distribution be interrupted?", "a": "By resistant, critical, discordant thoughts, but especially fear."}, {"q": "What is the result of such interruption?", "a": "Every ill with which the human race is afflicted."}, {"q": "How may this energy be controlled and directed?", "a": "By conscious thought."}, {"q": "How may fear be completely eliminated?", "a": "By an understanding and recognition of the true source of all power."}, {"q": "What determines the experiences with which we meet in life?", "a": "Our predominant mental attitude."}, {"q": "How may we awake the solar plexus?", "a": "Mentally concentrate upon the condition which we desire to see manifested in our lives."}, {"q": "What is the creative principle of the Universe?", "a": "The Universal Mind."}]}, {"id": "mkp-4", "title": "Part Four", "n": 4, "letter": ["Enclosed herewith I hand you Part Four. This part will show you why what you think, or do, or feel, is an indication of what you are.", "Thought is energy and energy is power, and it is because all the religions, sciences and philosophies with which the world has heretofore been familiar have been based upon the manifestation of this energy instead of the energy itself, that the world has been limited to effects, while causes have been ignored or misunderstood.", "For this reason we have God and the Devil in religion, positive and negative in science, and good and bad in philosophy.", "The Master Key reverses the process; it is interested only in cause, and the letters received from students tell a marvelous story; they indicate conclusively that students are finding the cause whereby they may secure for themselves health, harmony, abundance, and whatever else may be necessary for their welfare and happiness.", "Life is expressive and it is our business to express ourselves harmoniously and constructively. Sorrow, misery, unhappiness, disease and poverty are not necessities and we are constantly eliminating them.", "But this process of eliminating consists in rising above and beyond limitation of any kind. He who has strengthened and purified his thought need not concern himself about microbes, and he who has come into an understanding of the law of abundance will go at once to the source of supply.", "It is thus that fate, fortune, and destiny will be controlled as readily as a captain controls his ship, or an engineer, his train."], "body": ["1. The “I” of you is not the physical body; that is simply an instrument which the “I” uses to carry out its purposes; the “I” cannot be the Mind, for the mind is simply another instrument which the “I” uses with which to think, reason, and plan.", "2. The “I” must be something which controls and directs both the body and the mind; something which determines what they shall do and how they shall act. When you come into a realization of the true nature of this “I”, you will enjoy a sense of power which you have never before known.", "3. Your personality is made up of countless individual characteristics, peculiarities, habits, and traits of character; these are the result of your former method of thinking, but they have nothing to do with the real “I.”", "4. When you say “I think” the “I” tells the mind what it shall think; when you say “I go” the “I” tells the physical body where it shall go; the real nature of this “I” is spiritual, and is the source of the real power which comes to men and women when they come into a realization of their true nature.", "5. The greatest and most marvelous power which this “I” has been given is the power to think, but few people know how to think constructively, or correctly, consequently they achieve only indifferent results. Most people allow their thoughts to dwell on selfish purposes, the inevitable result of an infantile mind. When a mind becomes mature, it understands that the germ of defeat is in every selfish thought.", "6. The trained mind knows that every transaction must benefit every person who is in any way connected with the transaction, and any attempt to profit by the weakness, ignorance or necessity of another will inevitably operate to his disadvantage.", "7. This is because the individual is a part of the Universal. A part cannot antagonize any other part, but, on the contrary, the welfare of each part depends upon a recognition of the interest of the whole.", "8. Those who recognize this principle have a great advantage in the affairs of life. They do not wear themselves out. They can eliminate vagrant thoughts with facility. They can readily concentrate to the highest possible degree on any subject. They do not waste time or money upon objects which can be of no possible benefit to them.", "9. If you cannot do these things it is because you have thus far not made the necessary effort. Now is the time to make the effort. The result will be exactly in proportion to the effort expended. One of the strongest affirmations which you can use for the purpose of strengthening the will and realizing your power to accomplish, is, “I can be what I will to be.”", "10. Every time you repeat it realize who and what this “I” is; try to come into a thorough understanding of the true nature of the “I”; if you do, you will become invincible; that is, provided that your objects and purposes are constructive and are therefore in harmony with the creative principle of the Universe.", "11. If you make use of this affirmation, use it continuously, night and morning, and as often during the day as you think of it, and continue to do so until it becomes a part of you; form the habit.", "12. Unless you do this, you had better not start at all, because modern psychology tells us that when we start something and do not complete it, or make a resolution and do not keep it, we are forming the habit of failure; absolute, ignominious failure. If you do not intend to do a thing, do not start; if you do start, see it through even if the heavens fall; if you make up your mind to do something, do it; let nothing, no one, interfere; the “I” in you has determined, the thing is settled; the die is cast, there is no longer any argument.", "13. If you carry out this idea, beginning with small things which you know you can control and gradually increase the effort, but never under any circumstances allowing your “I” to be overruled, you will find that you can eventually control yourself, and many men and women have found to their sorrow that it is easier to control a kingdom that to control themselves.", "14. But when you have learned to control yourself you will have found the “World Within” which controls the world without; you will have become irresistible; men and things will respond to your every wish without any apparent effort on your part.", "15. This is not so strange or impossible as it may appear when you remember that the “World Within” is controlled by the “I” and that this “I” is a part or one with the Infinite “I” which is the Universal Energy or Spirit, usually called God.", "16. This is not a mere statement or theory made for the purpose of confirming or establishing an idea, but it is a fact which has been accepted by the best religious thought as well as the best scientific thought.", "17. Herbert Spender said: “Amid all the mysteries by which we are surrounded, nothing is more certain than that we are ever in the presence of an Infinite and Eternal Energy from which all things proceed.”", "18. Lyman Abbott, in an address delivered before the Alumni of Bangor Theological Seminary, said: “We are coming to think of God as dwelling in man rather than as operating on men from without.”", "19. Science goes a little way in its search and stops. Science finds the ever-present Eternal Energy, but Religion finds the Power behind this energy and locates it within man. But this is by no means a new discovery; the Bible says exactly the same thing, and the language is just as plain and convincing: “Know ye not that ye are the temple of the living God?” Here, then, is the secret of the wonderful creative power of the “World Within.”", "20. Here is the secret of power, of mastery. To overcome does not mean to go without things. Self-denial is not success. We cannot give unless we get; we cannot be helpful unless we are strong. The Infinite is not a bankrupt and we who are the representatives of Infinite power should not be bankrupts either, and if we wish to be of service to others we must have power and more power, but to get it we must give it; we must be of service.", "21. The more we give the more we shall get; we must become a channel whereby the Universal can express activity. The Universal is constantly seeking to express itself, to be of service, and it seeks the channel whereby it can find the greatest activity, where it can do the most good, where it can be of greatest service to mankind.", "22. The Universal cannot express through you as long as you are busy with your plans, your own purposes; quiet the senses, seek inspiration, focus the mental activity on the within, dwell in the consciousness of your unity with Omnipotence. “Still water runs deep;” contemplate the multitudinous opportunities to which you have spiritual access by the Omnipresence of power.", "23. Visualize the events, circumstances and conditions which these spiritual connections may assist in manifesting. Realize the fact that the essence and soul of all things is spiritual and that the spiritual is the real, because it is the life of all there is; when the spirit is gone, the life is gone; it is dead; it has ceased to exist.", "24. These mental activities pertain to the world within, to the world of cause; and conditions and circumstances which result are the effect. It is thus that you become a creator. This is important work, and the higher, loftier, grander and more noble ideals which you can conceive, the more important the work will become.", "25. Over-work or over-play or over-bodily activity of any kind produces conditions of mental apathy and stagnation which makes it impossible to do the more important work which results in a realization of conscious power. We should, therefore, seek the Silence frequently. Power comes through repose; it is in the Silence that we can be still, and when we are still, we can think, and thought is the secret of all attainment.", "26. Thought is a mode of motion and is carried by the law of vibration the same as light or electricity. It is given vitality by the emotions through the law of love; it takes form and expression by the law of growth; it is a product of the spiritual “I”, hence its Divine, spiritual, and creative nature.", "27. From this it is evident that in order to express power, abundance or any other constructive purpose, the emotions must be called upon to give feeling to the thought so that it will take form. How may this purpose be accomplished? This is the vital point; how may we develop the faith, the courage, the feeling, which will result in accomplishment?", "28. The reply is, by exercise; mental strength is secured in exactly the same way that physical strength is secured, by exercise. We think something, perhaps with difficulty the first time; we think the same thing again, and it becomes easier this time; we think it again and again; it then becomes a mental habit. We continue to think the same thing; finally it becomes automatic; we can no longer help thinking this thing; we are now positive of what we think; there is no longer any doubt about it. We are sure; we know.", "29. Last week I asked you to relax, to let go physically. This week, I am going to ask you to let go mentally. If you practiced the exercise given you last week fifteen or twenty minutes a day in accordance with the instructions, you can no doubt relax physically; and anyone who cannot consciously do this quickly and completely is not a master of himself. He has not obtained freedom; he is still a slave to conditions. But I shall assume that you have mastered the exercise and are ready to take the next step, which is mental freedom.", "30. This week, after taking your usual position, remove all tension by completely relaxing, then mentally let go of all adverse conditions, such as hatred, anger, worry, jealousy, envy, sorrow, trouble or disappointment of any kind.", "31. You may say that you cannot “let go” of these things, but you can; you can do so by mentally determining to do so, by voluntary intention and persistence.", "32. The reason that some cannot do this is because they allow themselves to be controlled by the emotions instead of by their intellect. But those who will be guided by the intellect will gain the victory. You will not succeed the first time you try, but practice makes perfect, in this as in everything else, and you must succeed in dismissing, eliminating and completely destroying these negative and destructive thoughts; because they are the seed which is constantly germinating into discordant conditions of every conceivable kind and description.", "There is nothing truer than that the quality of thought which we entertain correlates certain externals in the outside world. This is the Law from which there is no escape. And it is this Law, this correlative of the thought with its object, that from time immemorial has led the people to believe in special providence.", "Wilmans"], "qa": [{"q": "What is thought?", "a": "Thought is spiritual energy."}, {"q": "How is it carried?", "a": "By the law of vibration."}, {"q": "How is it given vitality?", "a": "By the law of love."}, {"q": "How does it take form?", "a": "By the law of growth."}, {"q": "What is the secret of its creative power?", "a": "It is a spiritual activity."}, {"q": "How may we develop the faith, courage, and enthusiasm which will result in accomplishment?", "a": "By a recognition of our spiritual nature."}, {"q": "What is the secret of Power?", "a": "Service."}, {"q": "Why is this so?", "a": "Because we get what we give."}, {"q": "What is the Silence?", "a": "A physical stillness."}, {"q": "Of what value is it?", "a": "It is the first step to self-control, self-mastery."}]}, {"id": "mkp-5", "title": "Part Five", "n": 5, "letter": ["Enclosed herewith you will find Part Five. After studying this part carefully, you will see that every conceivable force or object or fact is the result of mind in action.", "Mind in action is thought, and thought is creative. Men are thinking now as they never thought before.", "Therefore, this is a creative age, and the world is awarding its richest prizes to the thinkers. Matter is powerless, passive, inert. Mind is force, energy, power. Mind shapes and controls matter. Every form which matter takes is but the expression of some pre-existing thought.", "But thought works no magic transformations; it obeys natural laws; it sets in motion natural forces; it releases natural energies; it manifests in your conduct and actions, and these in turn react upon your friends and acquaintances, and eventually upon the whole of your environment. You can originate thought, and, since thoughts are creative, you can create for yourself the things you desire."], "body": ["1. At least ninety per cent of our mental life is subconscious, so that those who fail to make use of this mental power live within very narrow limits.", "2. The subconscious can and will solve any problem for us if we know how to direct it. The subconscious processes are always at work; the only question is, are we to be simply passive recipients of this activity, or are we to consciously direct the work? Shall we have a vision of the destination to be reached, the dangers to be avoided, or shall we simply drift?", "3. We have found that mind pervades every part of the physical body and is always capable of being directed or impressed by authority coming from the objective or the more dominant portion of the mind.", "4. The mind, which pervades the body, is largely the result of heredity, which, in turn, is simply the result of all the environments of all past generations on the responsive and ever-moving life forces. An understanding of this fact will enable us to use our authority when we find some undesirable trait of character manifesting.", "5. We can consciously use all the desirable characteristics with which we have been provided and we can repress and refuse to allow the undesirable ones to manifest.", "6. Again, this mind which pervades our physical body is not only the result of hereditary tendencies, but is the result of home, business and social environment, where countless thousands of impressions, ideas, prejudices and similar thoughts have been received. Much of this has been received from others, the result of opinions, suggestions or statements; much of it is the result of our own thinking, but nearly all of it has been accepted with little or no examination or consideration.", "7. The idea seemed plausible, the conscious received it, passed it on to the subconscious, where it was taken up by the Sympathetic System and passed on to be built into our physical body. “The word has become flesh.”", "8. This, then, is the way we are consistently creating and recreating ourselves; we are today the result of our past thinking, and we shall be what we are thinking today, the Law of Attraction is bringing to us, not the things we should like, or the things we wish for, or the things some one else has, but it brings us “our own,” the things which we have created by our thought processes, whether consciously or unconsciously. Unfortunately, many of us are creating these things unconsciously.", "9. If either of us were building a home for ourselves, how careful we would be in regard to the plans; how we should study every detail; how we should watch the material and select only the best of everything; and yet how careless we are when it comes to building our Mental Home, which is infinitely more important than any physical home, as everything which can possibly enter into our lives depends upon the character of the material which enters into the construction of our Mental Home.", "10. What is the character of this material? We have seen that it is the result of the impressions which we have accumulated in the past and stored away in our subconscious Mentality. If these impressions have been of fear, of worry, of care, of anxiety; if they have been despondent, negative, doubtful, then the texture of the material which we are weaving today will be of the same negative material. Instead of being of any value, it will be mildewed and rotten and will bring us only more toil and care and anxiety. We shall be forever busy trying to patch it up and make it appear at least genteel.", "11. But if we have stored away nothing but courageous thought, if we have been optimistic, positive, and have immediately thrown any kind of negative thought on the scrap pile, have refused to have anything to do with it, have refused to associate with it or become identified with it in any way, what then is the result? Our mental material is now of the best kind; we can weave any kind of material we want; we can use any color we wish; we know that the texture is firm, that the material is solid, that it will not fade, and we have no fear, no anxiety concerning the future; there is nothing to cover, there are no patches to hide.", "12. These are psychological facts; there is no theory or guesswork about these thinking processes; there is nothing secret about them; in fact, they are so plain that every one can understand them. The thing to do is to have a mental house-cleaning, and to have this house-cleaning every day, and keep the house clean. Mental, moral and physical cleanliness are absolutely indispensable if we are to make progress of any kind.", "13. When this mental house-cleaning process has been completed, the material which is left will be suitable for the making of the kind of ideals or mental images which we desire to realize.", "14. There is a fine estate awaiting a claimant. Its broad acres, with abundant crops, running water and fine timber, stretch away as far as the eye can see. There is a mansion, spacious and cheerful, with rare pictures, a well-stocked library, rich hangings, and every comfort and luxury. All the heir has to do is to assert his heirship, take possession, and use the property. He must use it; he must not let it decay; for use is the condition on which he holds it. To neglect it is to lose possession.", "15. In the domain of mind and spirit, in the domain of practical power, such an estate is yours. You are the heir! You can assert your heirship and possess, and use this rich inheritance. Power over circumstances is one of its fruits, health, harmony and prosperity are assets upon its balance sheet. It offers you poise and peace. It costs you only the labor of studying and harvesting its great resources. It demands no sacrifice, except the loss of your limitations, your servitudes, your weakness. It clothes you with self-honor, and puts a scepter in your hands.", "16. To gain this estate, three processes are necessary: You must earnestly desire it. You must assert your claim. You must take possession.", "17. You admit that those are not burdensome conditions.", "18. You are familiar with the subject of heredity. Darwin, Huxley, Haeckel, and other physical scientists have piled evidence mountain high that heredity is a law attending progressive creation. It is progressive heredity which gives man his erect attitude, his power of motion, the organs of digestions, blood circulation, nerve force, muscular force, bone structure and a host of other faculties on the physical side. There are even more impressive facts concerning heredity of mind force. All these constitute what may be called your human heredity.", "19. But there is a heredity which the physical scientists have not compassed. It lies beneath and antecedent to all their researches. At a point where they throw up their hands in despair, saying they cannot account for what they see, this divine heredity is found in full sway.", "20. It is the benignant force which decrees primal creation. It thrills down from the Divine, direct into every created being. It originates life, which the physical scientist has not done, nor ever can do. It stands out among all forces supreme, unapproachable. No human heredity can approach it. No human heredity measures up to it.", "21. This Infinite Life flows through you; is you. Its doorways are but the faculties which comprise your consciousness. To keep open these doors is the Secret of Power. Is it not worthwhile to make the effort?", "22. The great fact is, that the source of all life and all power is from within. Persons, circumstances and events may suggest need and opportunities, but the insight, strength and power to answer these needs will be found within.", "23. Avoid counterfeits. Build firm foundations for your consciousness upon forces which flow direct from the Infinite source, the Universal Mind of which you are the image and likeness.", "24. Those we have come into possession of this inheritance are never quite the same again. They have come into possession of a sense of power hitherto undreamed of. They can never again be timid, weak, vacillating, or fearful. They are indissolubly connected with Omnipotence. Something in them has been aroused; they have suddenly discovered that they possess a tremendous latent ability of which they were heretofore entirely unconscious.", "25. This power is from within, but we cannot receive it unless we give it. Use is the condition upon which we hold this inheritance. We are each of us but the channel through which the Omnipotent power is being differentiated into form; unless we give, the channel is obstructed and we can receive no more. This is true on every plane of existence and in every field of endeavor and all walks of life. The more we give, the more we get. The athlete who wishes to get strong must make use of the strength he has, and the more he gives the more he will get. The financier who wishes to make money must make use of the money he has, for only by using it can he get more.", "26. The merchant who does not keep his goods going out will soon have none coming in; the corporation which fails to give efficient service will soon lack customers; the attorney who fails to get results will soon lack clients, and so it goes everywhere; power is contingent upon a proper use of the power already in our possession; what is true in every field of endeavor, every experience in life, is true of the power from which every other power known among men is begotten—spiritual power. Take away the spirit and what is left? Nothing.", "27. If then the spirit is all there is, upon the recognition of this fact must depend the ability to demonstrate all power, whether physical, mental or spiritual.", "28. All possession is the result of the accumulative attitude of mind, or the money consciousness; this is the magic wand which will enable you to receive the idea, and it will formulate plans for you to execute, and you will find as much pleasure in the execution as in the satisfaction of attainment and achievement.", "29. Now, go to your room, take the same seat, the same position as heretofore, and mentally select a place which has pleasant associations. Make a complete mental picture of it, see the buildings, the grounds, the trees, friends, associations, everything complete. At first, you will find yourself thinking of everything under the sun, except the ideal upon which you desire to concentrate. But do not let that discourage you. Persistence will win, but persistence requires that you practice these exercises every day without fail."], "qa": [{"q": "What proportion of our mental life is subconscious?", "a": "At least ninety per cent."}, {"q": "Is this vast mental storehouse generally utilized?", "a": "No."}, {"q": "Why not?", "a": "Few understand or appreciate the fact that it is an activity which they may consciously direct."}, {"q": "Where has the conscious mind received its governing tendencies?", "a": "From heredity—which means that it is the result of all the environments of all past generations."}, {"q": "What is the law of attraction bringing to us?", "a": "Our “Own.”"}, {"q": "What is our “Own”?", "a": "What we inherently are, and is the result of our past thinking, both conscious and subconscious."}, {"q": "Of what is the material with which we construct our mental home composed?", "a": "The thoughts which we entertain."}, {"q": "What is the Secret of Power?", "a": "A recognition of the omnipresence of omnipotence."}, {"q": "Where does it originate?", "a": "All life and all power is from within."}, {"q": "Upon what is the possession of power contingent?", "a": "Upon a proper use of the power already in our possession."}]}, {"id": "mkp-6", "title": "Part Six", "n": 6, "letter": ["It is my privilege to enclose Part Six. This part will give you an excellent understanding of the most wonderful piece of mechanism which has ever been created. A mechanism whereby you may create for yourself Health, Strength, Success, Prosperity or any other condition which you desire.", "Necessities are demands, and demands create action, and actions bring about results. The process of evolution is constantly building our tomorrows out of our todays. Individual development, like Universal development, must be gradual with an ever-increasing capacity and volume.", "The knowledge that if we infringe upon the rights of others, we become moral thorns and find ourselves entangled at every turn of the road, should be an indication that success is contingent upon the highest moral ideal, which is “The greatest good to the greatest number.” Aspiration, desire and harmonious relations constantly and persistently maintained will accomplish results. The greatest hindrance is erroneous and fixed ideas.", "To be in tune with eternal truth we must possess poise and harmony within. In order to receive intelligence the receiver must be in tune with the transmitter.", "Thought is a product of Mind and Mind is creative, but this does not mean that the Universal will change its modus operandi to suit us or our ideas, but it does mean that we can come into harmonious relationship with the Universal, and when we have accomplished this we may ask anything to which we are entitled, and the way will be made plain."], "body": ["1. The Universal Mind is so wonderful that it is difficult to understand its utilitarian powers and possibilities and its unlimited producing effects.", "2. We have found that this Mind is not only all intelligence but all substance. How, then, is it to be differentiated in form? How are we to secure the effect which we desire?", "3. Ask any electrician what the effect of electricity will be and he will reply that “Electricity is a form of motion and its effect will depend upon the mechanism to which it is attached.” Upon this mechanism will depend whether we shall have heat, light, power, music or any of the other marvelous demonstration of power to which this vital energy has been harnessed.", "4. What effect can be produced by thought? The reply is that thought is mind in motion (just as wind is air in motion), and its effect will depend entirely on the “mechanism to which it is attached.”", "5. Here, then, is the secret of all mental power; it depends entirely on the mechanism which we attach.", "6. What is this mechanism? You know something of the mechanism which has been invented by Edison, Bell, Marconi and other electrical wizards, by which place and space and time have become only figures of speech, but did you ever stop to think that the mechanism which has been given you for transforming the Universal, Omnipresent Potential Power was invented by a greater inventor than Edison?", "7. We are accustomed to examining the mechanism of the implements which we use for tilling the soil, and we try to get an understanding of the mechanism of the automobile which we drive, but most of us are content to remain in absolute ignorance of the greatest piece of mechanism which as ever come into existence, the brain of man.", "8. Let us examine the wonders of this mechanism; perhaps we shall thereby get a better understanding of the various effects of which it is the cause.", "9. In the first place, there is the great mental world in which we live and move and have our being; this world is omnipotent, omniscient and omnipresent; it will respond to our desire in direct ratio to our purpose and faith; the purpose must be in accordance with the law of our being, that is, it must be creative or constructive; our faith must be strong enough to generate a current of sufficient strength to bring our purpose into manifestation. “As thy faith is, so be it unto thee,” bears the stamp of scientific test.", "10. The effects which are produced in the world without are the result of the action and reaction of the individual upon the universal; that is the process which we call thinking; the brain is the organ through which this process is accomplished; think of the wonder of it all! Do you love music, flowers, literature, or are you inspired by the thought of ancient or modern genius? Remember, every beauty to which you respond must have its corresponding outline in your brain before you can appreciate it.", "11. There is not a single virtue or principle in the storehouse of nature which the brain cannot express. The brain is an embryonic world, ready to develop at any time as necessity may arise. If you can comprehend that this is a scientific truth and one of the wonderful laws of nature, it will be easier for you to get an understanding of the mechanism by which these extraordinary results are being accomplished.", "12. The nervous system has been compared to an electric circuit with its battery of cells in which force is originated, and its white matter to insulated wires by which the current is conveyed; it is through these channels that every impulse or desire is carried through the mechanism.", "13. The spinal cord is the great motor and sensory pathway by which messages are conveyed to and from the brain; then, there is the blood supply plunging through the veins and arteries, renewing our energy and strength, the perfectly arranged structure upon which the entire physical body rests, and, finally, the delicate and beautiful skin, clothing the entire mechanism is a mantle of beauty.", "14. This then is the “Temple of the living God” and the individual “I” is given control and upon his understanding of the mechanism which is within his control will the result depend.", "15. Every thought sets the brain cells in action; at first the substance upon which the thought is directed fails to respond, but if the thought is sufficiently refined and concentrated, the substance finally yields and expresses perfectly.", "16. This influence of the mind can be exerted upon any part of the body, causing the elimination of any undesirable effect.", "17. A perfect conception and understanding of the laws governing in the mental world cannot fail to be of inestimable value in the transaction of business, as it develops the power of discernment and gives a clearer understanding and appreciation of facts.", "18. The man who looks within instead of without cannot fail to make use of the mighty forces which will eventually determine his course in life and so bring him into vibration with all that is best, strongest and most desirable.", "19. Attention or concentration is probably; the most important essential in the development of mind culture. The possibilities of attention when properly directed are so startling that they would hardly appear credible to the uninitiated. The cultivation of attention is the distinguishing characteristic of every successful man or woman, and is the very highest personal accomplishment which can be acquired.", "20. The power of attention can be more readily understood by comparing it with a magnifying glass in which the rays of sunlight are focused; they possess no particular strength as long as the glass is moved about and the rays directed from one place to another; but let the glass be held perfectly still and let the rays be focused on one spot for any length of time, the effect will become immediately apparent.", "21. So with the power of thought; let power be dissipated by scattering the thought from one object to another, and no result is apparent; but focus this power through attention or concentration on any single purpose for any length of time and nothing becomes impossible.", "22. A very simple remedy for a very complex situation, some will say. All right, try it, you who have had no experience in concentrating the thought on a definite purpose or object. Choose any single object and concentrate your attention on it for a definite purpose for even ten minutes; you cannot do it; the mind will wander a dozen times and it will be necessary to bring it back to the original purpose, and each time the effect will have been lost and at the end of the ten minutes nothing will have been gained, because you have not been able to hold your thought steadily to the purpose.", "23. It is, however, through attention that you will finally be able to overcome obstacles of any kind that appear in your path onward and upward, and the only way to acquire this wonderful power is by practice—practice makes perfect, in this as in anything else.", "24. In order to cultivate the power of attention, bring a photograph with you to the same seat in the same room in the same position as heretofore. Examine it closely at least ten minutes, note the expression of the eyes, the form of the features, the clothing, the way the hair is arranged; in fact, note every detail shown on the photograph carefully. Now cover it and close your eyes and try to see it mentally; if you can see every detail perfectly and can form a good mental image of the photograph, you are to be congratulated; if not, repeat the process until you can.", "25. This step is simply for the purpose of preparing the soil; next week we shall be ready to sow the seed.", "26. It is by such exercises as these that you will finally be able to control your mental moods, your attitude, your consciousness.", "27. Great financiers are learning to withdraw from the multitude more and more, that they may have more time for planning, thinking and generating the right mental moods.", "28. Successful businessmen are constantly demonstrating the fact that it pays to keep in touch with the thought of other successful businessmen.", "29. A single idea may be worth millions of dollars, and these ideas can only come to those who are receptive, who are prepared to receive them, who are in successful frame of mind.", "30. Men are learning to place themselves in harmony with the Universal Mind; they are learning the unity of all things; they are learning the basic methods and principles of thinking, and this is changing conditions and multiplying results.", "31. They are finding that circumstances and environment follow the trend of mental and spiritual progress; they find that growth follows knowledge; action follows inspiration; opportunity follows perception; always the spiritual first, then the transformation into the infinite and illimitable possibilities of achievement.", "32. As the individual is but the channel for the differentiation of the Universal, these possibilities are necessarily inexhaustible.", "33. Thought is the process by which we may absorb the Spirit of Power, and hold the result in our inner consciousness until it becomes a part of our ordinary consciousness. The method of accomplishing this result by the persistent practice of a few fundamental principles, as explained in this System, is the master key which unlocks the storehouse of Universal Truth.", "34. The two great sources of human suffering at present are bodily disease and mental anxiety. These may be readily traced to the infringement of some Natural Law. This is, no doubt, owing to the fact that so far knowledge has largely remained partial, but the clouds of darkness which have accumulated through long ages are beginning to roll away and with them many of the miseries that attend imperfect information.", "That a man can change himself, improve himself, re-create himself, control his environment, and master his own destiny is the conclusion of every mind who is wide-awake to the power of right thought in constructive action", "Larsen"], "qa": [{"q": "What are some of the effects which can be produced by electricity?", "a": "Heat, light, power, music."}, {"q": "Upon what do these various effects depend?", "a": "Upon the mechanism to which electricity is attached."}, {"q": "What is the result of the action and interaction of the individual mind upon the Universal?", "a": "The conditions and experiences with which we meet."}, {"q": "How may these conditions be changed?", "a": "By changing the mechanism by which the Universal is differentiated in form."}, {"q": "What is this mechanism?", "a": "The brain."}, {"q": "How may it be changed?", "a": "By the process we call thinking. Thoughts produce brain cells, and these cells respond to the corresponding thought in the Universal."}, {"q": "Of what value is the power of concentration?", "a": "It is the very highest personal accomplishment which can be acquired, and the distinguishing characteristic of every successful man or woman."}, {"q": "How may it be acquired?", "a": "By faithfully practicing the exercises in this System."}, {"q": "Why is this so important?", "a": "Because it will enable us to control our thoughts, and since thoughts are causes conditions must be effects; if we can control the cause we can also control the effect."}, {"q": "What is changing conditions and multiplying results in the objective world?", "a": "Men are learning the basic methods of constructive thinking."}]}, {"id": "mkp-7", "title": "Part Seven", "n": 7, "letter": ["Through all the ages man has believed in an invisible power, through which and by which all things have been created and are continually being re-created. We may personalize this power and call it God, or we may think of it as the essence or spirit, which permeates all things, but in either case the effect is the same.", "So far as the individual is concerned, the objective, the physical, the visible, is the personal, that which can be cognized by the senses. It consists of body, brain and nerves. The subjective is the spiritual, the invisible, the impersonal.", "The personal is conscious because it is a personal entity. The impersonal, being the same in kind and quality as all other Being, is not conscious of itself and has therefore been termed the subconscious.", "The personal, or conscious, has the power of will and choice, and can therefore exercise discrimination in the selection of methods whereby to bring about the solution of difficulties.", "The impersonal, or spiritual, being a part or one with the source, and origin of all power, can necessarily exercise no such choice, but, on the contrary, it has Infinite resources at its command. It can and does bring about results by methods concerning which the human or individual mind can have no possible conception.", "You will therefore see that it is your privilege to depend upon the human will with all its limitations and misconceptions, or you may utilize the potentialities of Infinity by making use of the subconscious mind. Here, then, is the scientific explanation of the wonderful power which has been put within your control, if you but understand, appreciate and recognize it.", "One method of consciously utilizing this omnipotent power is outlined in Part Seven."], "body": ["1. Visualization is the process of making mental images, and the image is the mold or model which will serve as a pattern from which your future will emerge.", "2. Make the pattern clear and make it beautiful; do not be afraid; make it grand; remember that no limitation can be placed upon you by any one but yourself; you are not limited as to cost or material; draw on the Infinite for your supply, construct it in your imagination; it will have to be there before it will ever appear anywhere else.", "3. Make the image clear and clean-cut, hold it firmly in the mind and you will gradually and constantly bring the thing nearer to you. You can be what “you will to be.”", "4. This is another psychological fact which is well known, but unfortunately, reading about it will not bring about any result which you may have in mind; it will not even help you to form the mental image, much less bring it into manifestation. Work is necessary - labor, hard mental labor, the kind of effort which so few are willing to put forth.", "5. The first step is idealization. It is likewise the most important step, because it is the plan on which you are going to build. It must be solid; it must be permanent. The architect, when he plans a 30-storey building, has every line and detail pictured in advance. The engineer, when he spans a chasm, first ascertains the strength requirements of a million separate parts.", "6. They see the end before a single step is taken; so you are to picture in your mind what you want; you are sowing the seed, but before sowing any seed you want to know what the harvest is to be. This is Idealization. If you are not sure, return to the chair daily until the picture becomes plain; it will gradually unfold; first the general plan will be dim, but it will take shape, the outline will take form, then the details, and you will gradually develop the power by which you will be enabled to formulate plans which will eventually materialize in the objective world. You will come to know what the future holds for you.", "7. Then comes the process of visualization. You must see the picture more and more complete, see the detail, and, as the details begin to unfold the ways and means for bringing it into manifestation will develop. One thing will lead to another. Thought will lead to action, action will develop methods, methods will develop friends, and friends will bring about circumstances, and, finally, the third step, or Materialization, will have been accomplished.", "8. We all recognize the Universe must have been thought into shape before it ever could have become a material fact. And if we are willing to follow along the lines of the Great Architect of the Universe, we shall find our thoughts taking form, just as the universe took concrete form. It is the same mind operating through the individual. There is no difference in kind or quality, the only difference is one of degree.", "9. The architect visualizes his building, he sees it as he wishes it to be. His thought becomes a plastic mold from which the building will eventually emerge, a high one or a low one, a beautiful one or a plain one, his vision takes form on paper and eventually the necessary material is utilized and the building stands complete.", "10. The inventor visualizes his idea in exactly the same manner, for instance, Nikola Tesla, he with the giant intellect, one of the greatest inventors of all ages, the man who has brought forth the most amazing realities, always visualizes his inventions before attempting to work them out. He did not rush to embody them in form and then spend his time in correcting defects. Having first built up the idea in his imagination, he held it there as a mental picture, to be reconstructed and improved by his thought. “In this way,” he writes in the Electrical Experimenter. “I am enabled to rapidly develop and perfect a conception without touching anything. When I have gone so far as to embody in the invention every possible improvement I can think of, and see no fault anywhere, I put into concrete, the product of my brain. Invariably my devise works as I conceived it should; in twenty years there has not been a single exception.”", "11. If you can conscientiously follow these directions, you will develop Faith, the kind of Faith that is the “Substance of things hoped for, the evidence of things not seen”; you will develop confidence, the kind of confidence that leads to endurance and courage; you will develop the power of concentration which will enable you to exclude all thoughts except the ones which are associated with your purpose.", "12. The law is that thought will manifest in form, and only one who knows how to be the divine thinker of his own thoughts can ever take a Master’s place and speak with authority.", "13. Clearness and accuracy are obtained only by repeatedly having the image in mind. Each repeated action renders the image more clear and accurate than the preceding, and in proportion to the clearness and accuracy of the image will the outward manifestation be. You must build it firmly and securely in your mental world, the world within, before it can take form in the world without, and you can build nothing of value, even in the mental world unless you have the proper material. When you have the material you can build anything you wish, but make sure of your material. You cannot make broadcloth from shoddy.", "14. This material will be brought out by millions of silent mental workers and fashioned into the form of the image which you have in mind.", "15. Think of it! You have over five million of these mental workers, ready and in active use; brain cells they are called. Besides this, there is another reserve force of at least an equal number, ready to be called into action at the slightest need. Your power to think, then, is almost unlimited, and this means that your power to create the kind of material which is necessary to build for yourself any kind of environment which you desire is practically unlimited.", "16. In addition to these millions of mental workers, you have billions of mental workers in the body, every one of which is endowed with sufficient intelligence to understand and act upon any message or suggestion given. These cells are all busy creating and recreating the body, but, in addition to this, they are endowed with psychic activity whereby they can attract to themselves the substance necessary for perfect development.", "17. They do this by the same law and in the same manner that every form of life attracts to itself the necessary material for growth. The oak, the rose, the lily, all require certain material for their most perfect expression and they secure it by silent demand, the Law of Attraction, the most certain way for you to secure what you require for your most complete development.", "18. Make the Mental Image; make it clear, distinct, perfect; hold it firmly; the ways and means will develop; supply will follow the demand; you will be led to do the right thing at the right time and in the right way. Earnest Desire will bring about Confident Expectation, and this in turn must be reinforced by Firm Demand. These three cannot fail to bring about Attainment, because the Earnest Desire is the feeling, the Confident Expectation is the thought, and the Firm Demand is the will, and, as we have seen, feeling gives vitality to thought and the will holds it steadily until the law of Growth brings it into manifestation.", "19. Is it not wonderful that man has such tremendous power within himself, such transcendental faculties concerning which he had no conception? Is it not strange that we have always been taught to look for strength and power “without?” We have been taught to look everywhere but “within” and whenever this power manifested in our lives we were told that it was something supernatural.", "20. There are many who have come to an understanding of this wonderful power, and who make serious and conscientious efforts to realize health, power and other conditions, and seem to fail. They do not seem able to bring the Law into operation. The difficulty in nearly every case is that they are dealing with externals. They want money, power, health and abundance, but they fail to realize that these are effects and can come only when the cause is found.", "21. Those who will give no attention to the world without will seek only to ascertain the truth, will look only for wisdom, will find that this wisdom will unfold and disclose the source of all power, that it will manifest in thought and purpose which will create the external conditions desired. This truth will find expression in noble purpose and courageous action.", "22. Create ideals only, give no thought to external conditions, make the world within beautiful and opulent and the world without will express and manifest the condition which you have within. You will come into a realization of your power to create ideals and these ideals will be projected into the world of effect.", "23. For instance, a man is in debt. He will be continually thinking about the debt, concentrating on it, and as thoughts are causes the result is that he not only fastens the debt closer to him, but actually creates more debt. He is putting the great law of Attraction into operation with the usual and inevitable result—Loss leads to greater “Loss.”", "24. What, then, is the correct principle? Concentrate on the things you want, not on the things you do not want. Think of abundance; idealize the methods and plans for putting the Law of Abundance into operation. Visualize the condition which the Law of Abundance creates; this will result in manifestation.", "25. If the law operates perfectly to bring about poverty, lack and every form of limitation for those who are continually entertaining thoughts of lack and fear, it will operate with the same certainty to bring about conditions of abundance and opulence for those who entertain thoughts of courage and power.", "26. This is a difficult problem for many; we are too anxious; we manifest anxiety, fear, distress; we want to do something; we want to help; we are like a child who has just planted a seed and every fifteen minutes goes and stirs up the earth to see if it is growing. Of course, under such circumstances, the seed will never germinate, and yet this is exactly what many of us do in the mental world.", "27. We must plant the seed and leave it undisturbed. This does not mean that we are to sit down and do nothing, by no means; we will do more and better work then we have ever done before, new channels will constantly be provided, new doors will open; all that is necessary is to have an open mind, be ready to act when the time comes.", "28. Thought force is the most powerful means of obtaining knowledge, and if concentrated on any subject will solve the problem. Nothing is beyond the power of human comprehension, but in order to harness thought force and make it do your bidding, work is required.", "29. Remember that thought is the fire that creates the steam that turns the wheel of fortune, upon which your experiences depend.", "30. Ask yourself a few questions and then reverently await the response; do you not now and then feel the self with you? Do you assert this self or do you follow the majority? Remember that majorities are always led, they never lead. It was the majority that fought, tooth and nail, against the steam engine, the power loom and every other advance or improvement ever suggested.", "31. For your exercise this week, visualize your friend, see him exactly as you last saw him, see the room, the furniture, recall the conversation, now see his face, see it distinctly, now talk to him about some subject of mutual interest; see his expression change, watch him smile. Can you do this? All right, you can; then arouse his interest, tell him a story of adventure, see his eyes light up with the spirit of fun or excitement. Can you do all of this? If so, your imagination is good, you are making excellent progress."], "qa": [{"q": "What is visualization?", "a": "The process of making mental pictures."}, {"q": "What is the result of this method of thought?", "a": "By holding the image or picture in mind, we can gradually but surely bring the thing nearer to us. We can be what we will to be."}, {"q": "What is Idealization?", "a": "It is a process of visualizing or idealizing the plans which will eventually materialize in our objective world."}, {"q": "Why are clearness and accuracy necessary?", "a": "Because “seeing” creates “feeling” and “feeling” creates “being.” First the mental, then the emotional, then the illimitable possibilities of achievement."}, {"q": "How are they obtained?", "a": "Each repeated action renders the image more accurate than the former one."}, {"q": "How is the material for the construction of your mental image secured?", "a": "By millions of mental workers. Brain cells they are called."}, {"q": "How are the necessary conditions for bringing about the materialization of your ideal in the objective world secured?", "a": "By the Law of Attraction. The natural law by which all conditions and experiences are brought about."}, {"q": "What three steps are necessary in order to bring this law into operation?", "a": "Earnest Desire, Confident Expectation, Firm Demand."}, {"q": "Why do many fail?", "a": "Because they concentrate on loss, disease and disaster. The law is operating perfectly; the things they fear are coming upon them."}, {"q": "What is the alternative?", "a": "Concentrate on the ideals which you desire to see manifested in your life."}]}, {"id": "mkp-8", "title": "Part Eight", "n": 8, "letter": ["In this Part you will find that you may freely choose what you think but the result of your thought is governed by an immutable law! Is not this a wonderful thought? Is it not wonderful to know that our lives are not subject to caprice or variability of any kind? That they are governed by law. This stability is our opportunity, because by complying with the law we can secure the desired effect with invariable precision.", "It is the Law which makes the Universe one grand paean of Harmony. If it were not for law, the Universe would be a Chaos instead of a Cosmos.", "Here, then, is the secret of the origin of booth good and evil, this is all the good and evil there ever was or ever will be.", "Let me illustrate. Thought results in action, if your thought is constructive and harmonious, the result will be good; if your thought is destructive or in harmonious, the result will be evil.", "There is therefore but one law, one principle, on cause, one Source of Power, and good and evil are simply words which have been coined to indicate the result of our action, or our compliance or non-compliance with this law.", "The importance of this is well illustrated in the lives of Emerson and Carlyle. Emerson loved the good and his life was a symphony of peace and harmony, Carlyle hated the bad, and his life was a record of perpetual discord and inharmony.", "Here we have two grand men, each intent upon achieving the same ideal, but one makes use of constructive thought and is therefore in harmony with Natural Law, the other makes use of destructive thought and therefore brings upon himself discord of every kind and character.", "It is evident therefore that we are to hate nothing, not even the “bad,” because hatred is destructive, and we shall soon find that by entertaining destructive thought we are sowing the “wind” and in turn shall reap the “whirlwind.”"], "body": ["1. Thought contains a vital principle, because it is the creative principle of the Universe and by its nature will combine with other similar thoughts.", "2. As the one purpose of life is growth, all principles underlying existence must contribute to give it effect. Thought, therefore, takes form and the law of growth eventually brings it into manifestation.", "3. You may freely choose what you think, but the result of your thought is governed by an immutable law. Any line of thought persisted in cannot fail to produce its result in the character, health and circumstances of the individual. Methods whereby we can substitute habits of constructive thinking for those which we have found produce only undesirable effects are therefore of primary importance.", "4. We all know that this is by no means easy. Mental habits are difficult to control, but it can be done and the way to do it is to begin at once to substitute constructive thought for destructive thought. Form the habit of analyzing every thought. If it is necessary, if its manifestation in the objective will be a benefit, not only to yourself, but to all whom it may affect in any way, keep it; treasure it; it is of value; it is in tune with the Infinite; it will grow and develop and produce fruit an hundred fold. On the other hand, it will be well for you to keep this quotation from George Matthews Adams, in mind, “Learn to keep the door shut, keep out of your mind, out of your office, and out of your world, every element that seeks admittance with no definite helpful end in view.”", "5. If your thought has been critical or destructive, and has resulted in any condition of discord or inharmony in your environment, it may be necessary for you to cultivate a mental attitude which will be conducive to constructive thought.", "6. The imagination will be found to be a great assistance in this direction; the cultivation of the imagination leads to the development of the ideal out of which your future will emerge.", "7. The imagination gathers up the material by which the Mind weaves the fabric in which your future is to be clothed.", "8. Imagination is the light by which we can penetrate new worlds of thought and experience.", "9. Imagination is the mighty instrument by which every discoverer, every inventor, opened the way from precedent to experience. Precedent said, “It cannot be done;” experience said, “It is done.”", "10. Imagination is a plastic power, molding the things of sense into new forms and ideals.", "11. Imagination is the constructive form of thought which must precede every constructive form of action.", "12. A builder cannot build a structure of any kind until he has first received the plans from the architect, and the architect must get them from his imagination.", "13. The Captain of Industry cannot build a giant corporation which may coordinate hundreds of smaller corporations and thousands of employees, and utilize millions of dollars of capital until he has first created the entire work in his imagination. Objects in the material world are as clay in the potter’s hand; it is in the Master Mind that the real things are created, and it is by the use of the imagination that the work is done. In order to cultivate the imagination it must be exercised. Exercise is necessary to cultivate mental muscle as well as physical muscle. It must be supplied with nourishment or it cannot grow.", "14. Do not confuse Imagination with Fancy, or that form of daydreaming in which some people like to indulge. Daydreaming is a form of mental dissipation which may lead to mental disaster.", "15. Constructive imagination means mental labor, by some considered to be the hardest kind of labor, but, if so, it yields the greatest returns, for all the great things in life have come to men and women who had the capacity to think, to imagine, and to make their dreams come true.", "16. When you have become thoroughly conscious of the fact that Mind is the only creative principle, that it is Omnipotent, Omniscient and Omnipresent, and that you can consciously come into harmony with this Omnipotence through your power of thought, you will have taken a long step in the right direction.", "17. The next step is to place yourself in position to receive this power. As it is Omnipresent, it must be within you. We know that this is so because we know that all power is from within, but it must be developed, unfolded, cultivated; in order to do this we must be receptive, and this receptivity is acquired just as physical strength is gained, by exercise.", "18. The law of attraction will certainly and unerringly bring to you the conditions, environment, and experiences in life, corresponding with your habitual, characteristic, predominant mental attitude. Not what you think once in a while when you are in church, or have just read a good book, BUT your predominant mental attitude is what counts.", "19. You can not entertain weak, harmful, negative thoughts ten hours a day and expect to bring about beautiful, strong and harmonious conditions by ten minutes of strong, positive, creative thought.", "20. Real power comes from within. All power that anybody can possibly use is within man, only waiting to be brought into visibility by his first recognizing it, and then affirming it as his, working it into his consciousness until he becomes one with it.", "21. People say that they desire abundant life, and so they do, but so many interpret this to mean that if they will exercise their muscles or breathe scientifically, eat certain foods in certain ways, drink so many glasses of water every day of just a certain temperature, keep out of drafts, they will attain the abundant life they seek. The result of such methods is but indifferent. However, when man awakens to the truth, and affirms his oneness with all Life, he finds that he takes on the clear eye, the elastic step, the vigor of youth; he finds that he has discovered the source of all power.", "22. All mistakes are but the mistakes of ignorance. Knowledge gaining and consequent power is what determines growth and evolution. The recognition and demonstration of knowledge is what constitutes power, and this power is spiritual power, and this spiritual power is the power which lies at the heart of all things; it is the soul of the universe.", "23. This knowledge is the result of man’s ability to think; thought is therefore the germ of man’s conscious evolution. When man ceases to advance in his thoughts and ideals, his forces immediately begin to disintegrate and his countenance gradually registers these changing conditions.", "24. Successful men make it their business to hold ideals of the conditions which they wish to realize. They constantly hold in mind the next step necessary to the ideal for which they are striving. Thoughts are the materials with which they build, and the imagination is their mental workshop. Mind is the ever-moving force with which they secure the persons and circumstance necessary to build their success structure, and imagination is the matrix in which all great things are fashioned.", "25. If you have been faithful to your ideal, you will hear the call when circumstances are ready to materialize your plans and results will correspond in the exact ratio of your fidelity to your ideal. The ideal steadily held is what pre-determines and attracts the necessary conditions for its fulfillment.", "26. It is thus that you may weave a garment of spirit and power into the web of your entire existence; it is thus that you may lead a charmed life and be forever protected from all harm; it is thus that you may become a positive force whereby conditions of opulence and harmony may be attracted to you.", "27. This is the leaven which is gradually permeating the general consciousness and is largely responsible for the conditions of unrest which are everywhere evident.", "28. In the last Part you created a mental image, you brought it from the invisible into the visible; this week I want you to take an object and follow it back to its origination, see of what it really consists. If you do this you will develop imagination, insight, perception, and sagacity. These come not by the superficial observation of the multitude, but by a keen analytical observation which sees below the surface.", "29. It is the few who know that the things which they see are only effects, and understand the causes by which these effects were brought into existence.", "30. Take the same position as heretofore and visualize a Battleship; see the grim monster floating on the surface of the water; there appears to be no life anywhere about; all is silence; you know that by far the largest part of the vessel is under water; out of sight; you know that the ship is as large and as heavy as a twenty-story skyscraper; you know that there are hundreds of men ready to spring to their appointed task instantly; you know that every department is in charge of able, trained, skilled officials who have proven themselves competent to take charge of this marvelous piece of mechanism; you know that although it lies apparently oblivious to everything else, it has eyes which see everything for miles around, and nothing is permitted to escape its watchful vision; you know that while it appears quiet, submissive and innocent, it is prepared to hurl a steel projectile weighing thousands of pounds at an enemy many miles away; this and much more you can bring to mind with comparatively no effort whatever. But how did the battleship come to be where it is; how did it come into existence in the first place? All of this you want to know if you are a careful observer.", "31. Follow the great steel plates through the foundries, see the thousands of men employed in their production; go still further back, and see the ore as it comes from the mine, see it loaded on barges or cars, see it melted and properly treated; go back still further and see the architect and engineers who planned the vessel; let the thought carry you back still further in order to determine why they planned the vessel; you will see that you are now so far back that the vessel is something intangible, it no longer exists, it is now only a thought existing in the brain of the architect; but from where did the order come to plan the vessel? Probably from the Secretary of Defense; but probably this vessel was planned long before the war was thought of, and that Congress had to pass a bill appropriating the money; possibly there was opposition, and speeches for or against the bill. Whom do these Congressmen represent? They represent you and me, so that our line of thought begins with the Battleship and ends with ourselves, and we find in the last analysis that our own thought is responsible for this and many other things, of which we seldom think, and a little furthe
